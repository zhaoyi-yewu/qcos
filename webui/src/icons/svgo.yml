# svgo v3/v4 config
# replace default config

# multipass: true

plugins:
  # v3+ format: each plugin is an object with `name` and optional `params`.
  # The v1 style of `- pluginName: { ... }` was removed in svgo 3.
  - name: removeAttrs
    params:
      attrs:
        - 'fill'
        - 'fill-rule'
