<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="icon" href="/favicon.ico">
    <title>QCOS</title>
    <script>
      // Mermaid uses Object.hasOwn, which is unavailable before Edge 93.
      // Load the polyfill inline so it runs before any generated module chunk.
      if (typeof Object.hasOwn !== 'function') {
        Object.defineProperty(Object, 'hasOwn', {
          configurable: true,
          writable: true,
          value: function hasOwn(object, property) {
            return Object.prototype.hasOwnProperty.call(Object(object), property)
          }
        })
      }

      // xterm uses Element.replaceChildren, unavailable before Edge 86.
      if (typeof Element.prototype.replaceChildren !== 'function') {
        Object.defineProperty(Element.prototype, 'replaceChildren', {
          configurable: true,
          writable: true,
          value: function replaceChildren(...nodes) {
            while (this.firstChild) {
              this.removeChild(this.firstChild)
            }
            this.append(...nodes)
          }
        })
      }
    </script>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but QCOS doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
