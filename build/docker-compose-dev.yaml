version: '3'
services:
  qcos-dev:
    container_name: qcos-dev
    image: ${REGISTRY}${QCOS_IMAGE_NAME}:${QCOS_IMAGE_VERSION}
    privileged: true
    network_mode: "host"
    restart: always
    stdin_open: True
    tty: True
    environment:
      - DEBUG=${DEBUG}
      - QCOS_CONTAINER_NAME=${QCOS_CONTAINER_NAME}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    volumes:
      - /etc/hosts:/etc/hosts
      - /etc/timezone:/etc/timezone
      - /etc/localtime:/etc/localtime
      - /etc/qcos:/etc/qcos
      - /var/log/qcos:/var/log/qcos
      - /var/run/qcos:/var/run/qcos
      - ${QCOS_LOCAL_SRC_DIR}/src:/root/qcos
    entrypoint: /entrypoint.sh
