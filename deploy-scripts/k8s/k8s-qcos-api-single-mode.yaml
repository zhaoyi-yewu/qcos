# Create namespace
apiVersion: v1
kind: Namespace
metadata:
  name: ${QCOS_NAMESPACE}
---
# Deploy prefect-server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefect-server
  namespace: ${QCOS_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prefect-server
  template:
    metadata:
      labels:
        app: prefect-server
    spec:
      hostNetwork: false
      restartPolicy: Always
      initContainers:
      - name: init-prefect-server
        image: ${REGISTRY}${QCOS_IMAGE_NAME}:${QCOS_IMAGE_VERSION}
        imagePullPolicy: IfNotPresent
        command: [
          'sh', '-c',
          'rm -rf /var/qcos/db/prefect.db-shm /var/qcos/db/prefect.db-wal; mkdir -p /var/qcos/db/; mkdir -p /var/qcos/storage'
        ]
        volumeMounts:
        - name: database-dir
          mountPath: /var/qcos
      containers:
      - name: prefect-server
        image: ${REGISTRY}${PREFECT_IMAGE_NAME}:${PREFECT_IMAGE_VERSION}
        imagePullPolicy: IfNotPresent
        command: ["prefect", "server", "start", "--host", ""]
        env:
        - name: TZ
          value: "Asia/Shanghai"
        - name: PREFECT_SERVER_API_HOST
          value: "${PREFECT_SERVER_API_HOST}"
        - name: PREFECT_API_URL
          value: "${PREFECT_API_URL}"
        - name: PREFECT_SERVER_DATABASE_CONNECTION_URL
          value: "${PREFECT_SERVER_DATABASE_CONNECTION_URL}"
          #value: "sqlite+aiosqlite:////var/qcos/db/prefect.db?timeout=30&journal_mode=WAL"
        - name: PREFECT_SERVER_ANALYTICS_ENABLED
          value: "false"
        - name: PREFECT_API_DATABASE_TIMEOUT
          value: "30"
        - name: PREFECT_LOCAL_STORAGE_PATH
          value: "/var/qcos/storage"
        - name: PREFECT_API_DEFAULT_LIMIT
          value: "100000"
        - name: PYTHONPATH
          value: "/root/qcos-project/src"
        resources:
          requests:
            cpu: "2000m"
            memory: "4Gi"
          limits:
            cpu: "4000m"
            memory: "8Gi"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 4200
          initialDelaySeconds: 60
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 4200
          initialDelaySeconds: 10
          periodSeconds: 60
          timeoutSeconds: 10
          successThreshold: 1
        volumeMounts:
        - name: database-dir
          mountPath: /var/qcos
      volumes:
      - name: database-dir
        persistentVolumeClaim:
          claimName: ${K8S_DATABASE_PVC}
#      nodeSelector:
#        qcos-prefect: enabled
#      affinity:
#        podAntiAffinity:
#          requiredDuringSchedulingIgnoredDuringExecution:
#          - labelSelector:
#              matchLabels:
#                app: prefect-server
#            topologyKey: "kubernetes.io/hostname"
---
# prefect-server service (ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: prefect-server
  namespace: ${QCOS_NAMESPACE}
spec:
  selector:
    app: prefect-server
  type: ClusterIP
  ports:
  - port: ${PREFECT_SERVER_PORT}
    targetPort: 4200
---
# Deploy redis
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ${QCOS_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      hostNetwork: false
      restartPolicy: Always
      containers:
      - name: redis
        image: ${REGISTRY}${REDIS_IMAGE_NAME}:${REDIS_IMAGE_VERSION}
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          value: "Asia/Shanghai"
        resources:
          requests:
            cpu: "1000m"
            memory: "2Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
#      nodeSelector:
#        redis: enabled
#      affinity:
#        podAntiAffinity:
#          requiredDuringSchedulingIgnoredDuringExecution:
#          - labelSelector:
#              matchLabels:
#                app: redis
#            topologyKey: "kubernetes.io/hostname"
---
# redis service (ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ${QCOS_NAMESPACE}
spec:
  selector:
    app: redis
  type: ClusterIP
  ports:
  - port: ${REDIS_SERVER_PORT}
    targetPort: 6379
---
# Deploy qcos
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${QCOS_CONTAINER_NAME}
  namespace: ${QCOS_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${QCOS_CONTAINER_NAME}
  template:
    metadata:
      labels:
        app: ${QCOS_CONTAINER_NAME}
    spec:
      hostNetwork: false
      # [Optional] config hostAliases
      # hostAliases:
      #  - ip: "10.0.0.1"
      #    hostnames:
      #      - test.com
      restartPolicy: Always
      initContainers:
      - name: wait-prefect-server
        # wait prefect server
        image: ${REGISTRY}${QCOS_IMAGE_NAME}:${QCOS_IMAGE_VERSION}
        imagePullPolicy: Always
        command: [
          'sh', '-c',
          'echo "prefect-server: http://prefect-server.${QCOS_NAMESPACE}:${PREFECT_SERVER_PORT}/api"; until wget -q --spider http://prefect-server.${QCOS_NAMESPACE}:${PREFECT_SERVER_PORT}/api; do echo "waiting for prefect-server ..."; sleep 2; done; echo "prefect-server is ready"'
        ]
      containers:
      - name: ${QCOS_CONTAINER_NAME}
        image: ${REGISTRY}${QCOS_IMAGE_NAME}:${QCOS_IMAGE_VERSION}
        imagePullPolicy: Always
        stdin: true
        tty: true
        workingDir: /root
        command: ["/entrypoint.sh"]
        env:
        - name: DEBUG
          value: "${DEBUG}"
        - name: DEV
          value: "${DEV}"
        - name: TZ
          value: "Asia/Shanghai"
        - name: QCOS_CONTAINER_NAME
          value: "${QCOS_CONTAINER_NAME}"
        - name: API_SERVER_LISTEN_IP
          value: ${API_SERVER_LISTEN_IP}
        - name: API_SERVER_LISTEN_PORT
          value: ${API_SERVER_LISTEN_PORT}
        - name: QCOS_SERVER_IP
          value: ${QCOS_SERVER_IP}
        - name: QCOS_SERVER_PORT
          value: ${QCOS_SERVER_PORT}
        - name: QCOS_AUTH_MODE
          value: ${QCOS_AUTH_MODE}
        - name: QCOS_DATABASE_CONNECTION_URL
          value: ${QCOS_DATABASE_CONNECTION_URL}
        - name: QCOS_VIRTUAL_INSTANCE_ID
          value: ${QCOS_VIRTUAL_INSTANCE_ID}
        - name: DEVICE_LIST
          value: ${DEVICE_LIST}
        - name: MAX_JOBS
          value: ${MAX_JOBS}
        - name: MAX_QUEUED_JOBS
          value: ${MAX_QUEUED_JOBS}
        - name: MAX_JOBS_PER_USER
          value: ${MAX_JOBS_PER_USER}
        - name: PASSWORD_SALT
          value: ${PASSWORD_SALT}
        - name: API_LOG_FILE
          value: ${API_LOG_FILE}
        - name: PREFECT_API_URL
          value: ${PREFECT_API_URL:-http://127.0.0.1:4200/api}
        - name: PREFECT_SERVER_DATABASE_CONNECTION_URL
          value: ${PREFECT_SERVER_DATABASE_CONNECTION_URL:-sqlite+aiosqlite:////var/qcos/db/prefect.db?timeout=30&journal_mode=WAL}
        - name: PREFECT_LOCAL_STORAGE_PATH
          value: ${PREFECT_LOCAL_STORAGE_PATH:-/var/qcos/storage}
        - name: PREFECT_WORKER_QUERY_SECONDS
          value: ${PREFECT_WORKER_QUERY_SECONDS:-1}
        - name: PREFECT_WORKER_PREFETCH_SECONDS
          value: ${PREFECT_WORKER_PREFETCH_SECONDS:-1}
        - name: PREFECT_WORKER_HEARTBEAT_SECONDS
          value: ${PREFECT_WORKER_HEARTBEAT_SECONDS:-30}
        - name: PREFECT_LOGGING_LEVEL
          value: ${PREFECT_LOGGING_LEVEL:-INFO}
        - name: REDIS_SERVER_IP
          value: ${REDIS_SERVER_IP}
        - name: REDIS_SERVER_PORT
          value: ${REDIS_SERVER_PORT}
        resources:
          requests:
            cpu: "1000m"
            memory: "2Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        livenessProbe:
          tcpSocket:
            port: ${QCOS_API_SERVER_PORT}
          initialDelaySeconds: 30
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: ${QCOS_API_SERVER_PORT}
          initialDelaySeconds: 5
          periodSeconds: 60
          timeoutSeconds: 10
          successThreshold: 1
        volumeMounts:
        - name: qcos-config
          mountPath: /etc/qcos/qcos.toml
          subPath: qcos.toml
        - name: qcos-config-device-${QCOS_DEVICE_NAME}
          mountPath: /etc/qcos/conf.d/${QCOS_DEVICE_NAME}.toml
          subPath: ${QCOS_DEVICE_NAME}.toml
      volumes:
      - name: qcos-config
        configMap:
          name: qcos-config
      - name: qcos-config-device-${QCOS_DEVICE_NAME}
        configMap:
          name: qcos-config
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - prefect-server
            topologyKey: "kubernetes.io/hostname"
#      nodeSelector:
#        qcos-api: enabled
---
# qcos service (ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: ${QCOS_CONTAINER_NAME}
  namespace: ${QCOS_NAMESPACE}
spec:
  selector:
    app: ${QCOS_CONTAINER_NAME}
  type: ClusterIP
  ports:
  - port: ${QCOS_API_SERVER_PORT}
    targetPort: 18400
