version: '3'
services:
  prefect-server:
    container_name: prefect-server
    image: prefecthq/prefect:3.6.9-python3.13
    restart: always
    # harden the container: read-only root filesystem, no privilege
    # escalation, tmpfs for transient write paths. aligns with the other
    # docker-compose files in this directory (base/cli/webui/etc.).
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/tmp
      - /root/.cache
    command: /bin/sh -c 'sleep infinity'
    # prefect server start --host ""
    network_mode: "host"
    environment:
      TZ: Asia/Shanghai
      PREFECT_SERVER_API_HOST:
      PREFECT_SERVER_DATABASE_CONNECTION_URL: "postgresql+asyncpg://prefect:123456@127.0.0.1:5432/prefect"
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      PREFECT_API_DATABASE_TIMEOUT: "30"
      PREFECT_API_URL: http://100.78.61.22:4200/api
      PREFECT_API_DEFAULT_LIMIT: "200"
      PREFECT_TASKS_DISABLE_CACHING: "true"
      PREFECT_TASKS_DEFAULT_CACHE_RESULT_IN_MEMORY: "false"
      PREFECT_RESULTS_PERSIST_BY_DEFAULT: "false"
      PREFECT_SERVER_EVENTS_BUFFER_SIZE: "1"
      PREFECT_SERVER_EVENTS_RETENTION_PERIOD: "PT1H"
      # job cancel signal requires PREFECT_SERVER_EVENTS_STREAM_OUT_ENABLED=true
      PREFECT_SERVER_EVENTS_STREAM_OUT_ENABLED: "true"
      PREFECT_SERVER_EVENTS_MAXIMUM_SIZE_BYTES: "2000000"
      PREFECT_SERVER_SERVICES_EVENT_PERSISTER_QUEUE_MAX_SIZE: "5000"
      PREFECT_SERVER_DOCKET_URL: "redis://${REDIS_SERVER_IP}:${REDIS_SERVER_PORT}/1"
      PYTHONPATH: /root/qcos-project/src
    volumes:
      - /etc/hosts:/etc/hosts
      - /var/log/qcos:/var/log/qcos
      - /var/qcos:/var/qcos
      - /etc/qcos/prefect:/root/.prefect
      - /root/zhaoyi/projects/quantum-os/WuYueOs/temp/prefect-src/prefect:/usr/local/lib/python3.13/site-packages/prefect/

