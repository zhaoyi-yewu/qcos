version: '3'
services:
  qcos-dev-cli:
    container_name: qcos-dev-cli
    image: ${REGISTRY}${QCOS_IMAGE_NAME}-cli:${QCOS_IMAGE_VERSION}
    network_mode: "host"
    restart: always
    stdin_open: True
    tty: True
    working_dir: /root/qcos-project
    environment:
      DEBUG: ${DEBUG}
      DEV: ${DEV}
      TZ: Asia/Shanghai
      CONTAINER_NAME: ${QCOS_CONTAINER_NAME}
      QCOS_SERVER_IP: ${QCOS_SERVER_IP}
      QCOS_SERVER_PORT: ${QCOS_SERVER_PORT}
      QCOS_VIRTUAL_INSTANCE_ID: ${QCOS_VIRTUAL_INSTANCE_ID}
      PYTHONPATH: /root/qcos-project/src
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    volumes:
      - /etc/hosts:/etc/hosts
      - ${QCOS_LOCAL_SRC_DIR}:/root/qcos-project
      - ${QCOS_LOCAL_SRC_DIR}/bin/qcos-cli.py:/usr/bin/qcos-cli
    entrypoint: /entrypoint.sh
