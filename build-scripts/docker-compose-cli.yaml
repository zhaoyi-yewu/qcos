version: '3'
services:
  qcos-cli:
    container_name: qcos-cli
    image: ${REGISTRY}${QCOS_REGISTRY}${QCOS_IMAGE_NAME}-cli:${QCOS_IMAGE_VERSION}
    network_mode: "host"
    restart: always
    stdin_open: True
    tty: True
    working_dir: /root
    environment:
      TZ: Asia/Shanghai
      CONTAINER_NAME: ${QCOS_CONTAINER_NAME}-cli
      QCOS_SERVER_IP: ${QCOS_SERVER_IP}
      QCOS_SERVER_PORT: ${QCOS_SERVER_PORT}
      QCOS_VIRTUAL_INSTANCE_ID: ${QCOS_VIRTUAL_INSTANCE_ID}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    volumes:
      - /etc/hosts:/etc/hosts
      - /var/run/postgresql:/var/run/postgresql
    entrypoint: /entrypoint.sh
