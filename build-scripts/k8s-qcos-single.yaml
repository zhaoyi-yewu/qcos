# Create namespace
apiVersion: v1
kind: Namespace
metadata:
  name: qcos
---
# Create code-data PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: code-data-pvc
  namespace: qcos
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
  storageClassName: ""
---
# Create database PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: database-pvc
  namespace: qcos
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: ""
---
# 添加 QCOS ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: qcos-config
  namespace: qcos
data:
  qcos.toml: |
    [DEFAULT]
    DEBUG = False
    WORKERS = 8
    
    [API_SERVER]
    API_SERVER_LISTEN_IP = "0.0.0.0"
    API_SERVER_LISTEN_PORT = ${QCOS_API_PORT}
    API_LOG_FILE = "/var/log/qcos/qcos-api.log"
    PREFECT_LOG_FILE = "/var/log/qcos/qcos-prefect.log"
    
    [DEVICES]
    DEVICE_LIST = ["dummy"]

  dummy.toml: |
    [dummy]
    alias_name = "空载测试设备"
    driver = "DriverDummy"
    description = "空载测试设备(dummy)"
    
    [dummy.transpiler.qpu_configs]
    # Samples
    qubits = 6
    storage_area = ["S27", "S28", "S29", "S35", "S36", "S37"]
    operate_area = ["P27", "P28", "P29", "P35", "P36", "P37"]
    
    coupler_map.G0 = ["P27", "P35"]
    coupler_map.G1 = ["P28", "P36"]
    coupler_map.G2 = ["P29", "P37"]
    coupler_map.G3 = ["P27", "P28"]
    coupler_map.G4 = ["P35", "P36"]
    coupler_map.G5 = ["P28", "P29"]
    
    readout_error.S27 = 1.0
    readout_error.S28 = 2.0
    readout_error.S35 = 3.0
    readout_error.S36 = 4.0
    readout_error.S29 = 5.0
    readout_error.S37 = 6.0
    
    coupler_error.G0 = 3.0
    coupler_error.G1 = 3.0
    coupler_error.G2 = 3.0
    coupler_error.G3 = 3.0
    coupler_error.G4 = 3.0
    coupler_error.G5 = 3.0
    
    closest.P27 = "S27"
    closest.P28 = "S28"
    closest.P35 = "S35"
    closest.P36 = "S36"
    closest.P29 = "S29"
    closest.P37 = "S37"
    
    [dummy.transpiler.decomposition_rule]
    # Samples
    u3.params = ["a", "b", "c"]
    u3.gates = [
        ["rz", [0], ["c"]],
        ["rx", [0], ["pi/2"]],
        ["rz", [0], ["b+pi"]],
        ["rx", [0], ["pi/2"]],
        ["rz", [0], ["a+pi"]]
    ]
    h.gates = [
        ["rx", [0], ["pi/2"]]
    ]
---
# Deploy prefect-server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefect-server
  namespace: qcos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prefect-server
  template:
    metadata:
      labels:
        app: prefect-server
    spec:
      hostNetwork: false
      restartPolicy: Always
      containers:
      - name: prefect-server
        image: ${REGISTRY}${PREFECT_IMAGE_NAME}:${PREFECT_IMAGE_VERSION}
        command: ["prefect", "server", "start"]
        env:
        - name: TZ
          value: "Asia/Shanghai"
        - name: PREFECT_SERVER_API_HOST
          value: "${PREFECT_SERVER_API_HOST}"
        - name: PREFECT_API_URL
          value: "http://${PREFECT_SERVER_API_HOST}:${PREFECT_SERVER_PORT}/api"
        - name: PREFECT_SERVER_DATABASE_CONNECTION_URL
          value: "sqlite+aiosqlite:////var/qcos/db/prefect.db"
        - name: PREFECT_LOCAL_STORAGE_PATH
          value: "/var/qcos/storage"
        - name: PREFECT_API_DEFAULT_LIMIT
          value: "100000"
        resources:
          requests:
            cpu: "1000m"
            memory: "2Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 4200
          initialDelaySeconds: 60
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 4200
          initialDelaySeconds: 10
          periodSeconds: 60
          timeoutSeconds: 10
          successThreshold: 1
        volumeMounts:
        - name: code-data
          mountPath: /root/qcos
        - name: database-dir
          mountPath: /var/qcos
      volumes:
      - name: code-data
        persistentVolumeClaim:
          claimName: code-data-pvc
      - name: database-dir
        persistentVolumeClaim:
          claimName: database-pvc
      nodeSelector:
        qcos-prefect: enabled
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: prefect-server
            topologyKey: "kubernetes.io/hostname"
---
# prefect-server service (ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: prefect-server
  namespace: qcos
spec:
  selector:
    app: prefect-server
  type: ClusterIP
  ports:
  - port: ${PREFECT_SERVER_PORT}
    targetPort: ${PREFECT_SERVER_PORT}
---
# Deploy qcos
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qcos-api
  namespace: qcos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qcos-api
  template:
    metadata:
      labels:
        app: qcos-api
    spec:
      hostNetwork: false
      restartPolicy: Always
      initContainers:
      - name: wait-prefect-server
        image: busybox:1.35
        command: [
          'sh', '-c',
          'until wget -q --spider http://${PREFECT_SERVER_API_HOST}:${PREFECT_SERVER_PORT}/api; do echo "waiting for prefect-server ..."; sleep 2; done; echo "prefect-server is ready"'
        ]
      containers:
      - name: qcos
        image: ${REGISTRY}${QCOS_IMAGE_NAME}:${QCOS_IMAGE_VERSION}
        # securityContext:
        #   privileged: true
        stdin: true
        tty: true
        workingDir: /root
        command: ["/entrypoint.sh"]
        env:
        - name: DEBUG
          value: ${DEBUG}
        - name: DEV
          value: ${DEV}
        - name: TZ
          value: "Asia/Shanghai"
        - name: QCOS_CONTAINER_NAME
          value: ${QCOS_CONTAINER_NAME}
        - name: PREFECT_SERVER_API_HOST
          value: "${PREFECT_SERVER_API_HOST}"
        - name: PREFECT_API_URL
          value: "http://${PREFECT_SERVER_API_HOST}:${PREFECT_SERVER_PORT}/api"
        - name: PREFECT_SERVER_DATABASE_CONNECTION_URL
          value: "sqlite+aiosqlite:///var/qcos/db/prefect.db"
        - name: PREFECT_LOCAL_STORAGE_PATH
          value: "/var/qcos/storage"
        - name: PYTHONPATH
          value: "/root/qcos-project"
        resources:
          requests:
            cpu: "1000m"
            memory: "2Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        livenessProbe:
          tcpSocket:
            port: ${QCOS_API_PORT}
          initialDelaySeconds: 30
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: ${QCOS_API_PORT}
          initialDelaySeconds: 5
          periodSeconds: 60
          timeoutSeconds: 10
          successThreshold: 1
        volumeMounts:
        - name: code-data
          mountPath: /root/qcos
        - name: database-dir
          mountPath: /var/qcos
        - name: qcos-config
          mountPath: /etc/qcos/qcos.toml
          subPath: qcos.toml
        - name: qcos-config-device-dummy
          mountPath: /etc/qcos/conf.d/dummy.toml
          subPath: dummy.toml
      volumes:
      - name: code-data
        persistentVolumeClaim:
          claimName: code-data-pvc
      - name: database-dir
        persistentVolumeClaim:
          claimName: database-pvc
      - name: qcos-config
        configMap:
          name: qcos-config
      - name: qcos-config-device-dummy
        configMap:
          name: qcos-config
      nodeSelector:
        qcos-api: enabled
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: qcos-api
            topologyKey: "kubernetes.io/hostname"
---
# qcos service (ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: qcos
  namespace: qcos
spec:
  selector:
    app: qcos-api
  type: ClusterIP
  ports:
  - port: ${QCOS_API_PORT}
    targetPort: ${QCOS_API_PORT}
