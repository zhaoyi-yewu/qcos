version: '3'
services:
  qcos-sandbox:
    container_name: qcos-sandbox
    image: ${REGISTRY}${SANDBOX_IMAGE_NAME}:${SANDBOX_IMAGE_VERSION}
    privileged: true
    network_mode: "host"
    restart: always
    stdin_open: True
    tty: True
    working_dir: /root/qcos-project
    environment:
      DEBUG: ${DEBUG}
      TZ: Asia/Shanghai
      PYTHONPATH: /root/qcos-project
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    volumes:
      - /etc/hosts:/etc/hosts
      - ${QCOS_LOCAL_SRC_DIR}:/root/qcos-project
