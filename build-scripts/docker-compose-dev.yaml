version: '3'
services:
  prefect-server:
    container_name: prefect-server
    image: ${REGISTRY}${PREFECT_IMAGE_NAME}:${PREFECT_IMAGE_VERSION}
    restart: always
    command: prefect server start --host ""
    network_mode: "host"
    environment:
      TZ: Asia/Shanghai
      PREFECT_SERVER_API_HOST: ${PREFECT_SERVER_API_HOST}
      PREFECT_SERVER_DATABASE_CONNECTION_URL: "sqlite+aiosqlite:////var/qcos/db/prefect.db"
      PREFECT_API_URL: "http://${PREFECT_SERVER_API_HOST}:4200/api"
      PREFECT_LOCAL_STORAGE_PATH: /var/qcos/storage
      PREFECT_API_DEFAULT_LIMIT: 100000
      PYTHONPATH: /root/qcos-project
    volumes:
      - /etc/hosts:/etc/hosts
      - /var/log/qcos:/var/log/qcos
      - /var/qcos:/var/qcos
      - /etc/qcos/prefect:/root/.prefect
      - ${QCOS_LOCAL_SRC_DIR}:/root/qcos-project
  qcos-dev:
    container_name: qcos-dev
    image: ${REGISTRY}${QCOS_IMAGE_NAME}:${QCOS_IMAGE_VERSION}
    privileged: true
    network_mode: "host"
    restart: always
    stdin_open: True
    tty: True
    depends_on:
      - prefect-server
    working_dir: /root/qcos-project
    environment:
      DEBUG: ${DEBUG}
      DEV: ${DEV}
      TZ: Asia/Shanghai
      QCOS_CONTAINER_NAME: ${QCOS_CONTAINER_NAME}
      API_SERVER_LISTEN_IP: ${API_SERVER_LISTEN_IP}
      API_SERVER_LISTEN_PORT: ${API_SERVER_LISTEN_PORT}
      QCOS_SERVER_IP: ${QCOS_SERVER_IP}
      QCOS_SERVER_PORT: ${QCOS_SERVER_PORT}
      QCOS_VIRTUAL_INSTANCE_ID: ${QCOS_VIRTUAL_INSTANCE_ID}
      PREFECT_SERVER_DATABASE_CONNECTION_URL: "sqlite+aiosqlite:///var/qcos/db/prefect.db"
      PREFECT_API_URL: ${PREFECT_API_URL}
      PREFECT_LOCAL_STORAGE_PATH: /var/qcos/storage
      PREFECT_LOGGING_ENABLED: ${PREFECT_LOGGING_ENABLED:-true}
      PREFECT_LOGGING_LEVEL: ${PREFECT_LOGGING_LEVEL:-INFO}
      PREFECT_LOGGING_ROOT_LEVEL: INFO
      PREFECT_LOGGING_ROOT_HANDLERS: ${PREFECT_LOGGING_ROOT_HANDLERS:-[]}
      PYTHONPATH: /root/qcos-project
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    volumes:
      - /etc/hosts:/etc/hosts
      - /etc/qcos:/etc/qcos
      - /var/log/qcos:/var/log/qcos
      - /var/run/qcos:/var/run/qcos
      - /var/qcos:/var/qcos
      - ${QCOS_LOCAL_SRC_DIR}:/root/qcos-project
      - ${QCOS_LOCAL_SRC_DIR}/bin/qcos-cli.py:/usr/bin/qcos-cli
    entrypoint: /entrypoint.sh
