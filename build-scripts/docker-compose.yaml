version: '3'
services:
  prefect-server:
    container_name: prefect-server
    image: ${REGISTRY}${PREFECT_IMAGE_NAME}:${PREFECT_IMAGE_VERSION}
    restart: always
    command: /bin/sh -c 'rm -rf /var/qcos/db/prefect.db-shm /var/qcos/db/prefect.db-wal; prefect server start --host ""'
    network_mode: "host"
    environment:
      TZ: Asia/Shanghai
      PREFECT_SERVER_API_HOST: ${PREFECT_SERVER_API_HOST}
      PREFECT_SERVER_DATABASE_CONNECTION_URL: ${PREFECT_SERVER_DATABASE_CONNECTION_URL}
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      PREFECT_API_DATABASE_TIMEOUT: 30
      PREFECT_API_URL: "${PREFECT_API_URL}"
      PREFECT_API_DEFAULT_LIMIT: 100000
      PYTHONPATH: /root/qcos-project/src
    volumes:
      - /etc/hosts:/etc/hosts
      - /var/log/qcos:/var/log/qcos
      - /var/qcos:/var/qcos
      - /etc/qcos/prefect:/root/.prefect
  redis:
    image: ${REGISTRY}${REDIS_IMAGE_NAME}:${REDIS_IMAGE_VERSION}
    container_name: redis
    restart: always
    network_mode: "host"
  qcos:
    container_name: qcos
    image: ${REGISTRY}${QCOS_REGISTRY}${QCOS_IMAGE_NAME}:${QCOS_IMAGE_VERSION}
    privileged: true
    network_mode: "host"
    restart: always
    stdin_open: True
    depends_on:
      - prefect-server
      - redis
    tty: True
    working_dir: /root
    environment:
      DEBUG: ${DEBUG}
      DEV: ${DEV}
      TZ: Asia/Shanghai
      CONTAINER_NAME: ${QCOS_CONTAINER_NAME}
      API_SERVER_LISTEN_IP: ${API_SERVER_LISTEN_IP}
      API_SERVER_LISTEN_PORT: ${API_SERVER_LISTEN_PORT}
      QCOS_SERVER_IP: ${QCOS_SERVER_IP}
      QCOS_SERVER_PORT: ${QCOS_SERVER_PORT}
      QCOS_AUTH_MODE: ${QCOS_AUTH_MODE}
      QCOS_DATABASE_CONNECTION_URL: ${QCOS_DATABASE_CONNECTION_URL:-sqlite:////var/qcos/db/qcos.db?timeout=30&journal_mode=WAL}
      QCOS_VIRTUAL_INSTANCE_ID: ${QCOS_VIRTUAL_INSTANCE_ID}
      DEVICE_LIST: ${DEVICE_LIST}
      MAX_JOBS: ${MAX_JOBS}
      MAX_QUEUED_JOBS: ${MAX_QUEUED_JOBS}
      MAX_JOBS_PER_USER: ${MAX_JOBS_PER_USER}
      PASSWORD_SALT: ${PASSWORD_SALT}
      LOCAL_CICD: ${LOCAL_CICD}
      PREFECT_API_URL: ${PREFECT_API_URL:-http://127.0.0.1:4200/api}
      PREFECT_SERVER_DATABASE_CONNECTION_URL: ${PREFECT_SERVER_DATABASE_CONNECTION_URL:-sqlite+aiosqlite:////var/qcos/db/prefect.db?timeout=30&journal_mode=WAL}
      PREFECT_LOCAL_STORAGE_PATH: ${PREFECT_LOCAL_STORAGE_PATH:-/var/qcos/storage}
      PREFECT_WORKER_QUERY_SECONDS: ${PREFECT_WORKER_QUERY_SECONDS:-1}
      PREFECT_WORKER_PREFETCH_SECONDS: ${PREFECT_WORKER_PREFETCH_SECONDS:-1}
      PREFECT_WORKER_HEARTBEAT_SECONDS: ${PREFECT_WORKER_HEARTBEAT_SECONDS:-30}
      PREFECT_LOGGING_LEVEL: ${PREFECT_LOGGING_LEVEL:-INFO}
      REDIS_SERVER_IP: ${REDIS_SERVER_IP}
      REDIS_SERVER_PORT: ${REDIS_SERVER_PORT}
    command: "--db-migration --no-exit -w http://${PREFECT_SERVER_API_HOST:-127.0.0.1}:${PREFECT_SERVER_PORT}/api"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    volumes:
      - /etc/hosts:/etc/hosts
      - /etc/qcos:/etc/qcos
      - /var/log/qcos:/var/log/qcos
      - /var/run/qcos:/var/run/qcos
      - /var/qcos:/var/qcos
    entrypoint: /entrypoint.sh
