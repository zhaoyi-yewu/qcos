# Create namespace
apiVersion: v1
kind: Namespace
metadata:
  name: qcos
---
# Deploy qcos
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qcos-cli
  namespace: qcos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qcos-cli
  template:
    metadata:
      labels:
        app: qcos-cli
    spec:
      hostNetwork: false
      restartPolicy: Always
      containers:
      - name: qcos
        image: ${REGISTRY}${QCOS_IMAGE_NAME}-cli:${QCOS_CLI_IMAGE_VERSION}
        # securityContext:
        #   privileged: true
        stdin: true
        tty: true
        workingDir: /root
        env:
        - name: TZ
          value: "Asia/Shanghai"
        - name: API_SERVER_IP
          value: ${API_SERVER_IP}
        - name: API_SERVER_PORT
          value: ${API_SERVER_PORT}
        - name: QCOS_VIRTUAL_INSTANCE_ID
          value: ${QCOS_VIRTUAL_INSTANCE_ID}
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
      nodeSelector:
        qcos-cli: enabled
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: qcos-cli
            topologyKey: "kubernetes.io/hostname"
