# stages
stages:
  # commit messages
  - commit-check
  # code check
  - code-check
  # docs check
  - docs-check
  # functional tests
  - functional-tests
  # system tests
  - system-tests

# commit messages
commit-messages:
  stage: commit-check
  tags:
    - sonic-runner
  script:
    - python3 ./cicd/check-commit-message.py

# code-linter
code-linter:
  stage: code-check
  tags:
    - sonic-runner
  script:
    - ./cicd/code-linter.sh

# code-style
code-style:
  stage: code-check
  tags:
    - sonic-runner
  script:
    - ./cicd/code-formatter.sh

# docstring-check
docstring-check:
  stage: code-check
  tags:
    - sonic-runner
  script:
    - ./cicd/docstring-check.sh

# docs-linter
docs-linter:
  stage: docs-check
  tags:
    - sonic-runner
  script:
    - ./cicd/docs-linter.sh

# ut
ut:
  stage: functional-tests
  tags:
    - sonic-runner
  script:
    - ./cicd/run-tests.sh -u
  artifacts:
    when: always
    reports:
      junit: cicd/report.xml

# code-coverage
code-coverage:
  stage: functional-tests
  tags:
    - sonic-runner
  script:
    - ./cicd/run-tests.sh -c
  coverage: '/^TOTAL\s+\S+\s+\S+\s+(\d+)%$/'

