# run in sandbox docker
image: qcos-sandbox:cicd

# stages
stages:
  # commit messages
  - commit-check
  # code check
  - code-check
  # docs check
  - docs-check
  # functional tests
  - functional-tests
  # system tests
  - system-tests

# commit messages
commit-messages:
  stage: commit-check
  tags:
    - sonic-runner
  script:
    - source /var/lib/qcos/venv/sandbox/bin/activate
    - python3 ./cicd/check-commit-message.py

# files check
check-files:
  stage: commit-check
  tags:
    - sonic-runner
  script:
    - source /var/lib/qcos/venv/sandbox/bin/activate
    - ./cicd/check-files.sh

# code-linter
code-linter:
  stage: code-check
  tags:
    - sonic-runner
  script:
    - source /var/lib/qcos/venv/sandbox/bin/activate
    - ./cicd/code-linter.sh

# code-style
code-style:
  stage: code-check
  tags:
    - sonic-runner
  script:
    - source /var/lib/qcos/venv/sandbox/bin/activate
    - ./cicd/code-formatter.sh

# docstring-check
docstring-check:
  stage: code-check
  tags:
    - sonic-runner
  script:
    - source /var/lib/qcos/venv/sandbox/bin/activate
    - ./cicd/docstring-check.sh

# docs-linter
docs-linter:
  stage: docs-check
  tags:
    - sonic-runner
  script:
    - source /var/lib/qcos/venv/sandbox/bin/activate
    - ./cicd/docs-linter.sh

# cpp ut (qcos)
cpp-ut-qcos:
  stage: functional-tests
  tags:
    - sonic-runner
  script:
    - source /var/lib/qcos/venv/sandbox/bin/activate
    - ./cicd/run-tests.sh -b
    - ./cicd/run-tests.sh -t default
  artifacts:
    when: always
    reports:
      junit: cicd/reports/wy_qcos/cpp_ut_report.xml

# UT/Coverage (qcos)
code-coverage-qcos:
  stage: functional-tests
  tags:
    - sonic-runner
  script:
    - source /var/lib/qcos/venv/sandbox/bin/activate
    - ./cicd/run-tests.sh -b
    - ./cicd/run-tests.sh -c default
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)/'

# UT/Coverage (qcos_client)
code-coverage-qcos-client:
  stage: functional-tests
  tags:
    - sonic-runner
  script:
    - source /var/lib/qcos/venv/sandbox/bin/activate
    - ./cicd/run-tests.sh -e all

# system tests (qcos)
st-qcos:
  stage: system-tests
  tags:
    - sonic-runner
  script:
    - source /var/lib/qcos/venv/sandbox/bin/activate
    - export LC_ALL=en_US.UTF-8
    - export LANG=en_US.UTF-8
    - |
      JENKINS_BASE_URL=${JENKINS_BASE_URL:-"http://127.0.0.1:18080/job"}
      JENKINS_JOB_NAME=${JENKINS_JOB_NAME:-"WuYueOS-CICD-Daily"}
      JENKINS_JOB_URL="${JENKINS_BASE_URL}/${JENKINS_JOB_NAME}/buildWithParameters"

      JENKINS_CRUMB=$(curl -s -u "${JENKINS_USER}:${JENKINS_API_TOKEN}" \
        "${JENKINS_BASE_URL}/crumbIssuer/api/json" 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin)['crumb'])" 2>/dev/null || echo "")

      # Get current lastBuild number before triggering
      LAST_BUILD=$(curl -s -u "${JENKINS_USER}:${JENKINS_API_TOKEN}" \
        "${JENKINS_JOB_BASE_URL}/api/json?tree=lastBuild[number]" 2>/dev/null \
        | python3 -c "import sys,json; print(json.load(sys.stdin).get('lastBuild',{}).get('number',0))" 2>/dev/null || echo "0")
      echo "Current lastBuild number: ${LAST_BUILD}"

      echo "Triggering Jenkins Job: ${JENKINS_JOB_URL}"
      HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
        -X POST "${JENKINS_JOB_URL}" \
        --user "${JENKINS_USER}:${JENKINS_API_TOKEN}" \
        ${JENKINS_CRUMB:+-H "Jenkins-Crumb: ${JENKINS_CRUMB}"})
      if [ "$HTTP_STATUS" -ne 201 ] && [ "$HTTP_STATUS" -ne 200 ]; then
        echo "Failed to trigger Jenkins job. HTTP Status: $HTTP_STATUS"
        exit 1
      fi
      echo "Jenkins job triggered successfully (HTTP $HTTP_STATUS)"

      # Wait for a new build to appear (lastBuild number > previous)
      echo "Waiting for Jenkins build to be scheduled..."
      BUILD_URL=""
      MAX_SCHEDULE_ATTEMPTS=2000
      SCHEDULE_INTERVAL=10
      for i in $(seq 1 $MAX_SCHEDULE_ATTEMPTS); do
        NEW_BUILD=$(curl -s -u "${JENKINS_USER}:${JENKINS_API_TOKEN}" \
          "${JENKINS_JOB_BASE_URL}/api/json?tree=lastBuild[number]" 2>/dev/null \
          | python3 -c "import sys,json; print(json.load(sys.stdin).get('lastBuild',{}).get('number',0))" 2>/dev/null || echo "0")
        if [ "$NEW_BUILD" -gt "$LAST_BUILD" ]; then
          BUILD_URL="${JENKINS_JOB_BASE_URL}/${NEW_BUILD}/"
          echo "Build scheduled: ${BUILD_URL}"
          break
        fi
        echo "  Attempt ${i}/${MAX_SCHEDULE_ATTEMPTS}: waiting for new build (lastBuild=${NEW_BUILD})"
        sleep $SCHEDULE_INTERVAL
      done

      if [ -z "$BUILD_URL" ]; then
        echo "ERROR: Jenkins build was not scheduled after $((MAX_SCHEDULE_ATTEMPTS * SCHEDULE_INTERVAL)) seconds"
        exit 1
      fi

      # Poll Jenkins build status until completion
      echo "Waiting for Jenkins build to complete..."
      MAX_BUILD_ATTEMPTS=120
      BUILD_INTERVAL=30
      BUILD_NUMBER=$(echo "${BUILD_URL}" | grep -oE '[0-9]+/?$' | tr -d '/')
      echo "Build #${BUILD_NUMBER} — ${BUILD_URL}"
      for i in $(seq 1 $MAX_BUILD_ATTEMPTS); do
        BUILD_JSON=$(curl -s -u "${JENKINS_USER}:${JENKINS_API_TOKEN}" \
          "${BUILD_URL}api/json" 2>/dev/null || echo "")
        BUILDING=$(echo "$BUILD_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin).get('building','true'))" 2>/dev/null || echo "true")
        if [ "$BUILDING" = "False" ]; then
          RESULT=$(echo "$BUILD_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin).get('result','UNKNOWN'))" 2>/dev/null || echo "UNKNOWN")
          echo "Jenkins build #${BUILD_NUMBER} finished with result: ${RESULT}"
          if [ "$RESULT" = "SUCCESS" ]; then
            echo "Jenkins job PASSED"
            exit 0
          else
            echo "Jenkins job FAILED with result: ${RESULT}"
            echo "View details: ${BUILD_URL}"
            exit 1
          fi
        fi
        DURATION=$(echo "$BUILD_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin).get('duration',0); print(d//1000 if d else 0)" 2>/dev/null || echo "0")
        ESTIMATE=$(echo "$BUILD_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin).get('estimatedDuration',0); print(d//1000 if d else 0)" 2>/dev/null || echo "0")
        echo "  Attempt ${i}/${MAX_BUILD_ATTEMPTS}: build still running (elapsed: ${DURATION}s, estimated: ${ESTIMATE}s)"
        sleep $BUILD_INTERVAL
      done

      echo "ERROR: Jenkins build did not complete within $((MAX_BUILD_ATTEMPTS * BUILD_INTERVAL)) seconds"
      exit 1
  only:
    - schedules

