# This workflow will build, publish and test the following images: sandbox/qcos/qcos-cli docker
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Build/Publish/Test QCOS docker image

on:
  push:
    branches: [ develop, test ]
    tags:
      - "v*"
  schedule:
    # trigger on every night (14:00 UTC / 22:00 CST)
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-qcos-base-image:
    name: Build Docker Image (qcos-base)
    runs-on: ubuntu-latest
    container:
      image: openeuler/openeuler:24.03-lts
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install basic packages
        run: |
          if [ -n "${{ vars.YUM_MIRROR }}" ]; then
            sed -i 's@https://repo.openeuler.org@${{ vars.YUM_MIRROR }}@g' /etc/yum.repos.d/openEuler.repo
            yum clean all && yum makecache
          fi
          yum install -y docker docker-compose rsync findutils

      - name: Run Integrated Build Script for base
        shell: bash
        run: |
          cd ./build-scripts
          source ./version
          cp ./env.template ./.env
          if [ -n "${{ vars.YUM_MIRROR }}" ]; then
            sed -i "s@^YUM_MIRROR=.*@YUM_MIRROR=${{ vars.YUM_MIRROR }}@" ./.env
          fi
          df -h
          ./build-images.sh -b -t dev

      - name: Upload qcos-base Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qcos-base-image-artifact
          path: ./build-scripts/images/qcos-base-amd64-dev.tar.xz
          retention-days: 1

  build-sandbox-image:
    name: Build Docker Image (qcos-sandbox)
    needs: build-qcos-base-image
    runs-on: ubuntu-latest
    container:
      image: openeuler/openeuler:24.03-lts
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install basic packages
        run: |
          if [ -n "${{ vars.YUM_MIRROR }}" ]; then
            sed -i 's@https://repo.openeuler.org@${{ vars.YUM_MIRROR }}@g' /etc/yum.repos.d/openEuler.repo
            yum clean all && yum makecache
          fi
          yum install -y docker docker-compose rsync findutils

      - name: Download qcos-base Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: qcos-base-image-artifact
          path: ./build-scripts/images/

      - name: Load qcos-base Docker Image
        run: docker load -i ./build-scripts/images/qcos-base-amd64-dev.tar.xz

      - name: Run Integrated Build Script for sandbox
        shell: bash
        run: |
          cd ./build-scripts
          source ./version
          cp ./env.template ./.env
          if [ -n "${{ vars.YUM_MIRROR }}" ]; then
            sed -i "s@^YUM_MIRROR=.*@YUM_MIRROR=${{ vars.YUM_MIRROR }}@" ./.env
          fi
          df -h
          ./build-images.sh -s -t dev

      - name: Upload qcos-sandbox Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qcos-sandbox-image-artifact
          path: ./build-scripts/images/qcos-sandbox-amd64-dev.tar.xz
          retention-days: 1

  build-qcos-image:
    name: Build Docker Image (qcos)
    needs: build-sandbox-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download qcos-base Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: qcos-base-image-artifact
          path: ./build-scripts/images/

      - name: Load qcos-base Docker Image
        run: docker load -i ./build-scripts/images/qcos-base-amd64-dev.tar.xz

      - name: Download qcos-sandbox Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: qcos-sandbox-image-artifact
          path: ./build-scripts/images/

      - name: Load qcos-sandbox Docker Image
        run: docker load -i ./build-scripts/images/qcos-sandbox-amd64-dev.tar.xz

      - name: Run Integrated Build Script for qcos
        shell: bash
        run: |
          sudo -s <<'EOF'
          ln -s /usr/libexec/docker/cli-plugins/docker-compose /usr/bin/docker-compose
          cd ./build-scripts
          source /root/.bashrc
          source ./version
          cp ./env.template ./.env
          if [ -n "${{ vars.YUM_MIRROR }}" ]; then
            sed -i "s@^YUM_MIRROR=.*@YUM_MIRROR=${{ vars.YUM_MIRROR }}@" ./.env
          fi
          df -h
          ./run-sandbox.sh
          docker exec qcos-sandbox sh -c "source /root/.bashrc; cd /root/qcos-project/build-scripts; ./build-images.sh -q -t dev"
          EOF

      - name: Upload qcos Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qcos-image-artifact
          path: ./build-scripts/images/qcos-amd64-dev.tar.xz
          retention-days: 1

  build-qcos-cli-image:
    name: Build Docker Image (qcos-cli)
    needs: build-sandbox-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download qcos-sandbox Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: qcos-sandbox-image-artifact
          path: ./build-scripts/images/

      - name: Load qcos-sandbox Docker Image
        run: docker load -i ./build-scripts/images/qcos-sandbox-amd64-dev.tar.xz

      - name: Run Integrated Build Script for qcos-cli
        shell: bash
        run: |
          sudo -s <<'EOF'
          ln -s /usr/libexec/docker/cli-plugins/docker-compose /usr/bin/docker-compose
          cd ./build-scripts
          source /root/.bashrc
          source ./version
          cp ./env.template ./.env
          if [ -n "${{ vars.YUM_MIRROR }}" ]; then
            sed -i "s@^YUM_MIRROR=.*@YUM_MIRROR=${{ vars.YUM_MIRROR }}@" ./.env
          fi
          df -h
          ./run-sandbox.sh
          docker exec qcos-sandbox sh -c "source /root/.bashrc; cd /root/qcos-project/build-scripts; ./build-images.sh -c -t dev"
          EOF

      - name: Upload qcos-cli Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qcos-cli-image-artifact
          path: ./build-scripts/images/qcos-cli-amd64-dev.tar.xz
          retention-days: 1

  run-ut-qcos:
    name: Run Unit Tests (qcos)
    needs:
      - build-qcos-image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download qcos-sandbox Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: qcos-sandbox-image-artifact
          path: ./build-scripts/images/

      - name: Load qcos-sandbox Docker Image
        run: docker load -i ./build-scripts/images/qcos-sandbox-amd64-dev.tar.xz

      - name: Run Unit Tests (qcos)
        shell: bash
        run: |
          sudo -s <<'EOF'
          ln -s /usr/libexec/docker/cli-plugins/docker-compose /usr/bin/docker-compose
          cd ./build-scripts
          cp ./env.template ./.env
          export SANDBOX_IMAGE_VERSION=dev
          ./run-sandbox.sh
          docker exec qcos-sandbox sh -c "source /root/.bashrc; cd /root/qcos-project; ./cicd/run-tests.sh -c all"
          EOF

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.QCOS_CODECOV_TOKEN }}
          files: cicd/reports/wy_qcos/coverage.xml

  run-ut-qcos-cli:
    name: Run Unit Tests (qcos-cli)
    needs:
      - build-qcos-cli-image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download qcos-sandbox Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: qcos-sandbox-image-artifact
          path: ./build-scripts/images/

      - name: Load qcos-sandbox Docker Image
        run: docker load -i ./build-scripts/images/qcos-sandbox-amd64-dev.tar.xz

      - name: Run Unit Tests (qcos-cli)
        shell: bash
        run: |
          sudo -s <<'EOF'
          ln -s /usr/libexec/docker/cli-plugins/docker-compose /usr/bin/docker-compose
          cd ./build-scripts
          cp ./env.template ./.env
          export SANDBOX_IMAGE_VERSION=dev
          ./run-sandbox.sh
          docker exec qcos-sandbox sh -c "source /root/.bashrc; cd /root/qcos-project; ./cicd/run-tests.sh -e all"
          EOF

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.QCOS_CODECOV_TOKEN }}
          files: cicd/reports/wy_qcos_client/coverage.xml

  run-st-qcos:
    name: Run System Tests (qcos)
    needs:
      - build-qcos-image
      - build-qcos-cli-image
    runs-on: ubuntu-latest
    steps:
      - name: Free spaces
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download qcos Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: qcos-image-artifact
          path: ./build-scripts/images/

      - name: Load qcos Docker Image
        run: docker load -i ./build-scripts/images/qcos-amd64-dev.tar.xz

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run System Tests (qcos)
        shell: bash
        run: |
          sudo -s <<'EOF'
          ln -s /usr/libexec/docker/cli-plugins/docker-compose /usr/bin/docker-compose

          TOP_DIR=$(pwd)
          # config
          cd ${TOP_DIR}/build-scripts
          cp ./env.template ./.env
          if [ -n "${{ vars.YUM_MIRROR }}" ]; then
            sed -i "s@^YUM_MIRROR=.*@YUM_MIRROR=${{ vars.YUM_MIRROR }}@" ./.env
          fi
          sed -i 's@^QCOS_VERSION=.*@QCOS_VERSION=dev@' ./version
          sed -i 's@^LOCAL_CICD=.*@LOCAL_CICD=True@' ./.env
          mkdir -p /etc/qcos/
          cp -rf ${TOP_DIR}/etc/qcos/st-conf.d /etc/qcos/
          cp -rf ${TOP_DIR}/etc/qcos/qcos-st.toml /etc/qcos/

          # run docker
          ./run-docker.sh

          # waiting for qcos docker running
          QCOS_SERVER_IP=127.0.0.1
          QCOS_SERVER_PORT=18400
          MAX_ATTEMPTS=30
          SLEEP_INTERVAL=10
          count=0
          echo "qcos-api: http://${QCOS_SERVER_IP}:${QCOS_SERVER_PORT}"
          until curl -o /dev/null -s http://${QCOS_SERVER_IP}:${QCOS_SERVER_PORT} || [ $count -ge ${MAX_ATTEMPTS} ]; do
            echo "waiting for qcos-api ... (attempt $((count+1))/${MAX_ATTEMPTS})"
            docker logs qcos
            sleep ${SLEEP_INTERVAL}
            count=$((count+1))
          done
          if [ ${count} -lt ${MAX_ATTEMPTS} ]; then
            echo "qcos-api is ready"
          else
            total_seconds=$((MAX_ATTEMPTS * SLEEP_INTERVAL))
            echo "ERROR: qcos-api did not become ready after ${MAX_ATTEMPTS} attempts (total ${MAX_ATTEMPTS}*${SLEEP_INTERVAL}=${total_seconds} seconds)"
            docker logs qcos
            echo "Print /var/log/qos/qcos-api.log ..."
            cat /var/log/qcos/qcos-api.log || true
            echo "Print /var/log/qcos/postgresql.log ..."
            cat /var/log/qcos/postgresql.log || true
            exit 1
          fi

          # run system tests in qcos
          sleep 10
          echo "Running system tests in container: qcos"
          cd ${TOP_DIR}
          tar czf /tmp/cicd.tar.gz ./cicd ./src ./etc ./samples
          docker cp /tmp/cicd.tar.gz qcos:/tmp/
          docker exec qcos sh -c "mkdir -p /root/qcos-project/; cd /root/qcos-project/; tar xzf /tmp/cicd.tar.gz"
          docker exec qcos sh -c "source /root/.bashrc; echo 'Driver list:'; qcos-cli list-devices; echo 'Job list:'; qcos-cli list-jobs; cd /root/qcos-project; ./cicd/run-tests.sh -s all"
          EOF

          # print log files for debug purpose
          ls -al /var/log/qcos || true
          awk 'FNR==1{print "\n\n--- Log File: " FILENAME " ---"} {print} END{print ""}' /var/log/qcos/qcos-api.log /var/log/qcos/postgresql.log /var/log/qcos/device*.log || true

  push-docker-images:
    name: Tag and Push docker images to DockerHub
    # Runs after all jobs regardless of their outcome
    needs:
      - build-qcos-base-image
      - build-sandbox-image
      - build-qcos-image
      - build-qcos-cli-image
      - run-ut-qcos
      - run-ut-qcos-cli
      - run-st-qcos
    runs-on: ubuntu-latest
    steps:
      - name: Generate Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.QCOS_DOCKERHUB_USERNAME }}/qcos-base
            ${{ secrets.QCOS_DOCKERHUB_USERNAME }}/qcos-sandbox
            ${{ secrets.QCOS_DOCKERHUB_USERNAME }}/qcos
            ${{ secrets.QCOS_DOCKERHUB_USERNAME }}/qcos-cli
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'schedule' }}
            type=raw,value=nightly,enable=${{ github.event_name == 'schedule' }}
            type=raw,value=nightly-{{date 'YYYYMMDD'}},enable=${{ github.event_name == 'schedule' }}
            type=semver,pattern={{version}}
            type=semver,pattern=latest

      - name: Check Docker Metadata Tags
        shell: bash
        run: |
          TAGS="${{ steps.meta.outputs.tags }}"
          if [ -z "$TAGS" ]; then
            echo "::warning::No Docker tags generated from metadata. Skipping push-docker-images steps."
            echo "TAGS_EMPTY=true" >> $GITHUB_ENV
          else
            echo "Docker tags available: $TAGS"
            echo "TAGS_EMPTY=false" >> $GITHUB_ENV
          fi

      - name: Free spaces
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout Code
        if: env.TAGS_EMPTY == 'false'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: env.TAGS_EMPTY == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.TAGS_EMPTY == 'false'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.QCOS_DOCKERHUB_USERNAME }}
          password: ${{ secrets.QCOS_DOCKERHUB_TOKEN }}

      - name: Download and Load Docker Images
        if: env.TAGS_EMPTY == 'false'
        shell: bash
        run: |
          ARTIFACTS=(
            "qcos-base-image-artifact:qcos-base-amd64-dev.tar.xz"
            "qcos-sandbox-image-artifact:qcos-sandbox-amd64-dev.tar.xz"
            "qcos-image-artifact:qcos-amd64-dev.tar.xz"
            "qcos-cli-image-artifact:qcos-cli-amd64-dev.tar.xz"
          )
          
          for artifact in "${ARTIFACTS[@]}"; do
            IFS=':' read -r artifact_name file_name <<< "$artifact"
            echo "Downloading $artifact_name..."
            mkdir -p ./build-scripts/images/
          done

      - name: Download qcos-base Docker Image Artifact
        if: env.TAGS_EMPTY == 'false'
        uses: actions/download-artifact@v4
        with:
          name: qcos-base-image-artifact
          path: ./build-scripts/images/

      - name: Load qcos-base Docker Image
        if: env.TAGS_EMPTY == 'false'
        run: docker load -i ./build-scripts/images/qcos-base-amd64-dev.tar.xz

      - name: Download qcos-sandbox Docker Image Artifact
        if: env.TAGS_EMPTY == 'false'
        uses: actions/download-artifact@v4
        with:
          name: qcos-sandbox-image-artifact
          path: ./build-scripts/images/

      - name: Load qcos-sandbox Docker Image
        if: env.TAGS_EMPTY == 'false'
        run: docker load -i ./build-scripts/images/qcos-sandbox-amd64-dev.tar.xz

      - name: Download qcos Docker Image Artifact
        if: env.TAGS_EMPTY == 'false'
        uses: actions/download-artifact@v4
        with:
          name: qcos-image-artifact
          path: ./build-scripts/images/

      - name: Load qcos Docker Image
        if: env.TAGS_EMPTY == 'false'
        run: docker load -i ./build-scripts/images/qcos-amd64-dev.tar.xz

      - name: Download qcos-cli Docker Image Artifact
        if: env.TAGS_EMPTY == 'false'
        uses: actions/download-artifact@v4
        with:
          name: qcos-cli-image-artifact
          path: ./build-scripts/images/

      - name: Load qcos-cli Docker Image
        if: env.TAGS_EMPTY == 'false'
        run: docker load -i ./build-scripts/images/qcos-cli-amd64-dev.tar.xz

      - name: Tag and Push docker images
        if: env.TAGS_EMPTY == 'false'
        shell: bash
        env:
          ALL_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          TAG_LIST=$(echo "$ALL_TAGS" | xargs)
          
          cd ./build-scripts
          echo "Tags to push: $TAG_LIST"
          for full_tag in $TAG_LIST; do
            echo "Processing tag: $full_tag"
            tmp_image_name="${full_tag#*/}"
            image_name=${tmp_image_name%:*}
            docker tag ${image_name}:dev $full_tag
            docker push $full_tag
          done

  send-cicd-report:
    name: Send CI/CD Report via action-send-mail
    # Runs after all jobs regardless of their outcome
    needs:
      - build-qcos-base-image
      - build-sandbox-image
      - build-qcos-image
      - build-qcos-cli-image
      - run-ut-qcos
      - run-ut-qcos-cli
      - run-st-qcos
      - push-docker-images
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send CI/CD Report via action-send-mail
        uses: dawidd6/action-send-mail@v3
        with:
          # SMTP server configuration
          server_address: ${{ secrets.QCOS_SMTP_SERVER_ADDRESS }}
          server_port: ${{ secrets.QCOS_SMTP_SERVER_PORT }}
          username: ${{ secrets.QCOS_SMTP_USERNAME }}
          password: ${{ secrets.QCOS_SMTP_PASSWORD }}

          # Email configuration
          subject: |
            [QCOS CI/CD] ${{ needs.build-qcos-base-image.result == 'failure' || needs.build-sandbox-image.result == 'failure' || needs.build-qcos-image.result == 'failure' || needs.build-qcos-cli-image.result == 'failure' || needs.run-ut-qcos.result == 'failure' || needs.run-ut-qcos-cli.result == 'failure' || needs.run-st-qcos.result == 'failure' || needs.push-docker-images.result == 'failure' && '❌ FAILED' || '✅ SUCCESS' }} — Run #${{ github.run_number }} on ${{ github.ref_name }} (${{ github.sha }})

          # Recipients (supports multiple comma-separated addresses)
          to: ${{ vars.QCOS_CICD_REPORT_EMAIL_TO }}

          # Sender address
          from: ${{ vars.QCOS_CICD_REPORT_EMAIL_FROM || 'qcos-cicd@cmss.chinamobile.com' }}

          # HTML body
          html_body: |
            <!DOCTYPE html>
            <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>QCOS CI/CD Report</title>
              <style>
                body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                       background: #f6f8fa; margin: 0; padding: 24px; color: #24292f; }
                .card { background: #fff; border-radius: 8px; border: 1px solid #d0d7de;
                        max-width: 680px; margin: 0 auto; overflow: hidden; }
                .header { padding: 24px 28px; border-bottom: 1px solid #d0d7de; }
                .header h1 { margin: 0 0 4px; font-size: 20px; }
                .header .subtitle { color: #57606a; font-size: 14px; margin: 0; }
                .overall { padding: 16px 28px; font-size: 18px; font-weight: 600;
                           border-bottom: 1px solid #d0d7de; }
                .overall.success { background: #dafbe1; color: #1a7f37; }
                .overall.failed  { background: #ffebe9; color: #cf222e; }
                .section { padding: 20px 28px; }
                .section h2 { font-size: 14px; font-weight: 600; color: #57606a;
                              text-transform: uppercase; letter-spacing: .05em;
                              margin: 0 0 12px; }
                table { width: 100%; border-collapse: collapse; font-size: 14px; }
                th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #eaeef2; }
                th { background: #f6f8fa; font-weight: 600; color: #57606a; }
                tr:last-child td { border-bottom: none; }
                .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px;
                             font-size: 14px; }
                .meta-grid .label { color: #57606a; }
                .btn { display: inline-block; margin-top: 20px; padding: 10px 20px;
                       background: #0969da; color: #fff; border-radius: 6px;
                       text-decoration: none; font-size: 14px; font-weight: 600; }
                .footer { padding: 16px 28px; border-top: 1px solid #d0d7de;
                          font-size: 12px; color: #57606a; text-align: center; }
              </style>
            </head>
            <body>
              <div class="card">
                <div class="header">
                  <h1>🚀 QCOS CI/CD Pipeline Report</h1>
                  <p class="subtitle">Workflow Run #${{ github.run_number }} &nbsp;·&nbsp; ${{ github.event_name }} (${{ github.actor }})</p>
                </div>

                <div class="overall ${{ needs.build-qcos-base-image.result == 'failure' || needs.build-sandbox-image.result == 'failure' || needs.build-qcos-image.result == 'failure' || needs.build-qcos-cli-image.result == 'failure' || needs.run-ut-qcos.result == 'failure' || needs.run-ut-qcos-cli.result == 'failure' || needs.run-st-qcos.result == 'failure' || needs.push-docker-images.result == 'failure' && 'failed' || 'success' }}">
                  Overall Status: ${{ needs.build-qcos-base-image.result == 'failure' || needs.build-sandbox-image.result == 'failure' || needs.build-qcos-image.result == 'failure' || needs.build-qcos-cli-image.result == 'failure' || needs.run-ut-qcos.result == 'failure' || needs.run-ut-qcos-cli.result == 'failure' || needs.run-st-qcos.result == 'failure' || needs.push-docker-images.result == 'failure' && '❌ FAILED' || '✅ SUCCESS' }}
                </div>

                <div class="section">
                  <h2>Pipeline Details</h2>
                  <div class="meta-grid">
                    <span class="label">Repository</span>  <span>${{ github.repository }}</span>
                    <span class="label">Branch / Tag</span> <span>${{ github.ref_name }}</span>
                    <span class="label">Commit</span>       <span>${{ github.sha }}</span>
                    <span class="label">Triggered by</span> <span>${{ github.event_name }} (${{ github.actor }})</span>
                  </div>
                </div>

                <div class="section">
