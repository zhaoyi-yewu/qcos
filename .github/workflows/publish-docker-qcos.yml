# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Build/Publish/Test QCOS docker image

on:
  push:
    branches: [ develop ]
    tags:
      - "v*"
  pull_request:
    branches: [ develop ]

permissions:
  contents: read

jobs:
  build-and-push-sandbox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/qcos-sandbox
          tags: |
            type=schedule,pattern=nightly
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha

      - name: Run Integrated Build Script
        run: |
          chmod +x ./build-scripts/build-sandbox.sh
          ./build-scripts/build-sandbox.sh
          docker tag qcos-sandbox:${{ steps.meta.outputs.tags }} ${{ secrets.DOCKERHUB_USERNAME }}/qcos-sandbox:${{ steps.meta.outputs.tags }}
          docker tag qcos-sandbox:${{ steps.meta.outputs.tags }} ${{ secrets.DOCKERHUB_USERNAME }}/qcos-sandbox:latest

  build-and-push-qcos:
    needs: build-and-push-sandbox
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/qcos
          tags: |
            type=schedule,pattern=nightly
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha

      - name: Run Integrated Build Script
        run: |
          chmod +x ./build-scripts/build-images.sh
          ./build-scripts/build-images.sh -q
          docker tag qcos:${{ steps.meta.outputs.tags }} ${{ secrets.DOCKERHUB_USERNAME }}/qcos:${{ steps.meta.outputs.tags }}
          docker tag qcos:${{ steps.meta.outputs.tags }} ${{ secrets.DOCKERHUB_USERNAME }}/qcos:latest

  build-and-push-qcos-cli:
    needs: build-and-push-sandbox
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/qcos-cli
          tags: |
            type=schedule,pattern=nightly
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha

      - name: Run Integrated Build Script
        run: |
          chmod +x ./build-scripts/build-images.sh
          ./build-scripts/build-images.sh -c
          docker tag qcos-cli:${{ steps.meta.outputs.tags }} ${{ secrets.DOCKERHUB_USERNAME }}/qcos-cli:${{ steps.meta.outputs.tags }}
          docker tag qcos-cli:${{ steps.meta.outputs.tags }} ${{ secrets.DOCKERHUB_USERNAME }}/qcos-cli:latest

  run-tests-qcos:
    needs: build-and-push-sandbox
    runs-on: ubuntu-latest
    container:
      image: qcos/qcos-sandbox:latest
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Unit Tests
        run: |
          cicd/run-tests.sh -c all

  run-tests-qcos-cli:
    needs: build-and-push-sandbox
    runs-on: ubuntu-latest
    container:
      image: qcos/qcos-sandbox:latest
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Unit Tests
        run: |
          cicd/run-tests.sh -e all
