# This workflow will build, publish and test the following images: sandbox/qcos/qcos-cli docker
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Build/Publish/Test QCOS docker image

on:
  push:
    branches: [ develop, test ]
    tags:
      - "v*"
  schedule:
    # trigger on every night (14:00 UTC / 22:00 CST)
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-qcos-base-image:
    runs-on: ubuntu-latest
    container:
      image: openeuler/openeuler:24.03-lts
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install basic packages
        run: |
          yum install -y docker docker-compose rsync findutils

      - name: Run Integrated Build Script for base
        shell: bash
        run: |
          cd ./build-scripts
          source ./version
          cp ./env.template ./.env
          ./build-images.sh -b -t dev

      - name: Upload qcos-base Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qcos-base-image-artifact
          path: ./build-scripts/images/qcos-base-amd64-dev.tar.xz
          retention-days: 1

  build-and-push-sandbox-image:
    needs: build-qcos-base-image
    runs-on: ubuntu-latest
    container:
      image: openeuler/openeuler:24.03-lts
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install basic packages
        run: |
          yum install -y docker docker-compose rsync findutils

      - name: Download qcos-base Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: qcos-base-image-artifact
          path: ./build-scripts/images/

      - name: Load qcos-base Docker Image
        run: docker load -i ./build-scripts/images/qcos-base-amd64-dev.tar.xz

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.QCOS_DOCKERHUB_USERNAME }}
          password: ${{ secrets.QCOS_DOCKERHUB_TOKEN }}

      - name: Generate Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.QCOS_DOCKERHUB_USERNAME }}/qcos-sandbox
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'schedule' }}
            type=raw,value=nightly,enable=${{ github.event_name == 'schedule' }}
            type=raw,value=nightly-{{date 'YYYYMMDD'}},enable=${{ github.event_name == 'schedule' }}
            type=semver,pattern={{version}}
            type=semver,pattern=latest

      - name: Run Integrated Build Script for sandbox
        shell: bash
        env:
          ALL_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          cd ./build-scripts
          source ./version
          cp ./env.template ./.env
          ./build-images.sh -s -n
          TAG_LIST=$(echo "$ALL_TAGS" | xargs)
          echo "TAGS: $TAG_LIST"
          for full_tag in $TAG_LIST; do
            echo "Processing tag: $full_tag"
            docker tag qcos-sandbox:dev $full_tag
            docker push $full_tag
          done

  build-and-push-qcos-image:
    needs: build-and-push-sandbox-image
    runs-on: ubuntu-latest
    container:
      image: qcos/qcos-sandbox:nightly
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download qcos-base Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: qcos-base-image-artifact
          path: ./build-scripts/images/

      - name: Load qcos-base Docker Image
        run: docker load -i ./build-scripts/images/qcos-base-amd64-dev.tar.xz

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.QCOS_DOCKERHUB_USERNAME }}
          password: ${{ secrets.QCOS_DOCKERHUB_TOKEN }}

      - name: Generate Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.QCOS_DOCKERHUB_USERNAME }}/qcos
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'schedule' }}
            type=raw,value=nightly,enable=${{ github.event_name == 'schedule' }}
            type=raw,value=nightly-{{date 'YYYYMMDD'}},enable=${{ github.event_name == 'schedule' }}
            type=semver,pattern={{version}}
            type=semver,pattern=latest

      - name: Run Integrated Build Script for qcos
        shell: bash
        env:
          ALL_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          cd ./build-scripts
          source /root/.bashrc
          source ./version
          cp ./env.template ./.env
          ./build-images.sh -q -n
          TAG_LIST=$(echo "$ALL_TAGS" | xargs)
          echo "TAGS: $TAG_LIST"
          for full_tag in $TAG_LIST; do
            echo "Processing tag: $full_tag"
            docker tag qcos:${QCOS_VERSION} $full_tag
            docker push $full_tag
          done  

  build-and-push-qcos-cli-image:
    needs: build-and-push-sandbox-image
    container:
      image: qcos/qcos-sandbox:nightly
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.QCOS_DOCKERHUB_USERNAME }}
          password: ${{ secrets.QCOS_DOCKERHUB_TOKEN }}

      - name: Generate Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.QCOS_DOCKERHUB_USERNAME }}/qcos-cli
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'schedule' }}
            type=raw,value=nightly,enable=${{ github.event_name == 'schedule' }}
            type=raw,value=nightly-{{date 'YYYYMMDD'}},enable=${{ github.event_name == 'schedule' }}
            type=semver,pattern={{version}}
            type=semver,pattern=latest

      - name: Run Integrated Build Script for qcos-cli
        shell: bash
        env:
          ALL_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          cd ./build-scripts
          source /root/.bashrc
          source ./version
          cp ./env.template ./.env
          ./build-images.sh -c -n
          TAG_LIST=$(echo "$ALL_TAGS" | xargs)
          echo "TAGS: $TAG_LIST"
          for full_tag in $TAG_LIST; do
            echo "Processing tag: $full_tag"
            docker tag qcos-cli:${QCOS_VERSION} $full_tag
            docker push $full_tag
          done  

  run-ut-qcos:
    needs:
      - build-and-push-qcos-image
    runs-on: ubuntu-latest
    container:
      image: qcos/qcos-sandbox:nightly

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Unit Tests (QCOS)
        shell: bash
        run: |
          source /root/.bashrc
          cicd/run-tests.sh -c all

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.QCOS_CODECOV_TOKEN }}
          files: cicd/reports/wy_qcos/coverage.xml

  run-ut-qcos-cli:
    needs:
      - build-and-push-qcos-cli-image
    runs-on: ubuntu-latest
    container:
      image: qcos/qcos-sandbox:nightly

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Unit Tests (QCOS-CLI)
        shell: bash
        run: |
          source /root/.bashrc
          cicd/run-tests.sh -e all

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.QCOS_CODECOV_TOKEN }}
          files: cicd/reports/wy_qcos_client/coverage.xml

  run-st-qcos:
    needs:
      - build-and-push-qcos-image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run System Tests (QCOS)
        shell: bash
        run: |
          BASE_DIR=$(dirname "$0")
          TOP_DIR=$(readlink -f ${BASE_DIR})
          cd ${TOP_DIR}/build-scripts
          source /root/.bashrc
          cp ./env.template ./.env
          sed -i 's/^LOCAL_CICD=.*/LOCAL_CICD=True/' ./.env
          ./run-docker.sh

          # waiting for qcos docker running
          QCOS_SERVER_IP=127.0.0.1
          QCOS_SERVER_PORT=18400
          MAX_ATTEMPTS=30
          SLEEP_INTERVAL=10
          count=0
          echo "qcos-api: http://${QCOS_SERVER_IP}:${QCOS_SERVER_PORT}"
          until curl -o /dev/null -s http://${QCOS_SERVER_IP}:${QCOS_SERVER_PORT} || [ $count -ge ${MAX_ATTEMPTS} ]; do
            echo "waiting for qcos-api ... (attempt $((count+1))/${MAX_ATTEMPTS})"
            sleep ${SLEEP_INTERVAL}
            count=$((count+1))
          done
          if [ ${count} -lt ${MAX_ATTEMPTS} ]; then
            echo "qcos-api is ready"
          else
            total_seconds=$((MAX_ATTEMPTS * SLEEP_INTERVAL))
            echo "ERROR: qcos-api did not become ready after ${MAX_ATTEMPTS} attempts (total ${MAX_ATTEMPTS}*${SLEEP_INTERVAL}=${total_seconds} seconds)"
            exit 1
          fi

          # run system tests
          cd ${TOP_DIR}/cicd
          ./run-tests.sh -s all

  send-cicd-report:
    name: Send CI/CD Report via action-send-mail
    # Runs after all jobs regardless of their outcome
    needs:
      - build-qcos-base-image
      - build-and-push-sandbox-image
      - build-and-push-qcos-image
      - build-and-push-qcos-cli-image
      - run-ut-qcos
      - run-ut-qcos-cli
      - run-st-qcos
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send CI/CD Report via action-send-mail
        uses: dawidd6/action-send-mail@v3
        with:
          # SMTP server configuration
          server_address: ${{ secrets.QCOS_SMTP_SERVER_ADDRESS }}
          server_port: ${{ secrets.QCOS_SMTP_SERVER_PORT }}
          username: ${{ secrets.QCOS_SMTP_USERNAME }}
          password: ${{ secrets.QCOS_SMTP_PASSWORD }}

          # Email configuration
          subject: |
            [QCOS CI/CD] ${{ needs.build-qcos-base-image.result == 'failure' || needs.build-and-push-sandbox-image.result == 'failure' || needs.build-and-push-qcos-image.result == 'failure' || needs.build-and-push-qcos-cli-image.result == 'failure' || needs.run-ut-qcos.result == 'failure' || needs.run-ut-qcos-cli.result == 'failure' || needs.run-st-qcos.result == 'failure' && '❌ FAILED' || '✅ SUCCESS' }} — Run #${{ github.run_number }} on ${{ github.ref_name }} (${{ github.sha }})

          # Recipients (supports multiple comma-separated addresses)
          to: ${{ vars.QCOS_CICD_REPORT_EMAIL_TO }}

          # Sender address
          from: ${{ vars.QCOS_CICD_REPORT_EMAIL_FROM || 'qcos-cicd@cmss.chinamobile.com' }}

          # HTML body
          html_body: |
            <!DOCTYPE html>
            <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>QCOS CI/CD Report</title>
              <style>
                body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                       background: #f6f8fa; margin: 0; padding: 24px; color: #24292f; }
                .card { background: #fff; border-radius: 8px; border: 1px solid #d0d7de;
                        max-width: 680px; margin: 0 auto; overflow: hidden; }
                .header { padding: 24px 28px; border-bottom: 1px solid #d0d7de; }
                .header h1 { margin: 0 0 4px; font-size: 20px; }
                .header .subtitle { color: #57606a; font-size: 14px; margin: 0; }
                .overall { padding: 16px 28px; font-size: 18px; font-weight: 600;
                           border-bottom: 1px solid #d0d7de; }
                .overall.success { background: #dafbe1; color: #1a7f37; }
                .overall.failed  { background: #ffebe9; color: #cf222e; }
                .section { padding: 20px 28px; }
                .section h2 { font-size: 14px; font-weight: 600; color: #57606a;
                              text-transform: uppercase; letter-spacing: .05em;
                              margin: 0 0 12px; }
                table { width: 100%; border-collapse: collapse; font-size: 14px; }
                th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #eaeef2; }
                th { background: #f6f8fa; font-weight: 600; color: #57606a; }
                tr:last-child td { border-bottom: none; }
                .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px;
                             font-size: 14px; }
                .meta-grid .label { color: #57606a; }
                .btn { display: inline-block; margin-top: 20px; padding: 10px 20px;
                       background: #0969da; color: #fff; border-radius: 6px;
                       text-decoration: none; font-size: 14px; font-weight: 600; }
                .footer { padding: 16px 28px; border-top: 1px solid #d0d7de;
                          font-size: 12px; color: #57606a; text-align: center; }
              </style>
            </head>
            <body>
              <div class="card">
                <div class="header">
                  <h1>🚀 QCOS CI/CD Pipeline Report</h1>
                  <p class="subtitle">Workflow Run #${{ github.run_number }} &nbsp;·&nbsp; ${{ github.event_name }} (${{ github.actor }})</p>
                </div>

                <div class="overall ${{ needs.build-qcos-base-image.result == 'failure' || needs.build-and-push-sandbox-image.result == 'failure' || needs.build-and-push-qcos-image.result == 'failure' || needs.build-and-push-qcos-cli-image.result == 'failure' || needs.run-ut-qcos.result == 'failure' || needs.run-ut-qcos-cli.result == 'failure' || needs.run-st-qcos.result == 'failure' && 'failed' || 'success' }}">
                  Overall Status: ${{ needs.build-qcos-base-image.result == 'failure' || needs.build-and-push-sandbox-image.result == 'failure' || needs.build-and-push-qcos-image.result == 'failure' || needs.build-and-push-qcos-cli-image.result == 'failure' || needs.run-ut-qcos.result == 'failure' || needs.run-ut-qcos-cli.result == 'failure' || needs.run-st-qcos.result == 'failure' && '❌ FAILED' || '✅ SUCCESS' }}
                </div>

                <div class="section">
                  <h2>Pipeline Details</h2>
                  <div class="meta-grid">
                    <span class="label">Repository</span>  <span>${{ github.repository }}</span>
                    <span class="label">Branch / Tag</span> <span>${{ github.ref_name }}</span>
                    <span class="label">Commit</span>       <span>${{ github.sha }}</span>
                    <span class="label">Triggered by</span> <span>${{ github.event_name }} (${{ github.actor }})</span>
                  </div>
                </div>

                <div class="section">
                  <h2>Job Results</h2>
                  <table>
                    <thead>
                      <tr><th>Job</th><th>Status</th></tr>
                    </thead>
                    <tbody>
                      <tr><td>Build QCOS Base Image</td>     <td>${{ needs.build-qcos-base-image.result == 'success' && '✅ success' || needs.build-qcos-base-image.result == 'failure' && '❌ failure' || needs.build-qcos-base-image.result == 'skipped' && '⏭️ skipped' || needs.build-qcos-base-image.result == 'cancelled' && '🚫 cancelled' || '❓ unknown' }}</td></tr>
                      <tr><td>Build & Push Sandbox Image</td>  <td>${{ needs.build-and-push-sandbox-image.result == 'success' && '✅ success' || needs.build-and-push-sandbox-image.result == 'failure' && '❌ failure' || needs.build-and-push-sandbox-image.result == 'skipped' && '⏭️ skipped' || needs.build-and-push-sandbox-image.result == 'cancelled' && '🚫 cancelled' || '❓ unknown' }}</td></tr>
                      <tr><td>Build & Push QCOS Image</td>     <td>${{ needs.build-and-push-qcos-image.result == 'success' && '✅ success' || needs.build-and-push-qcos-image.result == 'failure' && '❌ failure' || needs.build-and-push-qcos-image.result == 'skipped' && '⏭️ skipped' || needs.build-and-push-qcos-image.result == 'cancelled' && '🚫 cancelled' || '❓ unknown' }}</td></tr>
                      <tr><td>Build & Push QCOS-CLI Image</td> <td>${{ needs.build-and-push-qcos-cli-image.result == 'success' && '✅ success' || needs.build-and-push-qcos-cli-image.result == 'failure' && '❌ failure' || needs.build-and-push-qcos-cli-image.result == 'skipped' && '⏭️ skipped' || needs.build-and-push-qcos-cli-image.result == 'cancelled' && '🚫 cancelled' || '❓ unknown' }}</td></tr>
                      <tr><td>Unit Tests - QCOS</td>         <td>${{ needs.run-ut-qcos.result == 'success' && '✅ success' || needs.run-ut-qcos.result == 'failure' && '❌ failure' || needs.run-ut-qcos.result == 'skipped' && '⏭️ skipped' || needs.run-ut-qcos.result == 'cancelled' && '🚫 cancelled' || '❓ unknown' }}</td></tr>
                      <tr><td>Unit Tests - QCOS-CLI</td>     <td>${{ needs.run-ut-qcos-cli.result == 'success' && '✅ success' || needs.run-ut-qcos-cli.result == 'failure' && '❌ failure' || needs.run-ut-qcos-cli.result == 'skipped' && '⏭️ skipped' || needs.run-ut-qcos-cli.result == 'cancelled' && '🚫 cancelled' || '❓ unknown' }}</td></tr>
                      <tr><td>System Tests - QCOS</td>       <td>${{ needs.run-st-qcos.result == 'success' && '✅ success' || needs.run-st-qcos.result == 'failure' && '❌ failure' || needs.run-st-qcos.result == 'skipped' && '⏭️ skipped' || needs.run-st-qcos.result == 'cancelled' && '🚫 cancelled' || '❓ unknown' }}</td></tr>
                    </tbody>
                  </table>
                  <a class="btn" href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Full Run Logs →</a>
                </div>

                <div class="footer">
                  This email was sent automatically by GitHub Actions · QCOS CI/CD Pipeline
                </div>
              </div>
            </body>
            </html>
