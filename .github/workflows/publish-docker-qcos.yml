name: Publish QCOS docker image

on:
  push:
    branches: ["master"]
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/qcos
          tags: |
            type=schedule,pattern=nightly
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha

      - name: Run Integrated Build Script
        run: |
          chmod +x ./build-scripts/build-images.sh
          ./build-scripts/build-images.sh -q
          docker tag qcos:${{ steps.meta.outputs.tags }} ${{ secrets.DOCKERHUB_USERNAME }}/qcos:${{ steps.meta.outputs.tags }}
          docker tag qcos:${{ steps.meta.outputs.tags }} ${{ secrets.DOCKERHUB_USERNAME }}/qcos:latest
