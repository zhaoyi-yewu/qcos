[pytest]
testpaths = 
    src/wy_qcos/tests/unit_tests
    src/wy_qcos_client/tests/unit_tests
# pytest markers
markers =
    smoke: smoke testcases
    slow: slow testcases
    driver: driver testcases
    default: default testcases (non-smoke, non-slow)

# default options
addopts =
    -m "not slow"
    --disable-warnings -vv --log-cli-level=INFO
    -vv
    --ignore=src/wy_qcos/tests/unit_tests/cloud/test_cloud_compiler.py
    --ignore=src/wy_qcos/tests/unit_tests/driver/logical_qubits/test_driver_lq_base.py
    --ignore=src/wy_qcos/tests/unit_tests/driver/logical_qubits/test_driver_lq_agate100.py
    --ignore=src/wy_qcos/tests/unit_tests/driver/logical_qubits/test_driver_lq_mq02.py
    --ignore=src/wy_qcos/tests/unit_tests/driver/logical_qubits/test_driver_lq_mq02_pulse.py
    --ignore=src/wy_qcos/tests/unit_tests/driver/logical_qubits/test_driver_lq_qz01_repetition_code.py
    --ignore=src/wy_qcos/tests/unit_tests/driver/logical_qubits/test_driver_lq_qz01_surface_code.py
    --ignore=src/wy_qcos/tests/unit_tests/driver/logical_qubits/test_driver_lq_qz02.py
    --ignore=src/wy_qcos/tests/unit_tests/driver/quafu/test_driver_quafu.py
    --ignore=src/wy_qcos/tests/unit_tests/driver/uqc/test_driver_uqc.py
    --ignore=src/wy_qcos/tests/unit_tests/transpiler/mapping/test_transpiler_na_multi_mapping.py
    --ignore=src/wy_qcos/tests/unit_tests/transpiler/mapping/test_transpiler_na_mapping.py
    --ignore=src/wy_qcos/tests/unit_tests/transpiler/test_quafu_verifier.py
    --ignore=src/wy_qcos/tests/unit_tests/transpiler/decomposer_cpp/test_decomposer_cpp.py
    --ignore=src/wy_qcos/tests/unit_tests/transpiler/decomposer_cpp/test_decomposer_qasm_cpp.py
    --ignore=src/wy_qcos/tests/unit_tests/transpiler/circuit/test_create_random_circuit.py
    --ignore=src/wy_qcos/tests/unit_tests/transpiler/circuit/test_quantum_circuit.py
    --ignore=src/wy_qcos/tests/unit_tests/transpiler/optimizer/test_optimize_comparison.py
    --ignore=src/wy_qcos/tests/unit_tests/transpiler/optimizer/test_optimize_equivalence.py
    --ignore=src/wy_qcos/tests/unit_tests/transpiler/test_transpiler_cmd_line.py
    --ignore=src/wy_qcos/tests/unit_tests/transpiler/wirecut/test_dag.py

