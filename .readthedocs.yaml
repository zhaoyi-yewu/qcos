# Read the Docs configs

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/sphinx/source/conf.py

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
    
    - requirements: ./requirements.txt

formats:
  - pdf
