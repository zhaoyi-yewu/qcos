# Read the Docs configs

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  apt_packages:
    - default-jre
    - graphviz
    - plantuml
    - imagemagick
    - librsvg2-bin

sphinx:
  configuration: docs/sphinx/source/conf.py

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
    
    - requirements: ./requirements/requirements-docs.txt

formats:
  - pdf
  - htmlzip
#   - epub
