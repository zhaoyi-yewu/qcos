# Read the Docs configs

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
    nodejs: "20"
  apt_packages:
    - default-jre
    - graphviz
    - plantuml
    - imagemagick
    - librsvg2-bin
    - fonts-noto-cjk
  jobs:
    post_install:
      - npm install -g @mermaid-js/mermaid-cli plantuml
    pre_build:
      # Generate openapi html and copy to sphinx _static before build
      - python docs/openapi-docs/make-openapi-docs.py
      - mkdir -p docs/sphinx/source/_static
      - cp docs/openapi-docs/dist/qcos-api-docs.html docs/sphinx/source/_static/
      - tar xzvf docs/openapi-docs/js.tar.gz -C docs/openapi-docs/dist
      - cp -r docs/openapi-docs/dist/js docs/sphinx/source/_static/

sphinx:
  configuration: docs/sphinx/source/conf.py

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

formats:
  - pdf
#  - htmlzip  # max 15mins building time allowed in ReadTheDocs, ignore building htmlzip
#  - epub
