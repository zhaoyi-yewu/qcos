# Driver running environments

[default]
deps_filepaths = ["./requirements-qcos.txt"]
envs = ["python3"]

[sandbox]
deps_filepaths = [
    "./requirements-qcos.txt",
    "./requirements-sandbox.txt",
    "./requirements-test.txt",
    "./requirements-docs.txt",
]
envs = ["python3"]

[pypy]
deps_filepaths = ["./requirements-transpiler-cmss.txt"]
envs = ["pypy3"]

[DriverQutipSim]
module_name = "driver_qutip_sim"
deps_filepaths = ["./drivers/requirements-qutip.txt"]
envs = ["python3"]

[DriverSpinQRpc]
module_name = "driver_spinq_rpc"
deps_filepaths = ["./drivers/requirements-spinq-rpc.txt"]
envs = ["python3"]

[DriverUQCMatrix2]
module_name = "driver_uqc"
deps_filepaths = ["./drivers/requirements-uqc.txt"]
envs = ["python3"]

[qiskit]
deps_filepaths = ["./drivers/requirements-qiskit.txt"]
envs = ["python3"]

[DriverQiskitQasmSim]
module_name = "driver_qiskit_qasm_sim"
copy_from = "qiskit"

[DriverQiskitAerSim]
module_name = "driver_qiskit_aer_sim"
copy_from = "qiskit"
