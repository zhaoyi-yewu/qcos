[tool.bumpversion]
current_version = "1.1.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(?:-(?P<stage>alpha|beta|rc)\\.(?P<num>\\d+))?"
serialize = [
    "{major}.{minor}.{patch}-{stage}.{num}",
    "{major}.{minor}.{patch}"
]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Release version: {new_version}"
allow_dirty = false
commit = true
message = """Bump version: {current_version} -> {new_version}"""
moveable_tags = []
commit_args = ""
setup_hooks = []
pre_commit_hooks = []
post_commit_hooks = []

[tool.bumpversion.parts.stage]
optional_value = "stable"
values = ["alpha", "beta", "rc", "stable"]

[tool.bumpversion.parts.num]
first_value = "1"

[[tool.bumpversion.files]]
# QCOS version
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "src/wy_qcos/common/qcos_version.py"
search = "VERSION = \"{current_version}\""
replace = "VERSION = \"{new_version}\""

# QCOS Client version
[[tool.bumpversion.files]]
filename = "src/wy_qcos_client/common/qcos_version.py"
search = "VERSION = \"{current_version}\""
replace = "VERSION = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "build-scripts/cli/pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

# QCOS Docker version
[[tool.bumpversion.files]]
filename = "build-scripts/version"
search = "QCOS_VERSION={current_version}"
replace = "QCOS_VERSION={new_version}"

# Changelog version
[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [未发布] - 开发中"
replace = """## [未发布] - 开发中

### 新增功能

- 无

### 变更功能

- 无

### 修复问题

- 无

### 移除内容

- 无

## [{new_version}] - {now:%Y-%m-%d}"""
