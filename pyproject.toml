[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0", "wheel>=0.37.1"]

[project]
name = "qcos"
version = "1.0.0"
description = "QCOS (Quantum Computing Operating System)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {file = "LICENSE"}
authors = [
    {name = "Zhao Yi", email = "zhaoyi_yewu@cmss.chinamobile.com"},
    {name = "Ji Dalong", email = "jidalong_yewu@cmss.chinamobile.com"},
    {name = "Xu Dong", email = "xudong_yewu@cmss.chinamobile.com"},
    {name = "Wu Fangwei", email = "wufangwei_yewu@cmss.chinamobile.com"},
    {name = "Guo Zhufeng", email = "guozhufeng_yewu@cmss.chinamobile.com"}
]
keywords = ["qcos", "quantum", "system"]

# Add PyPI classifiers here
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: Mulan Permissive Software License v2 (MulanPSL-2.0)",
    "Natural Language :: English",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: Implementation :: CPython",
]

# Required dependencies for install/usage of your package or application
# If you don't have any dependencies, leave this section empty
# Format for dependency strings: https://peps.python.org/pep-0508/
dependencies = [
    # requirements
    "aiohttp==3.12.13",
    "annotated-types==0.7.0",
    "anyio==4.9.0",
    "argcomplete==3.6.2",
    "click==8.1.8",
    "cliff==4.10.0",
    "cryptography==45.0.7",
    "fastapi==0.115.12",
    "fastapi-jsonrpc==3.4.1",
    "h11==0.16.0",
    "idna==3.10",
    "jsonrpcclient==4.0.3",
    "loguru==0.7.3",
    "matplotlib==3.9.2",
    "networkx==3.3",
    "numpy==1.26.4",
    "ply==3.11",
    "poetry==2.1.3",
    "prefect==3.3.3; sys_platform == 'linux'",
    "pydantic==2.11.5",
    "pydantic_core==2.33.2",
    "pytest==8.4.1",
    "pytest-cov==6.2.1",
    "qiskit==2.1.1",
    "qiskit_aer==0.17.1",
    "requests==2.32.5",
    "schema==0.7.7",
    "sniffio==1.3.1",
    "starlette==0.46.2",
    "tomlkit==0.13.3",
    "typing-inspection==0.4.1",
    "typing_extensions==4.13.2",
    "uvicorn==0.34.2",
    "wheel==0.45.1",

    # Vendor drivers dependencies
    # SpinQ driver only
    "zerorpc==0.6.3",
    # UQC driver only
    "openqasm3==1.0.1",
    "python-socketio==5.12.1",
    "uqc_client==0.0.9",

    # test-requirements
    "bandit>=1.8.6",
    "flake8>=7.3.0",
    "mypy==1.16.1",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff==0.12.3",
    "sphinx==8.1.3",
    "sphinx-rtd-theme==3.0.2",
    "sphinxcontrib-napoleon==0.7",
    "tomli==2.2.1",
    "tox==4.8.0",
]

[project.scripts]
# Command line interface entrypoint scripts

qcos-api = "qcos.api_server:main"
qcos-cli = "qcos.client.shell:main"
qcos-compiler = "qcos.transpiler.cmss.transpiler_cmd_line:main"

[project.urls]
"Homepage" = "https://gitee.com/OpenWuYue/qcos"
"Documentation" = "https://gitee.com/OpenWuYue/qcos/blob/develop/INSTALL.md"
"Changelog" = "https://gitee.com/OpenWuYue/qcos/blob/develop/CHANGELOG"
"Issue Tracker" = "https://gitee.com/OpenWuYue/qcos/issues"
"Source" = "https://gitee.com/OpenWuYue/qcos"

[tool.poetry.dependencies]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = []
namespaces = true

[tool.isort]
profile = "black"
force_grid_wrap = "2"
known_first_party = "qcos"

[tool.mypy]
incremental = true
pretty = true
show_error_context = true
show_column_numbers = true
warn_unused_ignores = true
check_untyped_defs = false
# remove gradually as progress is made
disable_error_code = "import-untyped,var-annotated,import-not-found"
# honor excludes by not following there through imports
follow_imports = "silent"
files = "qcos"
# NOTE: Gradually enable type checking for each package.
# Finally, when the whole repo is migrated this option can be deleted
# and rules applied to the whole repo.
#exclude = "(?x)(^tests/$)"

[tool.ruff]
line-length = 79
target-version = "py311"
exclude = [
    ".venv/",
    ".git/",
    "__pycache__/",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "S", "U", "CPY001"]
ignore = [
    "E731",  # Do not assign a `lambda` expression, use a `def`
    "E741",  # Ambiguous variable name: `l`
    "S104",  # Possible binding to all interfaces
    "S311",  # Standard pseudo-random generators are not suitable for
             # cryptographic purposes
    "S324",  # Probable use of insecure hash functions in `hashlib`: `md5`
    "UP009", # UTF-8 encoding declaration is unnecessary
    "UP031", # Use format specifiers instead of percent format
    "UP032", # Use f-string instead of `format` call
    "UP018", # Unnecessary `int` call (rewrite as a literal)
    "UP024", # Replace aliased errors with `OSError`
    "UP030", # Use implicit references for positional format fields
    "UP038", # Use `X | Y` in `isinstance` call instead of `(X, Y)`
    "UP039", # Unnecessary parentheses after class definition
]

[tool.ruff.lint.per-file-ignores]
"qcos/tests/**/*.py" = ["S101"]
"qcos/**/__init__.py" = ["F401"]
"qcos/transpiler/cmss/compiler/parser.py" = ["F401"]
"qcos/transpiler/cmss/compiler/visitor.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["qcos"]
known-third-party = ["requests", "pandas", "numpy"]
lines-after-imports = 2

[tool.ruff.lint.flake8-copyright]
notice-rgx = "(?s)^#!/usr/bin/env python3.*?(coding: utf-8).*?(Copyright).*?(China Mobile \\(SuZhou\\)).*?(qcos is licensed under Mulan PSL v2).*"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
skip-magic-trailing-comma = false
line-ending = "auto"
exclude = [
    "qcos/transpiler/cmss/compiler/parser.py",
    "qcos/transpiler/cmss/compiler/visitor.py",
]

[tool.poetry.extras]
docs = ["Sphinx", "sphinx-rtd-theme", "sphinxcontrib-napoleon"]
