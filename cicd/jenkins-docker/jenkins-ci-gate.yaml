// ==========================================================================
// QCOS CI/CD Jenkins Pipeline (Gate)
// ==========================================================================

pipeline {
    agent {
        docker {
            image 'qcos-sandbox:cicd'
            args '-v /var/run/docker.sock:/var/run/docker.sock -v /etc/localtime:/etc/localtime:ro -v /etc/hosts:/etc/hosts -e TZ=Asia/Shanghai'
        }
    }

    triggers {
        gitee(
            triggerOnPush: true,
            triggerOnCommitComment: false,
            triggerOnOpenPullRequest: true,
            triggerOnPipelineEvent: false,
            triggerOnAcceptedPullRequest: false,
            triggerOnClosedPullRequest: false,
            triggerOnApprovedPullRequest: false,
            triggerOnNoteRequest: true,
            noteRegex: "(?i).*(rebuild|retry|retest).*",
            skipWorkInProgressPullRequest: true,
            ciSkip: true,
            skipLastCommitHasBeenBuild: true,
            cancelPendingBuildsOnUpdate: true,
            cancelIncompleteBuildOnSamePullRequest: true,
            secretToken: "${params.GITEE_WEBHOOK_TOKEN}"
        )
    }

    parameters {
        persistentString(name: 'GIT_CREDENTIALS_ID',
               defaultValue: 'cicd-gitee-ssh',
               description: 'Jenkins stored SSH credential ID for the Git repository. e.g. Gitee (cicd-gitee-ssh) or GitLab (gitlab-ssh-key)')
        persistentString(name: 'CICD_REPORT_EMAIL',
               defaultValue: 'zhaoyi@cmss.chinamobile.com',
               description: 'Email address(es) for CI/CD report notification. Supports single (user@example.com) or multiple comma-separated (a@example.com,b@example.com). Leave empty to skip email notification.')
        persistentString(name: 'GITEE_WEBHOOK_TOKEN',
               defaultValue: '',
               description: 'Secret token for Gitee webhook authentication. Must match the token configured in the Gitee repository webhook settings. Set this value via Jenkins UI on first build.')
        persistentString(name: 'GITEE_TOKEN',
               defaultValue: '',
               description: 'Gitee personal access token (private token) for PR review API calls. Used to approve (CI pass) or request changes (CI fail) on pull requests. Must have at least repo-level permissions. Set this value via Jenkins UI on first build.')
    }

    environment {
        GIT_CREDENTIALS_ID = "${params.GIT_CREDENTIALS_ID?: ''}"
        CICD_REPORT_EMAIL = "${params.CICD_REPORT_EMAIL?: ''}"
        GITEE_OWNER = 'WUYUEQbit'
        GITEE_REPO = 'qcos'
    }

    options {
        timestamps()
        timeout(time: 12, unit: 'HOURS')
        buildDiscarder(logRotator(numToKeepStr: '5', artifactNumToKeepStr: '5'))
        giteeConnection('cicd-gitee')
        // Prevent concurrent builds (shared Docker daemon, container name conflicts)
        disableConcurrentBuilds()
    }

    stages {
        // =============================================================
        // Initialize: Checkout code and prepare environment
        // =============================================================
        stage('Initialize') {
            steps {
                script {
                    // Always use the main repo URL. The Jenkins SSH key is
                    // configured for WUYUEQbit/qcos; fork repo URLs may be
                    // inaccessible. giteeSourceUrl points to the fork for
                    // cross-fork PRs, so we ignore it and always clone the
                    // main repo, fetching PR refs instead.
                    def git_url = 'git@gitee.com:WUYUEQbit/qcos.git'
                    def git_branch = env.giteeSourceBranch ?: 'develop'
                    def refspec = '+refs/heads/*:refs/remotes/origin/*'

                    // For pull requests (especially from forks), the source
                    // branch does not exist in the main repo's refs/heads.
                    // Fetch the PR ref via Gitee's refs/pull/<iid>/head and
                    // checkout that ref instead, so fork commits are resolved
                    // correctly instead of "originates from another repository".
                    if (env.giteePullRequestIid) {
                        def pr_iid = env.giteePullRequestIid
                        refspec = "+refs/pull/${pr_iid}/head:refs/remotes/origin/pr/${pr_iid}/head " + refspec
                        git_branch = "origin/pr/${pr_iid}/head"
                    }

                    checkout([
                        $class: 'GitSCM',
                        branches: [[name: "${git_branch}"]],
                        doGenerateSubmoduleConfigurations: false,
                        extensions: [[$class: 'CleanBeforeCheckout']],
                        submoduleCfg: [],
                        userRemoteConfigs: [[credentialsId: "${params.GIT_CREDENTIALS_ID}", url: "${git_url}", refspec: "${refspec}"]]
                    ])
                    echo ">>> Build #${env.BUILD_NUMBER} on branch ${git_branch}"
                    echo ">>> Repo: ${git_url} | Branch: ${git_branch} | Creds: ${params.GIT_CREDENTIALS_ID}"

                    // Comment on Gitee PR: CI/CD is starting
                    if (env.giteePullRequestIid) {
                        echo ">>> Commenting on Gitee PR #${env.giteePullRequestIid} (build starting)"
                        try {
                            addGiteeMRComment comment: """### 🔄 CI/CD Pipeline Started

| Item | Info |
|------|------|
| **Build Number** | [#${env.BUILD_NUMBER}](${env.BUILD_URL}) |
| **Source Branch** | ${env.giteeSourceBranch ?: 'N/A'} |
| **Target Branch** | ${env.giteeTargetBranch ?: 'N/A'} |

Pipeline is running, please wait for the result.

[View Build Progress](${env.BUILD_URL})
"""
                        } catch (Exception e) {
                            echo ">>> Failed to add start comment to PR: ${e.message}"
                        }
                    }
                }
            }
        }

        // =============================================================
        // Group: commit-check
        // =============================================================
        stage('commit-check') {
            stages {
                // Stage: commit-messages
                stage('Commit Messages') {
                    steps {
                        sh """#!/bin/bash
                        source /var/lib/qcos/venv/sandbox/bin/activate
                        python3 ./cicd/check-commit-message.py
                        """
                    }
                }

                // Stage: check-files
                stage('Check Files') {
                    steps {
                        sh """#!/bin/bash
                        source /var/lib/qcos/venv/sandbox/bin/activate
                        ./cicd/check-files.sh
                        """
                    }
                }
            }
        }

        // =============================================================
        // Group: code-check
        // =============================================================
        stage('code-check') {
            stages {
                // Stage: code-linter
                stage('Code Linter') {
                    steps {
                        sh """#!/bin/bash
                        source /var/lib/qcos/venv/sandbox/bin/activate
                        ./cicd/code-linter.sh
                        """
                    }
                }

                // Stage: code-style
                stage('Code Style') {
                    steps {
                        sh """#!/bin/bash
                        source /var/lib/qcos/venv/sandbox/bin/activate
                        ./cicd/code-formatter.sh
                        """
                    }
                }

                // Stage: docstring-check
                stage('Docstring Check') {
                    steps {
                        sh """#!/bin/bash
                        source /var/lib/qcos/venv/sandbox/bin/activate
                        ./cicd/docstring-check.sh
                        """
                    }
                }
            }
        }

        // =============================================================
        // Group: docs-check
        // =============================================================
        stage('docs-check') {
            stages {
                // Stage: docs-linter
                stage('Docs Linter') {
                    steps {
                        sh """#!/bin/bash
                        source /var/lib/qcos/venv/sandbox/bin/activate
                        ./cicd/docs-linter.sh
                        """
                    }
                }
            }
        }

        // =============================================================
        // Group: functional-tests
        // =============================================================
        stage('functional-tests') {
            stages {
                // Stage: cpp-ut-qcos
                stage('CPP UT - QCOS') {
                    steps {
                        sh """#!/bin/bash
                        source /var/lib/qcos/venv/sandbox/bin/activate
                        ./cicd/run-tests.sh -b
                        ./cicd/run-tests.sh -t default
                        """
                    }
                }

                // Stage: code-coverage-qcos
                stage('UT/Coverage - QCOS') {
                    steps {
                        sh """#!/bin/bash
                        source /var/lib/qcos/venv/sandbox/bin/activate
                        ./cicd/run-tests.sh -b
                        ./cicd/run-tests.sh -c default
                        """
                    }
                }

                // Stage: code-coverage-qcos-client
                stage('UT/Coverage - QCOS Client') {
                    steps {
                        sh """#!/bin/bash
                        source /var/lib/qcos/venv/sandbox/bin/activate
                        ./cicd/run-tests.sh -e all
                        """
                    }
                }
            }
        }
    }

    post {
        success {
            script {
                // Comment on Gitee PR: CI/CD succeeded
                if (env.giteePullRequestIid) {
                    echo ">>> Commenting on Gitee PR #${env.giteePullRequestIid} (build succeeded)"
                    try {
                        addGiteeMRComment comment: """### ✅ CI/CD Pipeline Succeeded

| Item | Info |
|------|------|
| **Build Number** | [#${env.BUILD_NUMBER}](${env.BUILD_URL}) |
| **Source Branch** | ${env.giteeSourceBranch ?: 'N/A'} |
| **Target Branch** | ${env.giteeTargetBranch ?: 'N/A'} |

All checks passed. ✅

[View Build Logs](${env.BUILD_URL})
"""
                    } catch (Exception e) {
                        echo ">>> Failed to add success comment to PR: ${e.message}"
                    }
                }

                // Set Gitee PR test status to passed if CI/CD succeeded (enables merge)
                // Uses /pulls/{iid}/test endpoint, consistent with accept-pull-request.py
                if (env.giteePullRequestIid && params.GITEE_TOKEN) {
                    echo ">>> Setting Gitee PR #${env.giteePullRequestIid} test status to passed"
                    try {
                        sh """#!/bin/bash
                        curl -s -X POST \\
                            "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/pulls/${env.giteePullRequestIid}/test" \\
                            -H "Content-Type: application/json;charset=UTF-8" \\
                            -d "{\\"access_token\\":\\"${params.GITEE_TOKEN}\\",\\"force\\":true}" \\
                            -o /dev/null -w "%{http_code}"
                        """
                        echo ">>> Gitee PR test status set to passed"
                    } catch (Exception e) {
                        echo ">>> Failed to set Gitee PR test status: ${e.message}"
                    }
                } else if (env.giteePullRequestIid && !params.GITEE_TOKEN) {
                    echo ">>> GITEE_TOKEN not set, skipping PR test status update"
                }

                if (env.CICD_REPORT_EMAIL) {
                    echo "Attempting to send SUCCESS email to: ${env.CICD_REPORT_EMAIL}"
                    try {
                        emailext(
                            subject: "[QCOS CI/CD - Gate] ✅ SUCCESS — Build #${env.BUILD_NUMBER} on ${env.giteeSourceBranch}",
                            body: """<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"/></head>
<body style="font-family:sans-serif;background:#f6f8fa;padding:24px;">
<div style="max-width:680px;margin:0 auto;background:#fff;border-radius:8px;border:1px solid #d0d7de;overflow:hidden;">
  <div style="padding:24px 28px;border-bottom:1px solid #d0d7de;">
    <h1 style="margin:0 0 4px;font-size:20px;">🚀 QCOS CI/CD Pipeline Report (Gate)</h1>
    <p style="color:#57606a;font-size:14px;margin:0;">Build #${env.BUILD_NUMBER} · ${env.giteeSourceBranch}</p>
  </div>
  <div style="padding:16px 28px;background:#dafbe1;color:#1a7f37;font-size:18px;font-weight:600;">
    Overall Status: ✅ SUCCESS
  </div>
  <div style="padding:20px 28px;">
    <h2 style="font-size:14px;color:#57606a;text-transform:uppercase;letter-spacing:.05em;margin:0 0 12px;">Pipeline Details (Gate)</h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;font-size:14px;">
      <span style="color:#57606a;">Branch</span><span>${env.giteeSourceBranch}</span>
      <span style="color:#57606a;">Commit</span><span>${env.GIT_COMMIT ?: 'N/A'}</span>
      <span style="color:#57606a;">Build</span><span>#${env.BUILD_NUMBER}</span>
    </div>
    <a href="${env.BUILD_URL}" style="display:inline-block;margin-top:20px;padding:10px 20px;background:#0969da;color:#fff;border-radius:6px;text-decoration:none;font-size:14px;font-weight:600;">View Full Run Logs →</a>
  </div>
  <div style="padding:16px 28px;border-top:1px solid #d0d7de;font-size:12px;color:#57606a;text-align:center;">
    This email was sent automatically by Jenkins · QCOS CI/CD Pipeline (Gate)
  </div>
</div>
</body>
</html>""",
                            to: "${env.CICD_REPORT_EMAIL}",
                            mimeType: 'text/html'
                        )
                        echo "SUCCESS email sent successfully"
                    } catch (Exception e) {
                        echo "SUCCESS email send failed: ${e.message}"
                    }
                }
            }
        }
        failure {
            script {
                // Comment on Gitee PR: CI/CD failed
                if (env.giteePullRequestIid) {
                    echo ">>> Commenting on Gitee PR #${env.giteePullRequestIid} (build failed)"
                    try {
                        addGiteeMRComment comment: """### ❌ CI/CD Pipeline Failed

| Item | Info |
|------|------|
| **Build Number** | [#${env.BUILD_NUMBER}](${env.BUILD_URL}) |
| **Source Branch** | ${env.giteeSourceBranch ?: 'N/A'} |
| **Target Branch** | ${env.giteeTargetBranch ?: 'N/A'} |

Some checks failed. ❌

[View Failure Details](${env.BUILD_URL}console)
"""
                    } catch (Exception e) {
                        echo ">>> Failed to add failure comment to PR: ${e.message}"
                    }
                }

                // Set Gitee PR test status to failed if CI/CD failed (revokes prior pass, blocks merge)
                if (env.giteePullRequestIid && params.GITEE_TOKEN) {
                    echo ">>> Setting Gitee PR #${env.giteePullRequestIid} test status to failed"
                    try {
                        sh """#!/bin/bash
                        curl -s -X PATCH \\
                            "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/pulls/${env.giteePullRequestIid}/testers" \\
                            -H "Content-Type: application/json;charset=UTF-8" \\
                            -d "{\\"access_token\\":\\"${params.GITEE_TOKEN}\\",\\"reset_all\\":\\"false\\"}" \\
                            -o /dev/null -w "%{http_code}"
                        """
                        echo ">>> Gitee PR test status set to failed"
                    } catch (Exception e) {
                        echo ">>> Failed to set Gitee PR test status to failed: ${e.message}"
                    }
                } else if (env.giteePullRequestIid && !params.GITEE_TOKEN) {
                    echo ">>> GITEE_TOKEN not set, skipping PR test status update"
                }

                if (env.CICD_REPORT_EMAIL) {
                    emailext(
                        subject: "[QCOS CI/CD - Gate] ❌ FAILED — Build #${env.BUILD_NUMBER} on ${env.giteeSourceBranch}",
                        body: """<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"/></head>
<body style="font-family:sans-serif;background:#f6f8fa;padding:24px;">
<div style="max-width:680px;margin:0 auto;background:#fff;border-radius:8px;border:1px solid #d0d7de;overflow:hidden;">
  <div style="padding:24px 28px;border-bottom:1px solid #d0d7de;">
    <h1 style="margin:0 0 4px;font-size:20px;">🚀 QCOS CI/CD Pipeline Report (Gate)</h1>
    <p style="color:#57606a;font-size:14px;margin:0;">Build #${env.BUILD_NUMBER} · ${env.giteeSourceBranch}</p>
  </div>
  <div style="padding:16px 28px;background:#ffebe9;color:#cf222e;font-size:18px;font-weight:600;">
    Overall Status: ❌ FAILED
  </div>
  <div style="padding:20px 28px;">
    <h2 style="font-size:14px;color:#57606a;text-transform:uppercase;letter-spacing:.05em;margin:0 0 12px;">Pipeline Details (Gate)</h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;font-size:14px;">
      <span style="color:#57606a;">Branch</span><span>${env.giteeSourceBranch}</span>
      <span style="color:#57606a;">Commit</span><span>${env.GIT_COMMIT ?: 'N/A'}</span>
      <span style="color:#57606a;">Build</span><span>#${env.BUILD_NUMBER}</span>
    </div>
    <a href="${env.BUILD_URL}" style="display:inline-block;margin-top:20px;padding:10px 20px;background:#0969da;color:#fff;border-radius:6px;text-decoration:none;font-size:14px;font-weight:600;">View Full Run Logs →</a>
  </div>
  <div style="padding:16px 28px;border-top:1px solid #d0d7de;font-size:12px;color:#57606a;text-align:center;">
    This email was sent automatically by Jenkins · QCOS CI/CD Pipeline (Gate)
  </div>
</div>
</body>
</html>""",
                        to: "${env.CICD_REPORT_EMAIL}",
                        mimeType: 'text/html'
                    )
                }
            }
        }
        unstable {
            script {
                // Comment on Gitee PR: CI/CD unstable
                if (env.giteePullRequestIid) {
                    echo ">>> Commenting on Gitee PR #${env.giteePullRequestIid} (build unstable)"
                    try {
                        addGiteeMRComment comment: """### ⚠️ CI/CD Pipeline Unstable

| Item | Info |
|------|------|
| **Build Number** | [#${env.BUILD_NUMBER}](${env.BUILD_URL}) |
| **Source Branch** | ${env.giteeSourceBranch ?: 'N/A'} |
| **Target Branch** | ${env.giteeTargetBranch ?: 'N/A'} |

Build completed with warnings. ⚠️

[View Details](${env.BUILD_URL})
"""
                    } catch (Exception e) {
                        echo ">>> Failed to add unstable comment to PR: ${e.message}"
                    }
                }

                if (env.CICD_REPORT_EMAIL) {
                    emailext(
                        subject: "[QCOS CI/CD - Gate] ⚠️ UNSTABLE — Build #${env.BUILD_NUMBER} on ${env.giteeSourceBranch}",
                        body: """<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"/></head>
<body style="font-family:sans-serif;background:#f6f8fa;padding:24px;">
<div style="max-width:680px;margin:0 auto;background:#fff;border-radius:8px;border:1px solid #d0d7de;overflow:hidden;">
  <div style="padding:24px 28px;border-bottom:1px solid #d0d7de;">
    <h1 style="margin:0 0 4px;font-size:20px;">🚀 QCOS CI/CD Pipeline Report (Gate)</h1>
    <p style="color:#57606a;font-size:14px;margin:0;">Build #${env.BUILD_NUMBER} · ${env.giteeSourceBranch}</p>
  </div>
  <div style="padding:16px 28px;background:#fff8c5;color:#9a6700;font-size:18px;font-weight:600;">
    Overall Status: ⚠️ UNSTABLE
  </div>
  <div style="padding:20px 28px;">
    <h2 style="font-size:14px;color:#57606a;text-transform:uppercase;letter-spacing:.05em;margin:0 0 12px;">Pipeline Details (Gate)</h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;font-size:14px;">
      <span style="color:#57606a;">Branch</span><span>${env.giteeSourceBranch}</span>
      <span style="color:#57606a;">Commit</span><span>${env.GIT_COMMIT ?: 'N/A'}</span>
      <span style="color:#57606a;">Build</span><span>#${env.BUILD_NUMBER}</span>
    </div>
    <a href="${env.BUILD_URL}" style="display:inline-block;margin-top:20px;padding:10px 20px;background:#0969da;color:#fff;border-radius:6px;text-decoration:none;font-size:14px;font-weight:600;">View Full Run Logs →</a>
  </div>
  <div style="padding:16px 28px;border-top:1px solid #d0d7de;font-size:12px;color:#57606a;text-align:center;">
    This email was sent automatically by Jenkins · QCOS CI/CD Pipeline (Gate)
  </div>
</div>
</body>
</html>""",
                        to: "${env.CICD_REPORT_EMAIL}",
                        mimeType: 'text/html'
                    )
                }
            }
        }
        aborted {
            script {
                // Comment on Gitee PR: CI/CD aborted
                if (env.giteePullRequestIid) {
                    echo ">>> Commenting on Gitee PR #${env.giteePullRequestIid} (build aborted)"
                    try {
                        addGiteeMRComment comment: """### 🚫 CI/CD Pipeline Aborted

| Item | Info |
|------|------|
| **Build Number** | [#${env.BUILD_NUMBER}](${env.BUILD_URL}) |
| **Source Branch** | ${env.giteeSourceBranch ?: 'N/A'} |
| **Target Branch** | ${env.giteeTargetBranch ?: 'N/A'} |

Build was aborted or timed out. 🚫

[View Details](${env.BUILD_URL})
"""
                    } catch (Exception e) {
                        echo ">>> Failed to add aborted comment to PR: ${e.message}"
                    }
                }

                if (env.CICD_REPORT_EMAIL) {
                    emailext(
                        subject: "[QCOS CI/CD - Gate] 🚫 ABORTED — Build #${env.BUILD_NUMBER} on ${env.giteeSourceBranch}",
                        body: """<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"/></head>
<body style="font-family:sans-serif;background:#f6f8fa;padding:24px;">
<div style="max-width:680px;margin:0 auto;background:#fff;border-radius:8px;border:1px solid #d0d7de;overflow:hidden;">
  <div style="padding:24px 28px;border-bottom:1px solid #d0d7de;">
    <h1 style="margin:0 0 4px;font-size:20px;">🚀 QCOS CI/CD Pipeline Report (Gate)</h1>
    <p style="color:#57606a;font-size:14px;margin:0;">Build #${env.BUILD_NUMBER} · ${env.giteeSourceBranch}</p>
  </div>
  <div style="padding:16px 28px;background:#fff8c5;color:#9a6700;font-size:18px;font-weight:600;">
    Overall Status: 🚫 ABORTED
  </div>
  <div style="padding:20px 28px;">
    <h2 style="font-size:14px;color:#57606a;text-transform:uppercase;letter-spacing:.05em;margin:0 0 12px;">Pipeline Details (Gate)</h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;font-size:14px;">
      <span style="color:#57606a;">Branch</span><span>${env.giteeSourceBranch}</span>
      <span style="color:#57606a;">Commit</span><span>${env.GIT_COMMIT ?: 'N/A'}</span>
      <span style="color:#57606a;">Build</span><span>#${env.BUILD_NUMBER}</span>
    </div>
    <a href="${env.BUILD_URL}" style="display:inline-block;margin-top:20px;padding:10px 20px;background:#0969da;color:#fff;border-radius:6px;text-decoration:none;font-size:14px;font-weight:600;">View Full Run Logs →</a>
  </div>
  <div style="padding:16px 28px;border-top:1px solid #d0d7de;font-size:12px;color:#57606a;text-align:center;">
    This email was sent automatically by Jenkins · QCOS CI/CD Pipeline (Gate)
  </div>
</div>
</body>
</html>""",
                        to: "${env.CICD_REPORT_EMAIL}",
                        mimeType: 'text/html'
                    )
                }
            }
        }
    }
}
