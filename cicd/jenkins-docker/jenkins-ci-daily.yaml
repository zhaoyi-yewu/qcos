// ==========================================================================
// QCOS CI/CD Jenkins Pipeline (Daily)
// ==========================================================================

pipeline {
    agent {
        docker {
            image 'qcos-sandbox:cicd'
            args '--network host -v /var/run/docker.sock:/var/run/docker.sock -v /etc/localtime:/etc/localtime:ro -v /etc/hosts:/etc/hosts -v /var/qcos:/var/qcos -v /var/log/qcos:/var/log/qcos -e TZ=Asia/Shanghai'
        }
    }

    triggers {
        cron('0 0 * * *')
    }

    parameters {
        persistentString(name: 'GIT_REPO_URL',
               defaultValue: 'git@gitee.com:WUYUEQbit/qcos.git',
               description: 'Git repository URL. eg. Gitee (git@gitee.com:WUYUEQbit/qcos.git) or GitLab (ssh://git@gitlab.cmss.com:2223/OCRI/WuYueOs.git)')
        persistentString(name: 'GIT_BRANCH',
               defaultValue: '*/develop',
               description: 'Git branch to build. e.g. Gitee (*/develop) or GitLab (*/dev_gitee)')
        persistentString(name: 'GIT_CREDENTIALS_ID',
               defaultValue: 'gitee-ssh-key',
               description: 'Jenkins stored SSH credential ID for the Git repository. e.g. Gitee (gitee-ssh-key) or GitLab (gitlab-ssh-key)')
        persistentString(name: 'CICD_REPORT_EMAIL',
               defaultValue: 'zhaoyi@cmss.chinamobile.com',
               description: 'Email address(es) for CI/CD report notification. Supports single (user@example.com) or multiple comma-separated (a@example.com,b@example.com). Leave empty to skip email notification.')
        persistentString(name: 'YUM_MIRROR',
               defaultValue: '',
               description: 'YUM mirror URL. Leave empty to use default. e.g. GitLab (http://qcos-mirrors.bclinux.org/openeuler)')
        persistentString(name: 'PIP_MIRROR',
               defaultValue: '',
               description: 'PIP mirror URL. Leave empty to use default. e.g. GitLab (http://qcos-mirrors.bclinux.org/bigcloud/bc-uns/bc-uns/pip/2.7/simple)')
        persistentString(name: 'NPM_MIRROR',
               defaultValue: '',
               description: 'NPM mirror URL. Leave empty to use default. e.g. GitLab (http://qcos-mirrors.bclinux.org:28081/repository/qcos/)')
        persistentString(name: 'PYTHON_SRC_MIRROR',
               defaultValue: '',
               description: 'PYTHON source mirror URL. Leave empty to use default. e.g. GitLab (http://qcos-mirrors.bclinux.org/bigcloud/bc-uns/bc-uns/extra_pkgs/pkgs/python/python-src/3.11.6/Python-3.11.6.tgz)')
        persistentString(name: 'PYPY3_BIN_MIRROR',
               defaultValue: '',
               description: 'PYPY3 bin mirror URL. Leave empty to use default. e.g. GitLab (http://qcos-mirrors.bclinux.org/bigcloud/bc-uns/bc-uns/extra_pkgs/pkgs/python/pypy/pypy3.11-v7.3.20-linux64.tar.bz2)')
        persistentString(name: 'DOCKER_COMPOSE_BIN_MIRROR',
               defaultValue: '',
               description: 'docker-compose bin mirror URL. Leave empty to use default. e.g. GitLab (http://qcos-mirrors.bclinux.org/bigcloud/bc-uns/bc-uns/extra_pkgs/pkgs/docker/docker-compose/docker-compose-linux-x86_64-v5.2.0)')
    }

    environment {
        GIT_REPO_URL = "${params.GIT_REPO_URL?: ''}"
        GIT_BRANCH = "${params.GIT_BRANCH?: ''}"
        GIT_CREDENTIALS_ID = "${params.GIT_CREDENTIALS_ID?: ''}"
        CICD_REPORT_EMAIL = "${params.CICD_REPORT_EMAIL?: ''}"
        YUM_MIRROR = "${params.YUM_MIRROR?: ''}"
        PIP_MIRROR = "${params.PIP_MIRROR?: ''}"
        NPM_MIRROR = "${params.NPM_MIRROR?: ''}"
        PYTHON_SRC_MIRROR = "${params.PYTHON_SRC_MIRROR?: ''}"
        PYPY3_BIN_MIRROR = "${params.PYPY3_BIN_MIRROR?: ''}"
        DOCKER_COMPOSE_BIN_MIRROR = "${params.DOCKER_COMPOSE_BIN_MIRROR?: ''}"
    }

    options {
        timestamps()
        timeout(time: 5, unit: 'HOURS')
        buildDiscarder(logRotator(numToKeepStr: '5', artifactNumToKeepStr: '5'))
        giteeConnection('my-gitee')
        // Prevent concurrent builds (shared Docker daemon, container name conflicts)
        disableConcurrentBuilds()
    }

    stages {
        // =============================================================
        // Initialize: Checkout code and prepare environment
        // =============================================================
        stage('Initialize') {
            steps {
                script {
                    qcosCleanup()
                    dockerCleanup()
                    checkoutCode()
                    echo ">>> YUM_MIRROR: ${env.YUM_MIRROR ?: '(default)'}"
                }
            }
        }

        // =============================================================
        // Build Stage 1: Build qcos-base Docker image
        // =============================================================
        stage('Build QCOS Base Image') {
            steps {
                sh """#!/bin/bash
                set -eo pipefail
                cd build-scripts
                source ./version
                cp ./env.template ./.env
                if [ -n "\${YUM_MIRROR}" ]; then
                    sed -i "s@^YUM_MIRROR=.*@YUM_MIRROR=\${YUM_MIRROR}@" ./.env
                fi
                if [ -n "\${PIP_MIRROR}" ]; then
                    sed -i "s@^PIP_MIRROR=.*@PIP_MIRROR=\${PIP_MIRROR}@" ./.env
                fi
                if [ -n "\${NPM_MIRROR}" ]; then
                    sed -i "s@^NPM_MIRROR=.*@NPM_MIRROR=\${NPM_MIRROR}@" ./.env
                fi
                if [ -n "\${PYTHON_SRC_MIRROR}" ]; then
                    sed -i "s@^PYTHON_SRC_MIRROR=.*@PYTHON_SRC_MIRROR=\${PYTHON_SRC_MIRROR}@" ./.env
                fi
                if [ -n "\${PYPY3_BIN_MIRROR}" ]; then
                    sed -i "s@^PYPY3_BIN_MIRROR=.*@PYPY3_BIN_MIRROR=\${PYPY3_BIN_MIRROR}@" ./.env
                fi
                if [ -n "\${DOCKER_COMPOSE_BIN_MIRROR}" ]; then
                    sed -i "s@^DOCKER_COMPOSE_BIN_MIRROR=.*@DOCKER_COMPOSE_BIN_MIRROR=\${DOCKER_COMPOSE_BIN_MIRROR}@" ./.env
                fi
                df -h
                ./build-images.sh -b -t dev
                """
            }
        }

        // =============================================================
        // Build Stage 2: Build qcos-sandbox Docker image
        // =============================================================
        stage('Build Sandbox Image') {
            steps {
                sh """#!/bin/bash
                set -eo pipefail
                cd build-scripts
                source ./version
                cp ./env.template ./.env
                if [ -n "\${YUM_MIRROR}" ]; then
                    sed -i "s@^YUM_MIRROR=.*@YUM_MIRROR=\${YUM_MIRROR}@" ./.env
                fi
                if [ -n "\${PIP_MIRROR}" ]; then
                    sed -i "s@^PIP_MIRROR=.*@PIP_MIRROR=\${PIP_MIRROR}@" ./.env
                fi
                if [ -n "\${NPM_MIRROR}" ]; then
                    sed -i "s@^NPM_MIRROR=.*@NPM_MIRROR=\${NPM_MIRROR}@" ./.env
                fi
                if [ -n "\${PYTHON_SRC_MIRROR}" ]; then
                    sed -i "s@^PYTHON_SRC_MIRROR=.*@PYTHON_SRC_MIRROR=\${PYTHON_SRC_MIRROR}@" ./.env
                fi
                if [ -n "\${PYPY3_BIN_MIRROR}" ]; then
                    sed -i "s@^PYPY3_BIN_MIRROR=.*@PYPY3_BIN_MIRROR=\${PYPY3_BIN_MIRROR}@" ./.env
                fi
                if [ -n "\${DOCKER_COMPOSE_BIN_MIRROR}" ]; then
                    sed -i "s@^DOCKER_COMPOSE_BIN_MIRROR=.*@DOCKER_COMPOSE_BIN_MIRROR=\${DOCKER_COMPOSE_BIN_MIRROR}@" ./.env
                fi
                df -h
                ./build-images.sh -s -t dev
                """
            }
        }

        // =============================================================
        // Build Stage 3: Build qcos Docker image
        // =============================================================
        stage('Build QCOS Image') {
            steps {
                sh """#!/bin/bash
                set -eo pipefail
                cd build-scripts
                if [ -e /usr/libexec/docker/cli-plugins/docker-compose ] && [ ! -e /usr/bin/docker-compose ] && [ ! -L /usr/bin/docker-compose ]; then
                    ln -sf /usr/libexec/docker/cli-plugins/docker-compose /usr/bin/docker-compose
                fi
                source ./version
                cp ./env.template ./.env
                if [ -n "\${YUM_MIRROR}" ]; then
                    sed -i "s@^YUM_MIRROR=.*@YUM_MIRROR=\${YUM_MIRROR}@" ./.env
                fi
                if [ -n "\${PIP_MIRROR}" ]; then
                    sed -i "s@^PIP_MIRROR=.*@PIP_MIRROR=\${PIP_MIRROR}@" ./.env
                fi
                if [ -n "\${NPM_MIRROR}" ]; then
                    sed -i "s@^NPM_MIRROR=.*@NPM_MIRROR=\${NPM_MIRROR}@" ./.env
                fi
                if [ -n "\${PYTHON_SRC_MIRROR}" ]; then
                    sed -i "s@^PYTHON_SRC_MIRROR=.*@PYTHON_SRC_MIRROR=\${PYTHON_SRC_MIRROR}@" ./.env
                fi
                if [ -n "\${PYPY3_BIN_MIRROR}" ]; then
                    sed -i "s@^PYPY3_BIN_MIRROR=.*@PYPY3_BIN_MIRROR=\${PYPY3_BIN_MIRROR}@" ./.env
                fi
                if [ -n "\${DOCKER_COMPOSE_BIN_MIRROR}" ]; then
                    sed -i "s@^DOCKER_COMPOSE_BIN_MIRROR=.*@DOCKER_COMPOSE_BIN_MIRROR=\${DOCKER_COMPOSE_BIN_MIRROR}@" ./.env
                fi
                sed -i "s@^BUILD_WHEEL_IN_SANDBOX=.*@BUILD_WHEEL_IN_SANDBOX=False@" ./.env

                df -h
                cp ./docker-compose-sandbox.yaml ./docker-compose-sandbox-temp.yaml
                sed -i 's/qcos-sandbox:/qcos-sandbox-temp:/' ./docker-compose-sandbox-temp.yaml
                ./run-sandbox.sh -n qcos-sandbox-temp -f ./docker-compose-sandbox-temp.yaml
                export BUILD_WHEEL_IN_SANDBOX=false
                docker exec qcos-sandbox-temp sh -c "source /root/.bashrc; cd /root/qcos-project/build-scripts; ./build-images.sh -q -t dev"
                """
            }
            post {
                always {
                    qcosCleanup()
                }
            }
        }

        // =============================================================
        // Build Stage 4: Build qcos-cli Docker image
        // =============================================================
        stage('Build QCOS-CLI Image') {
            steps {
                sh """#!/bin/bash
                set -eo pipefail
                cd build-scripts
                if [ -e /usr/libexec/docker/cli-plugins/docker-compose ] && [ ! -e /usr/bin/docker-compose ] && [ ! -L /usr/bin/docker-compose ]; then
                    ln -sf /usr/libexec/docker/cli-plugins/docker-compose /usr/bin/docker-compose
                fi
                source ./version
                cp ./env.template ./.env
                if [ -n "\${YUM_MIRROR}" ]; then
                    sed -i "s@^YUM_MIRROR=.*@YUM_MIRROR=\${YUM_MIRROR}@" ./.env
                fi
                if [ -n "\${PIP_MIRROR}" ]; then
                    sed -i "s@^PIP_MIRROR=.*@PIP_MIRROR=\${PIP_MIRROR}@" ./.env
                fi
                if [ -n "\${NPM_MIRROR}" ]; then
                    sed -i "s@^NPM_MIRROR=.*@NPM_MIRROR=\${NPM_MIRROR}@" ./.env
                fi
                if [ -n "\${PYTHON_SRC_MIRROR}" ]; then
                    sed -i "s@^PYTHON_SRC_MIRROR=.*@PYTHON_SRC_MIRROR=\${PYTHON_SRC_MIRROR}@" ./.env
                fi
                if [ -n "\${PYPY3_BIN_MIRROR}" ]; then
                    sed -i "s@^PYPY3_BIN_MIRROR=.*@PYPY3_BIN_MIRROR=\${PYPY3_BIN_MIRROR}@" ./.env
                fi
                if [ -n "\${DOCKER_COMPOSE_BIN_MIRROR}" ]; then
                    sed -i "s@^DOCKER_COMPOSE_BIN_MIRROR=.*@DOCKER_COMPOSE_BIN_MIRROR=\${DOCKER_COMPOSE_BIN_MIRROR}@" ./.env
                fi
                sed -i "s@^BUILD_WHEEL_IN_SANDBOX=.*@BUILD_WHEEL_IN_SANDBOX=False@" ./.env

                df -h
                cp ./docker-compose-sandbox.yaml ./docker-compose-sandbox-temp.yaml
                sed -i 's/qcos-sandbox:/qcos-sandbox-temp:/' ./docker-compose-sandbox-temp.yaml
                ./run-sandbox.sh -n qcos-sandbox-temp -f ./docker-compose-sandbox-temp.yaml
                export BUILD_WHEEL_IN_SANDBOX=false
                docker exec qcos-sandbox-temp sh -c "source /root/.bashrc; cd /root/qcos-project/build-scripts; ./build-images.sh -c -t dev"
                """
            }
            post {
                always {
                    qcosCleanup()
                }
            }
        }

        // =============================================================
        // Test Stage 1: Run cpp unit tests for qcos
        // =============================================================
        stage('Run CPP UT/Coverage - QCOS') {
            steps {
                sh """#!/bin/bash
                set -eo pipefail
                cd build-scripts
                if [ -e /usr/libexec/docker/cli-plugins/docker-compose ] && [ ! -e /usr/bin/docker-compose ] && [ ! -L /usr/bin/docker-compose ]; then
                    ln -sf /usr/libexec/docker/cli-plugins/docker-compose /usr/bin/docker-compose
                fi
                cp ./env.template ./.env
                export SANDBOX_IMAGE_VERSION=dev
                cp ./docker-compose-sandbox.yaml ./docker-compose-sandbox-temp.yaml
                sed -i 's/qcos-sandbox:/qcos-sandbox-temp:/' ./docker-compose-sandbox-temp.yaml
                ./run-sandbox.sh -n qcos-sandbox-temp -f ./docker-compose-sandbox-temp.yaml
                docker exec qcos-sandbox-temp sh -c "source /root/.bashrc; cd /root/qcos-project; ./cicd/run-tests.sh -b; ./cicd/run-tests.sh -t all"
                """
            }
            post {
                always {
                    qcosCleanup()
                }
            }
        }

        // =============================================================
        // Test Stage 2: Run unit/coverage tests for qcos
        // =============================================================
        stage('Run UT/Coverage - QCOS') {
            steps {
                sh """#!/bin/bash
                set -eo pipefail
                cd build-scripts
                if [ -e /usr/libexec/docker/cli-plugins/docker-compose ] && [ ! -e /usr/bin/docker-compose ] && [ ! -L /usr/bin/docker-compose ]; then
                    ln -sf /usr/libexec/docker/cli-plugins/docker-compose /usr/bin/docker-compose
                fi
                cp ./env.template ./.env
                export SANDBOX_IMAGE_VERSION=dev
                cp ./docker-compose-sandbox.yaml ./docker-compose-sandbox-temp.yaml
                sed -i 's/qcos-sandbox:/qcos-sandbox-temp:/' ./docker-compose-sandbox-temp.yaml
                ./run-sandbox.sh -n qcos-sandbox-temp -f ./docker-compose-sandbox-temp.yaml
                docker exec qcos-sandbox-temp sh -c "source /root/.bashrc; cd /root/qcos-project; ./cicd/run-tests.sh -b; ./cicd/run-tests.sh -c all"
                """
            }
            post {
                always {
                    qcosCleanup()
                }
            }
        }

        // =============================================================
        // Test Stage 3: Run unit/coverage tests for qcos-cli
        // =============================================================
        stage('Run UT/Coverage - QCOS-CLI') {
            steps {
                sh """#!/bin/bash
                set -eo pipefail
                cd build-scripts
                if [ -e /usr/libexec/docker/cli-plugins/docker-compose ] && [ ! -e /usr/bin/docker-compose ] && [ ! -L /usr/bin/docker-compose ]; then
                    ln -sf /usr/libexec/docker/cli-plugins/docker-compose /usr/bin/docker-compose
                fi
                cp ./env.template ./.env
                export SANDBOX_IMAGE_VERSION=dev
                cp ./docker-compose-sandbox.yaml ./docker-compose-sandbox-temp.yaml
                sed -i 's/qcos-sandbox:/qcos-sandbox-temp:/' ./docker-compose-sandbox-temp.yaml
                ./run-sandbox.sh -n qcos-sandbox-temp -f ./docker-compose-sandbox-temp.yaml
                docker exec qcos-sandbox-temp sh -c "source /root/.bashrc; cd /root/qcos-project; ./cicd/run-tests.sh -e all"
                """
            }
            post {
                always {
                    qcosCleanup()
                }
            }
        }

        // =============================================================
        // Test Stage 4: Run system tests for qcos
        // =============================================================
        stage('Run System Tests - QCOS') {
            steps {
                script {
                    qcosCleanup()
                }

                sh """#!/bin/bash
                set -eo pipefail
                cd build-scripts
                if [ -e /usr/libexec/docker/cli-plugins/docker-compose ] && [ ! -e /usr/bin/docker-compose ] && [ ! -L /usr/bin/docker-compose ]; then
                    ln -sf /usr/libexec/docker/cli-plugins/docker-compose /usr/bin/docker-compose
                fi

                TOP_DIR=\$(cd .. && pwd)

                # Configure environment
                cp ./env.template ./.env
                if [ -n "\${YUM_MIRROR}" ]; then
                    sed -i "s@^YUM_MIRROR=.*@YUM_MIRROR=\${YUM_MIRROR}@" ./.env
                fi
                if [ -n "\${PIP_MIRROR}" ]; then
                    sed -i "s@^PIP_MIRROR=.*@PIP_MIRROR=\${PIP_MIRROR}@" ./.env
                fi
                if [ -n "\${NPM_MIRROR}" ]; then
                    sed -i "s@^NPM_MIRROR=.*@NPM_MIRROR=\${NPM_MIRROR}@" ./.env
                fi
                if [ -n "\${PYTHON_SRC_MIRROR}" ]; then
                    sed -i "s@^PYTHON_SRC_MIRROR=.*@PYTHON_SRC_MIRROR=\${PYTHON_SRC_MIRROR}@" ./.env
                fi
                if [ -n "\${PYPY3_BIN_MIRROR}" ]; then
                    sed -i "s@^PYPY3_BIN_MIRROR=.*@PYPY3_BIN_MIRROR=\${PYPY3_BIN_MIRROR}@" ./.env
                fi
                if [ -n "\${DOCKER_COMPOSE_BIN_MIRROR}" ]; then
                    sed -i "s@^DOCKER_COMPOSE_BIN_MIRROR=.*@DOCKER_COMPOSE_BIN_MIRROR=\${DOCKER_COMPOSE_BIN_MIRROR}@" ./.env
                fi
                sed -i 's@^QCOS_VERSION=.*@QCOS_VERSION=dev@' ./version
                sed -i 's@^LOCAL_CICD=.*@LOCAL_CICD=True@' ./.env
                # Prepare config files for system tests
                # NOTE: In Docker-in-Docker Jenkins setup, /etc/qcos/ refers to the
                # host path. If Jenkins runs inside a container, you may need to
                # adjust these paths or use HOST_MOUNT_PREFIX env variable.
                mkdir -p /etc/qcos/
                cp -rf \${TOP_DIR}/etc/qcos/st-conf.d /etc/qcos/
                cp -rf \${TOP_DIR}/etc/qcos/qcos-st.toml /etc/qcos/
                # Clean existing pgsql database
                echo "Clean existing pgsql database"
                \${TOP_DIR}/bin/clean-qcos-db.sh -f
                # Start QCOS system via docker-compose
                ./run-docker.sh
                # Wait for qcos-api to become ready
                QCOS_SERVER_IP=127.0.0.1
                QCOS_SERVER_PORT=18400
                MAX_ATTEMPTS=30
                SLEEP_INTERVAL=10
                count=0
                echo "Try to access qcos-api: http://\${QCOS_SERVER_IP}:\${QCOS_SERVER_PORT} ..."
                until curl -o /dev/null -s http://\${QCOS_SERVER_IP}:\${QCOS_SERVER_PORT} || [ \$count -ge \${MAX_ATTEMPTS} ]; do
                    echo "waiting for qcos-api ... (attempt \$((count+1))/\${MAX_ATTEMPTS})"
                    sleep \${SLEEP_INTERVAL}
                    count=\$((count+1))
                done
                if [ \$count -lt \${MAX_ATTEMPTS} ]; then
                    echo "qcos-api is ready"
                else
                    total_seconds=\$((MAX_ATTEMPTS * SLEEP_INTERVAL))
                    echo "ERROR: qcos-api did not become ready after \${MAX_ATTEMPTS} attempts (total \${MAX_ATTEMPTS}*\${SLEEP_INTERVAL}=\${total_seconds} seconds)"
                    docker logs qcos
                    echo "Print /var/log/qcos/qcos-api.log ..."
                    cat /var/log/qcos/qcos-api.log || true
                    echo "Print /var/log/qcos/postgresql.log ..."
                    cat /var/log/qcos/postgresql.log || true
                    exit 1
                fi
                # Run system tests in qcos container
                sleep 10
                echo "Running system tests in container: qcos"
                cd \${TOP_DIR}
                tar czf /tmp/cicd.tar.gz ./cicd ./src ./etc ./samples
                docker cp /tmp/cicd.tar.gz qcos:/root/
                docker exec qcos sh -c "mkdir -p /root/qcos-project/; cd /root/qcos-project/; tar xzf /root/cicd.tar.gz"
                TEST_EXIT_CODE=0
                docker exec qcos sh -c "source /root/.bashrc; echo 'Transpiler list:'; qcos-cli list-transpilers; echo 'Driver list:'; qcos-cli list-drivers; echo 'Device list:'; qcos-cli list-devices; echo 'Job list:'; qcos-cli list-jobs; cd /root/qcos-project; ./cicd/run-tests.sh -s all" || TEST_EXIT_CODE=\$?
                # Print log files for debug purpose
                echo -e "\\n----------------------------------\\nPrint log files for debug purpose:"
                awk 'FNR==1{print "\\n\\n--- Log File: " FILENAME " ---"} {print} END{print ""}' /var/log/qcos/qcos-api.log /var/log/qcos/postgresql.log /var/log/qcos/device*.log || true
                exit \${TEST_EXIT_CODE}
                """
            }
            post {
                always {
                    qcosCleanup()
                }
            }
        }
    }

    post {
        always {
            script {
                qcosCleanup()
                dockerCleanup()
            }
        }
        success {
            script {
                if (env.CICD_REPORT_EMAIL) {
                    echo "Attempting to send SUCCESS email to: ${env.CICD_REPORT_EMAIL}"
                    try {
                        emailext(
                            subject: "[QCOS CI/CD - Daily] ✅ SUCCESS — Build #${env.BUILD_NUMBER} on ${env.GIT_BRANCH}",
                            body: """<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"/></head>
<body style="font-family:sans-serif;background:#f6f8fa;padding:24px;">
<div style="max-width:680px;margin:0 auto;background:#fff;border-radius:8px;border:1px solid #d0d7de;overflow:hidden;">
  <div style="padding:24px 28px;border-bottom:1px solid #d0d7de;">
    <h1 style="margin:0 0 4px;font-size:20px;">🚀 QCOS CI/CD Pipeline Report (Daily)</h1>
    <p style="color:#57606a;font-size:14px;margin:0;">Build #${env.BUILD_NUMBER} · ${env.GIT_BRANCH}</p>
  </div>
  <div style="padding:16px 28px;background:#dafbe1;color:#1a7f37;font-size:18px;font-weight:600;">
    Overall Status: ✅ SUCCESS
  </div>
  <div style="padding:20px 28px;">
    <h2 style="font-size:14px;color:#57606a;text-transform:uppercase;letter-spacing:.05em;margin:0 0 12px;">Pipeline Details (Daily)</h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;font-size:14px;">
      <span style="color:#57606a;">Branch</span><span>${env.GIT_BRANCH}</span>
      <span style="color:#57606a;">Commit</span><span>${env.GIT_COMMIT ?: 'N/A'}</span>
      <span style="color:#57606a;">Build</span><span>#${env.BUILD_NUMBER}</span>
    </div>
    <a href="${env.BUILD_URL}" style="display:inline-block;margin-top:20px;padding:10px 20px;background:#0969da;color:#fff;border-radius:6px;text-decoration:none;font-size:14px;font-weight:600;">View Full Run Logs →</a>
  </div>
  <div style="padding:16px 28px;border-top:1px solid #d0d7de;font-size:12px;color:#57606a;text-align:center;">
    This email was sent automatically by Jenkins · QCOS CI/CD Pipeline (Daily)
  </div>
</div>
</body>
</html>""",
                            to: "${env.CICD_REPORT_EMAIL}",
                            mimeType: 'text/html'
                        )
                        echo "SUCCESS email sent successfully"
                    } catch (Exception e) {
                        echo "SUCCESS email send failed: ${e.message}"
                    }
