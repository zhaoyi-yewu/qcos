// ==========================================================================
// QCOS CI/CD Jenkins (Sandbox builder)
// ==========================================================================

pipeline {
    agent any

    triggers {
        cron('0 22 * * *')
    }

    parameters {
        persistentString(name: 'GIT_REPO_URL',
               defaultValue: 'git@gitee.com:WUYUEQbit/qcos.git',
               description: 'Git repository URL. eg. Gitee (git@gitee.com:WUYUEQbit/qcos.git) or GitLab (ssh://git@gitlab.cmss.com:2223/OCRI/WuYueOs.git)')
        persistentString(name: 'GIT_BRANCH',
               defaultValue: '*/develop',
               description: 'Git branch to build. e.g. Gitee (*/develop) or GitLab (*/dev_gitee)')
        persistentString(name: 'GIT_CREDENTIALS_ID',
               defaultValue: 'gitee-ssh-key',
               description: 'Jenkins stored SSH credential ID for the Git repository. e.g. Gitee (gitee-ssh-key) or GitLab (gitlab-ssh-key)')
        persistentString(name: 'CICD_REPORT_EMAIL',
               defaultValue: 'zhaoyi@cmss.chinamobile.com',
               description: 'Email address(es) for CI/CD report notification. Supports single (user@example.com) or multiple comma-separated (a@example.com,b@example.com). Leave empty to skip email notification.')
        persistentString(name: 'YUM_MIRROR',
               defaultValue: '',
               description: 'YUM mirror URL. Leave empty to use default. e.g. GitLab (http://qcos-mirrors.bclinux.org/openeuler)')
        persistentString(name: 'PIP_MIRROR',
               defaultValue: '',
               description: 'PIP mirror URL. Leave empty to use default. e.g. GitLab (http://qcos-mirrors.bclinux.org/bigcloud/bc-uns/bc-uns/pip/2.7/simple)')
        persistentString(name: 'NPM_MIRROR',
               defaultValue: '',
               description: 'NPM mirror URL. Leave empty to use default. e.g. GitLab (http://qcos-mirrors.bclinux.org:28081/repository/qcos/)')
        persistentString(name: 'PYTHON_SRC_MIRROR',
               defaultValue: '',
               description: 'PYTHON source mirror URL. Leave empty to use default. e.g. GitLab (http://qcos-mirrors.bclinux.org/bigcloud/bc-uns/bc-uns/extra_pkgs/pkgs/python/python-src/3.11.6/Python-3.11.6.tgz)')
        persistentString(name: 'PYPY3_BIN_MIRROR',
               defaultValue: '',
               description: 'PYPY3 bin mirror URL. Leave empty to use default. e.g. GitLab (http://qcos-mirrors.bclinux.org/bigcloud/bc-uns/bc-uns/extra_pkgs/pkgs/python/pypy/pypy3.11-v7.3.20-linux64.tar.bz2)')
        persistentString(name: 'DOCKER_COMPOSE_BIN_MIRROR',
               defaultValue: '',
               description: 'docker-compose bin mirror URL. Leave empty to use default. e.g. GitLab (http://qcos-mirrors.bclinux.org/bigcloud/bc-uns/bc-uns/extra_pkgs/pkgs/docker/docker-compose/docker-compose-linux-x86_64-v5.2.0)')
    }

    environment {
        GIT_REPO_URL = "${params.GIT_REPO_URL?: ''}"
        GIT_BRANCH = "${params.GIT_BRANCH?: ''}"
        GIT_CREDENTIALS_ID = "${params.GIT_CREDENTIALS_ID?: ''}"
        CICD_REPORT_EMAIL = "${params.CICD_REPORT_EMAIL?: ''}"
        YUM_MIRROR = "${params.YUM_MIRROR?: ''}"
        PIP_MIRROR = "${params.PIP_MIRROR?: ''}"
        NPM_MIRROR = "${params.NPM_MIRROR?: ''}"
        PYTHON_SRC_MIRROR = "${params.PYTHON_SRC_MIRROR?: ''}"
        PYPY3_BIN_MIRROR = "${params.PYPY3_BIN_MIRROR?: ''}"
        DOCKER_COMPOSE_BIN_MIRROR = "${params.DOCKER_COMPOSE_BIN_MIRROR?: ''}"
    }

    options {
        timestamps()
        timeout(time: 5, unit: 'HOURS')
        buildDiscarder(logRotator(numToKeepStr: '5', artifactNumToKeepStr: '5'))
        giteeConnection('my-gitee')
        // Prevent concurrent builds (shared Docker daemon, container name conflicts)
        disableConcurrentBuilds()
    }

    stages {
        // =============================================================
        // Initialize: Checkout code and prepare environment
        // =============================================================
        stage('Initialize') {
            steps {
                script {
                    dockerCleanup()
                    checkout([
                        $class: 'GitSCM',
                        branches: [[name: "${params.GIT_BRANCH}"]],
                        doGenerateSubmoduleConfigurations: false,
                        extensions: [[$class: 'CleanBeforeCheckout']],
                        submoduleCfg: [],
                        userRemoteConfigs: [[credentialsId: "${params.GIT_CREDENTIALS_ID}", url: "${params.GIT_REPO_URL}"]]
                    ])
                    echo ">>> Build #${env.BUILD_NUMBER} on branch ${env.GIT_BRANCH}"
                    echo ">>> Repo: ${params.GIT_REPO_URL} | Branch: ${params.GIT_BRANCH} | Creds: ${params.GIT_CREDENTIALS_ID}"
                    echo ">>> YUM_MIRROR: ${env.YUM_MIRROR ?: '(default)'}"
                }
            }
        }

        // =============================================================
        // Build Stage 1: Build qcos-base Docker image
        // =============================================================
        stage('Build QCOS Base Image') {
            steps {
                sh """#!/bin/bash
                set -eo pipefail
                cd build-scripts
                source ./version
                cp ./env.template ./.env
                if [ -n "\${YUM_MIRROR}" ]; then
                    sed -i "s@^YUM_MIRROR=.*@YUM_MIRROR=\${YUM_MIRROR}@" ./.env
                fi
                if [ -n "\${PIP_MIRROR}" ]; then
                    sed -i "s@^PIP_MIRROR=.*@PIP_MIRROR=\${PIP_MIRROR}@" ./.env
                fi
                if [ -n "\${NPM_MIRROR}" ]; then
                    sed -i "s@^NPM_MIRROR=.*@NPM_MIRROR=\${NPM_MIRROR}@" ./.env
                fi
                if [ -n "\${PYTHON_SRC_MIRROR}" ]; then
                    sed -i "s@^PYTHON_SRC_MIRROR=.*@PYTHON_SRC_MIRROR=\${PYTHON_SRC_MIRROR}@" ./.env
                fi
                if [ -n "\${PYPY3_BIN_MIRROR}" ]; then
                    sed -i "s@^PYPY3_BIN_MIRROR=.*@PYPY3_BIN_MIRROR=\${PYPY3_BIN_MIRROR}@" ./.env
                fi
                if [ -n "\${DOCKER_COMPOSE_BIN_MIRROR}" ]; then
                    sed -i "s@^DOCKER_COMPOSE_BIN_MIRROR=.*@DOCKER_COMPOSE_BIN_MIRROR=\${DOCKER_COMPOSE_BIN_MIRROR}@" ./.env
                fi
                df -h
                ./build-images.sh -b -t dev
                """
            }
        }

        // =============================================================
        // Build Stage 2: Build qcos-sandbox Docker image
        // =============================================================
        stage('Build Sandbox Image') {
            steps {
                sh """#!/bin/bash
                set -eo pipefail
                cd build-scripts
                source ./version
                cp ./env.template ./.env
                if [ -n "\${YUM_MIRROR}" ]; then
                    sed -i "s@^YUM_MIRROR=.*@YUM_MIRROR=\${YUM_MIRROR}@" ./.env
                fi
                if [ -n "\${PIP_MIRROR}" ]; then
                    sed -i "s@^PIP_MIRROR=.*@PIP_MIRROR=\${PIP_MIRROR}@" ./.env
                fi
                if [ -n "\${NPM_MIRROR}" ]; then
                    sed -i "s@^NPM_MIRROR=.*@NPM_MIRROR=\${NPM_MIRROR}@" ./.env
                fi
                if [ -n "\${PYTHON_SRC_MIRROR}" ]; then
                    sed -i "s@^PYTHON_SRC_MIRROR=.*@PYTHON_SRC_MIRROR=\${PYTHON_SRC_MIRROR}@" ./.env
                fi
                if [ -n "\${PYPY3_BIN_MIRROR}" ]; then
                    sed -i "s@^PYPY3_BIN_MIRROR=.*@PYPY3_BIN_MIRROR=\${PYPY3_BIN_MIRROR}@" ./.env
                fi
                if [ -n "\${DOCKER_COMPOSE_BIN_MIRROR}" ]; then
                    sed -i "s@^DOCKER_COMPOSE_BIN_MIRROR=.*@DOCKER_COMPOSE_BIN_MIRROR=\${DOCKER_COMPOSE_BIN_MIRROR}@" ./.env
                fi
                df -h
                ./build-images.sh -s -t cicd
                """
            }
        }
    }

    post {
        always {
            script {
                dockerCleanup()
            }
        }
        success {
            script {
                if (env.CICD_REPORT_EMAIL) {
                    echo "Attempting to send SUCCESS email to: ${env.CICD_REPORT_EMAIL}"
                    try {
                        emailext(
                            subject: "[QCOS CI/CD - Sandbox] ✅ SUCCESS — Build #${env.BUILD_NUMBER} on ${env.GIT_BRANCH}",
                            body: """<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"/></head>
<body style="font-family:sans-serif;background:#f6f8fa;padding:24px;">
<div style="max-width:680px;margin:0 auto;background:#fff;border-radius:8px;border:1px solid #d0d7de;overflow:hidden;">
  <div style="padding:24px 28px;border-bottom:1px solid #d0d7de;">
    <h1 style="margin:0 0 4px;font-size:20px;">🚀 QCOS CI/CD Pipeline Report (Sandbox)</h1>
    <p style="color:#57606a;font-size:14px;margin:0;">Build #${env.BUILD_NUMBER} · ${env.GIT_BRANCH}</p>
  </div>
  <div style="padding:16px 28px;background:#dafbe1;color:#1a7f37;font-size:18px;font-weight:600;">
    Overall Status: ✅ SUCCESS
  </div>
  <div style="padding:20px 28px;">
    <h2 style="font-size:14px;color:#57606a;text-transform:uppercase;letter-spacing:.05em;margin:0 0 12px;">Pipeline Details (Sandbox)</h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;font-size:14px;">
      <span style="color:#57606a;">Branch</span><span>${env.GIT_BRANCH}</span>
      <span style="color:#57606a;">Commit</span><span>${env.GIT_COMMIT ?: 'N/A'}</span>
      <span style="color:#57606a;">Build</span><span>#${env.BUILD_NUMBER}</span>
    </div>
    <a href="${env.BUILD_URL}" style="display:inline-block;margin-top:20px;padding:10px 20px;background:#0969da;color:#fff;border-radius:6px;text-decoration:none;font-size:14px;font-weight:600;">View Full Run Logs →</a>
  </div>
  <div style="padding:16px 28px;border-top:1px solid #d0d7de;font-size:12px;color:#57606a;text-align:center;">
    This email was sent automatically by Jenkins · QCOS CI/CD Pipeline (Sandbox)
  </div>
</div>
</body>
</html>""",
                            to: "${env.CICD_REPORT_EMAIL}",
                            mimeType: 'text/html'
                        )
                        echo "SUCCESS email sent successfully"
                    } catch (Exception e) {
                        echo "SUCCESS email send failed: ${e.message}"
                    }
                }
            }
        }
        failure {
            script {
                if (env.CICD_REPORT_EMAIL) {
                    emailext(
                        subject: "[QCOS CI/CD - Sandbox] ❌ FAILED — Build #${env.BUILD_NUMBER} on ${env.GIT_BRANCH}",
                        body: """<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"/></head>
<body style="font-family:sans-serif;background:#f6f8fa;padding:24px;">
<div style="max-width:680px;margin:0 auto;background:#fff;border-radius:8px;border:1px solid #d0d7de;overflow:hidden;">
  <div style="padding:24px 28px;border-bottom:1px solid #d0d7de;">
    <h1 style="margin:0 0 4px;font-size:20px;">🚀 QCOS CI/CD Pipeline Report (Sandbox)</h1>
    <p style="color:#57606a;font-size:14px;margin:0;">Build #${env.BUILD_NUMBER} · ${env.GIT_BRANCH}</p>
  </div>
  <div style="padding:16px 28px;background:#ffebe9;color:#cf222e;font-size:18px;font-weight:600;">
    Overall Status: ❌ FAILED
  </div>
  <div style="padding:20px 28px;">
    <h2 style="font-size:14px;color:#57606a;text-transform:uppercase;letter-spacing:.05em;margin:0 0 12px;">Pipeline Details (Sandbox)</h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;font-size:14px;">
      <span style="color:#57606a;">Branch</span><span>${env.GIT_BRANCH}</span>
      <span style="color:#57606a;">Commit</span><span>${env.GIT_COMMIT ?: 'N/A'}</span>
      <span style="color:#57606a;">Build</span><span>#${env.BUILD_NUMBER}</span>
    </div>
    <a href="${env.BUILD_URL}" style="display:inline-block;margin-top:20px;padding:10px 20px;background:#0969da;color:#fff;border-radius:6px;text-decoration:none;font-size:14px;font-weight:600;">View Full Run Logs →</a>
  </div>
  <div style="padding:16px 28px;border-top:1px solid #d0d7de;font-size:12px;color:#57606a;text-align:center;">
    This email was sent automatically by Jenkins · QCOS CI/CD Pipeline (Sandbox)
  </div>
</div>
</body>
</html>""",
                        to: "${env.CICD_REPORT_EMAIL}",
                        mimeType: 'text/html'
                    )
                }
            }
        }
        unstable {
            script {
                if (env.CICD_REPORT_EMAIL) {
                    emailext(
                        subject: "[QCOS CI/CD - Sandbox] ⚠️ UNSTABLE — Build #${env.BUILD_NUMBER} on ${env.GIT_BRANCH}",
                        body: """<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"/></head>
<body style="font-family:sans-serif;background:#f6f8fa;padding:24px;">
<div style="max-width:680px;margin:0 auto;background:#fff;border-radius:8px;border:1px solid #d0d7de;overflow:hidden;">
  <div style="padding:24px 28px;border-bottom:1px solid #d0d7de;">
    <h1 style="margin:0 0 4px;font-size:20px;">🚀 QCOS CI/CD Pipeline Report (Sandbox)</h1>
    <p style="color:#57606a;font-size:14px;margin:0;">Build #${env.BUILD_NUMBER} · ${env.GIT_BRANCH}</p>
  </div>
  <div style="padding:16px 28px;background:#fff8c5;color:#9a6700;font-size:18px;font-weight:600;">
    Overall Status: ⚠️ UNSTABLE
  </div>
  <div style="padding:20px 28px;">
    <h2 style="font-size:14px;color:#57606a;text-transform:uppercase;letter-spacing:.05em;margin:0 0 12px;">Pipeline Details (Sandbox)</h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;font-size:14px;">
      <span style="color:#57606a;">Branch</span><span>${env.GIT_BRANCH}</span>
      <span style="color:#57606a;">Commit</span><span>${env.GIT_COMMIT ?: 'N/A'}</span>
      <span style="color:#57606a;">Build</span><span>#${env.BUILD_NUMBER}</span>
    </div>
    <a href="${env.BUILD_URL}" style="display:inline-block;margin-top:20px;padding:10px 20px;background:#0969da;color:#fff;border-radius:6px;text-decoration:none;font-size:14px;font-weight:600;">View Full Run Logs →</a>
  </div>
  <div style="padding:16px 28px;border-top:1px solid #d0d7de;font-size:12px;color:#57606a;text-align:center;">
    This email was sent automatically by Jenkins · QCOS CI/CD Pipeline (Sandbox)
  </div>
</div>
</body>
</html>""",
                        to: "${env.CICD_REPORT_EMAIL}",
                        mimeType: 'text/html'
                    )
                }
            }
        }
        aborted {
            script {
                if (env.CICD_REPORT_EMAIL) {
                    emailext(
                        subject: "[QCOS CI/CD - Sandbox] 🚫 ABORTED — Build #${env.BUILD_NUMBER} on ${env.GIT_BRANCH}",
                        body: """<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"/></head>
<body style="font-family:sans-serif;background:#f6f8fa;padding:24px;">
<div style="max-width:680px;margin:0 auto;background:#fff;border-radius:8px;border:1px solid #d0d7de;overflow:hidden;">
  <div style="padding:24px 28px;border-bottom:1px solid #d0d7de;">
    <h1 style="margin:0 0 4px;font-size:20px;">🚀 QCOS CI/CD Pipeline Report (Sandbox)</h1>
    <p style="color:#57606a;font-size:14px;margin:0;">Build #${env.BUILD_NUMBER} · ${env.GIT_BRANCH}</p>
  </div>
  <div style="padding:16px 28px;background:#fff8c5;color:#9a6700;font-size:18px;font-weight:600;">
    Overall Status: 🚫 ABORTED
  </div>
  <div style="padding:20px 28px;">
    <h2 style="font-size:14px;color:#57606a;text-transform:uppercase;letter-spacing:.05em;margin:0 0 12px;">Pipeline Details (Sandbox)</h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;font-size:14px;">
      <span style="color:#57606a;">Branch</span><span>${env.GIT_BRANCH}</span>
      <span style="color:#57606a;">Commit</span><span>${env.GIT_COMMIT ?: 'N/A'}</span>
      <span style="color:#57606a;">Build</span><span>#${env.BUILD_NUMBER}</span>
    </div>
    <a href="${env.BUILD_URL}" style="display:inline-block;margin-top:20px;padding:10px 20px;background:#0969da;color:#fff;border-radius:6px;text-decoration:none;font-size:14px;font-weight:600;">View Full Run Logs →</a>
  </div>
  <div style="padding:16px 28px;border-top:1px solid #d0d7de;font-size:12px;color:#57606a;text-align:center;">
    This email was sent automatically by Jenkins · QCOS CI/CD Pipeline (Sandbox)
  </div>
</div>
</body>
</html>""",
                        to: "${env.CICD_REPORT_EMAIL}",
                        mimeType: 'text/html'
                    )
                }
            }
        }
    }
}

// ==========================================================================
// Helper: Clean up Docker containers and dangling images
// Reusable method called at pipeline start (Initialize) and end (post.always)
// ==========================================================================
void dockerCleanup() {
    sh """
    docker image prune -f || true
    docker ps -a -f status=exited --format "{{.Names}}" | egrep '^[a-z]+_[a-z]+\$' | xargs -r docker rm -f 2>/dev/null || true
    """
}
