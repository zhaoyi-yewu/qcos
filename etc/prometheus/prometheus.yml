global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - '/etc/prometheus/rules/*.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["${ALERT_MANAGER_TARGETS}"]

scrape_configs:
  - job_name: "qcos-metrics"
    metrics_path: /metrics
    static_configs:
      - targets: ["${QCOS_METRICS_TARGETS}"]
        labels:
          instance: "qcos-server"
          service: "wuyue-qcos"

  - job_name: "prometheus"
    static_configs:
      - targets: ["${PROMETHEUS_TARGETS}"]
        labels:
          instance: "prometheus-server"
