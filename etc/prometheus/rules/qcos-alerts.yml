groups:
  - name: qcos-alerts
    rules:
      - alert: QcosServiceUnavailable
        expr: system_healthy == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "QCOS服务不可用"
          description: "QCOS系统心跳停止已达2分钟"

      - alert: PrefectComponentDown
        expr: component_status{component="prefect"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Prefect组件异常"
          description: "Prefect组件健康检查失败超过1分钟"

      - alert: RedisComponentDown
        expr: component_status{component="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis组件异常"
          description: "Redis组件健康检查失败超过1分钟"

      - alert: FastAPIComponentDown
        expr: component_status{component="fastapi"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "FastAPI组件异常"
          description: "FastAPI组件健康检查失败超过1分钟"

      - alert: WorkerComponentDown
        expr: component_status{component="worker"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Worker组件异常"
          description: "Worker组件健康检查失败超过2分钟"

      - alert: HeartbeatStale
        expr: (time() - heartbeat_timestamp) > 300
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "心跳数据超时"
          description: "QCOS服务心跳已超过5分钟未更新"

      - alert: JobFailuresHigh
        expr: delta(total{status="failed"}[10m]) > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "任务失败率过高"
          description: "最近10分钟内任务失败超过50个"

      - alert: JobsQueueingHigh
        expr: total{status="queued"} > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "任务队列堆积"
          description: "当前排队中的任务超过50个"

      - alert: JobsCancellingStuck
        expr: total{status="cancelling"} > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "过多任务处于取消中状态"
          description: "当前取消中的任务超过10个"

      - alert: HighRequestErrorRate
        expr: sum(rate(api_requests_total{status_code=~"5.."}[5m])) / sum(rate(api_requests_total[5m])) > 0.05
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "API错误率过高"
          description: "API 5xx错误率超过5%"

      - alert: InProgressRequestsHigh
        expr: api_requests_in_progress > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API并发请求过高"
          description: "当前正在处理的API请求超过500个"

      - alert: SlowApiRequests
        expr: histogram_quantile(0.95, rate(api_request_duration_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API响应时间过长"
          description: "API P95响应时间超过2秒"

      # ===== System resource alerts (qcos_system_*) =====
      - alert: HostCpuUsageHigh
        expr: qcos_system_host_cpu_percent > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "主机CPU使用率过高"
          description: "主机CPU使用率超过90%已持续5分钟 (当前: {{ $value }}%)"

      - alert: HostMemoryUsageHigh
        expr: qcos_system_mem_percent > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "主机内存使用率过高"
          description: "主机内存使用率超过90%已持续5分钟 (当前: {{ $value }}%)"

      - alert: DiskUsageHigh
        expr: qcos_system_disk_percent > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "磁盘使用率过高"
          description: "工作分区磁盘使用率超过85%已持续5分钟 (当前: {{ $value }}%)"

      - alert: DiskUsageCritical
        expr: qcos_system_disk_percent > 95
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "磁盘即将耗尽"
          description: "工作分区磁盘使用率超过95% (当前: {{ $value }}%)"

      - alert: ApiServerMemoryHigh
        expr: qcos_system_rss_mb > 4096
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API服务进程内存占用过高"
          description: "API server进程RSS内存超过4GB已持续5分钟 (当前: {{ $value }}MB)"

      - alert: ApiServerThreadLeak
        expr: qcos_system_thread_count > 200
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "API服务线程数异常"
          description: "API server线程数超过200已持续10分钟，可能存在线程泄漏 (当前: {{ $value }})"
