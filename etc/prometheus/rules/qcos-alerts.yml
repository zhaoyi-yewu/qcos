groups:
  - name: qcos-alerts
    rules:
      - alert: QcosServiceUnavailable
        expr: system_healthy == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "QCOS服务不可用"
          description: "QCOS系统心跳停止已达2分钟"

      - alert: PrefectComponentDown
        expr: component_status{component="prefect"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Prefect组件异常"
          description: "Prefect组件健康检查失败超过1分钟"

      - alert: RedisComponentDown
        expr: component_status{component="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis组件异常"
          description: "Redis组件健康检查失败超过1分钟"

      - alert: FastAPIComponentDown
        expr: component_status{component="fastapi"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "FastAPI组件异常"
          description: "FastAPI组件健康检查失败超过1分钟"

      - alert: WorkerComponentDown
        expr: component_status{component="worker"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Worker组件异常"
          description: "Worker组件健康检查失败超过2分钟"

      - alert: HeartbeatStale
        expr: (time() - heartbeat_timestamp) > 300
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "心跳数据超时"
          description: "QCOS服务心跳已超过5分钟未更新"

      - alert: JobFailuresHigh
        expr: delta(total{status="failed"}[10m]) > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "任务失败率过高"
          description: "最近10分钟内任务失败超过50个"

      - alert: JobsQueueingHigh
        expr: total{status="queued"} > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "任务队列堆积"
          description: "当前排队中的任务超过50个"

      - alert: JobsCancellingStuck
        expr: total{status="cancelling"} > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "过多任务处于取消中状态"
          description: "当前取消中的任务超过10个"

      - alert: HighRequestErrorRate
        expr: sum(rate(api_requests_total{status_code=~"5.."}[5m])) / sum(rate(api_requests_total[5m])) > 0.05
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "API错误率过高"
          description: "API 5xx错误率超过5%"

      - alert: InProgressRequestsHigh
        expr: api_requests_in_progress > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API并发请求过高"
          description: "当前正在处理的API请求超过500个"

      - alert: SlowApiRequests
        expr: histogram_quantile(0.95, rate(api_request_duration_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API响应时间过长"
          description: "API P95响应时间超过2秒"

      # ===== System resource alerts (qcos_system_*) =====
      - alert: HostCpuUsageHigh
        expr: qcos_system_host_cpu_percent > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "主机CPU使用率过高"
          description: "主机CPU使用率超过90%已持续5分钟 (当前: {{ $value }}%)"

      - alert: HostMemoryUsageHigh
        expr: qcos_system_mem_percent > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "主机内存使用率过高"
          description: "主机内存使用率超过90%已持续5分钟 (当前: {{ $value }}%)"

      - alert: DiskUsageHigh
        expr: qcos_system_disk_percent > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "磁盘使用率过高"
          description: "工作分区磁盘使用率超过85%已持续5分钟 (当前: {{ $value }}%)"

      - alert: DiskUsageCritical
        expr: qcos_system_disk_percent > 95
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "磁盘即将耗尽"
          description: "工作分区磁盘使用率超过95% (当前: {{ $value }}%)"

      - alert: ApiServerMemoryHigh
        expr: qcos_system_rss_mb > 4096
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API服务进程内存占用过高"
          description: "API server进程RSS内存超过4GB已持续5分钟 (当前: {{ $value }}MB)"

      - alert: ApiServerThreadLeak
        expr: qcos_system_thread_count > 200
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "API服务线程数异常"
          description: "API server线程数超过200已持续10分钟，可能存在线程泄漏 (当前: {{ $value }})"

  # ===== Host-level alerts (node-exporter) =====
  - name: host-alerts
    rules:
      - alert: HostCpuUsageHigh
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "主机 CPU 使用率过高"
          description: "实例 {{ $labels.instance }} CPU 使用率连续 10 分钟超过 90%"

      - alert: HostMemoryUsageHigh
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "主机内存使用率过高"
          description: "实例 {{ $labels.instance }} 内存使用率连续 10 分钟超过 90%"

      - alert: HostDiskUsageHigh
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "主机磁盘使用率过高"
          description: "实例 {{ $labels.instance }} 根分区使用率超过 85%"

      - alert: HostLoadHigh
        expr: node_load15 / on(instance) group_left() count by (instance) (node_cpu_seconds_total{mode="idle"}) > 2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "主机负载过高"
          description: "实例 {{ $labels.instance }} load15 持续超过核数 2 倍"

      - alert: HostFileDescriptorExhaustion
        expr: node_filefd_allocated / node_filefd_maximum * 100 > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "文件句柄接近耗尽"
          description: "实例 {{ $labels.instance }} 文件句柄使用率超过 80%"

  # ===== QCOS process-level alerts (process-exporter) =====
  - name: qcos-process-alerts
    rules:
      - alert: QcosApiCpuHigh
        expr: rate(namedprocess_namegroup_cpu_seconds_total{groupname="qcos-api"}[5m]) * 100 > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "QCOS API 进程 CPU 过高"
          description: "qcos-api 进程组 CPU 使用率连续 10 分钟超过 80%"

      - alert: QcosApiMemoryHigh
        expr: sum by (groupname) (namedprocess_namegroup_memory_bytes{groupname="qcos-api", memtype="resident"}) > 4 * 1024 * 1024 * 1024
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "QCOS API 进程内存过高"
          description: "qcos-api 进程组 RSS 超过 4 GiB"

      - alert: QcosPrefectServerDown
        expr: sum(namedprocess_namegroup_num_procs{groupname="qcos-prefect-server"}) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Prefect server 进程消失"
          description: "prefect-server 进程组进程数为 0 持续 2 分钟"

      - alert: QcosPrefectWorkerDown
        expr: sum(namedprocess_namegroup_num_procs{groupname="qcos-prefect-worker"}) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Prefect worker 进程消失"
          description: "prefect-worker 进程组进程数为 0 持续 2 分钟"

      - alert: QcosPostgresDown
        expr: sum(namedprocess_namegroup_num_procs{groupname="qcos-postgres"}) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL 进程消失"
          description: "postgres 进程组进程数为 0 持续 2 分钟"

      - alert: QcosRedisDown
        expr: sum(namedprocess_namegroup_num_procs{groupname="qcos-redis"}) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Redis 进程消失"
          description: "redis-server 进程组进程数为 0 持续 2 分钟"
