[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File /fluent-bit/etc/parsers.conf
    # fluent-bit interprets naive timestamps (no explicit UTC offset)
    # in the local timezone. The container defaults to UTC, which
    # re-labels Beijing wall-clock times as UTC and makes every event
    # appear 8 hours in the future - the "can't find the latest logs"
    # bug: the WebUI's "last 30 min" window (built from real now)
    # never intersects records stamped 8h ahead. Pin the runtime TZ
    # to Asia/Shanghai so log timestamps parse as Beijing time.
    # Deployments overriding TZ via env should keep it consistent.
    TZ          Asia/Shanghai
# QCOS log files under /var/log/qcos/, one INPUT per file family so
# every record carries a fluent-bit tag naming its category (api,
# device, device_monitor, device_manager). All families share the
# global LOG_FORMAT:
#   %(asctime)s | %(levelname)s | %(module)s:%(lineno)s | %(message)s
#
# IMPORTANT: the INPUTs intentionally do NOT set `Parser`. Combining
# `Parser` + `Multiline.Parser` on the same tail input is unreliable:
# whether the parser is applied to the multiline-concatenated buffer
# depends on the fluent-bit version, and in this deployment the parse
# stage was silently skipped (records arrived with the raw `log` key
# intact, trailing "\n" from multiline, level/module missing).
# Parsing is done in the parser FILTER below instead -- filters are
# guaranteed to run AFTER input-time multiline grouping, on any version.
#
# `Path_Key file` stores the origin file path in a `file` field so
# VictoriaLogs and the WebUI can tell which file each line came from.
# device_*.log (job engine) would also match the monitor/manager
# patterns, so the device INPUT excludes them via Exclude_Path.
[INPUT]
    Name              tail
    Path              /var/log/qcos/qcos-api.log
    Tag               qcos.api
    Multiline.Parser  qcos_multiline
    Path_Key          file
    Refresh_Interval  5
    Read_from_Head    True
[INPUT]
    Name              tail
    Path              /var/log/qcos/device_monitor_*.log
    Tag               qcos.device_monitor
    Multiline.Parser  qcos_multiline
    Path_Key          file
    Refresh_Interval  5
    Read_from_Head    True
[INPUT]
    Name              tail
    Path              /var/log/qcos/device_manager_*.log,/var/log/qcos/device_mgr_*.log
    Tag               qcos.device_manager
    Multiline.Parser  qcos_multiline
    Path_Key          file
    Refresh_Interval  5
    Read_from_Head    True
[INPUT]
    Name              tail
    Path              /var/log/qcos/device_*.log
    Exclude_Path      /var/log/qcos/device_monitor_*.log,/var/log/qcos/device_manager_*.log,/var/log/qcos/device_mgr_*.log
    Tag               qcos.device
    Multiline.Parser  qcos_multiline
    Path_Key          file
    Refresh_Interval  5
    Read_from_Head    True
# ---- parsing: MUST be the first FILTER ----
# Applies the `qcos` regex parser to the raw content in the `log` key
# (already multiline-grouped by the input). On success the record
# gains level/module/msg, `ts` becomes the record's event time, and
# the raw `log` key is dropped (Preserve_Key Off). On failure the
# record passes through untouched (Reserve_Data keeps `log`) so the
# fallback filters below can still salvage it.
[FILTER]
    Name          parser
    Match         qcos.*
    Key_Name      log
    Parser        qcos
    Preserve_Key  Off
    Reserve_Data  On
# ---- tag materialization (unchanged) ----
[FILTER]
    Name         record_modifier
    Match        qcos.api
    Record       tag api
[FILTER]
    Name         record_modifier
    Match        qcos.device_monitor
    Record       tag device_monitor
[FILTER]
    Name         record_modifier
    Match        qcos.device_manager
    Record       tag device_manager
[FILTER]
    Name         record_modifier
    Match        qcos.device
    Record       tag device
# ---- fallbacks (unchanged; now only fire on GENUINE parse failures) ----
[FILTER]
    Name         modify
    Match        qcos.*
    Condition    Key_Does_Not_Exist msg
    Copy         log msg
[FILTER]
    Name         modify
    Match        qcos.*
    Condition    Key_Does_Not_Exist level
    Add          level UNKNOWN
[FILTER]
    Name         modify
    Match        qcos.*
    Condition    Key_Does_Not_Exist module
    Add          module -
[FILTER]
    Name         record_modifier
    Match        qcos.*
    Record       job "qcos"
    Record       hostname "${HOSTNAME}"
[OUTPUT]
    Name                http
    Match               qcos.*
    Host                127.0.0.1
    Port                ${VICTORIALOGS_LISTEN_PORT:-9428}
    # DO NOT pass _time_field. The fluent-bit image is a musl static
    # build without tzdata: its parser converts the naive Beijing
    # wall-clock timestamp as if it were UTC, producing an event epoch
    # +8h ahead of real time. That epoch then fed _time via
    # _time_field=date, and the WebUI's time-window queries (built
    # from the real clock) never matched - "no recent logs".
    # Without _time_field VictoriaLogs stamps each record with the
    # INGESTION time, which is correct regardless of the parser's
    # timezone handling (tail lag is ~1s). The wall-clock `date` field
    # is still attached (json_lines always emits it) for reference.
    URI                 /insert/jsonline?_stream_fields=job,tag,level,hostname,module&_msg_field=msg
    Format              json_lines
    Log_Response_Payload True
