# QCOS log parser.
#
# All QCOS log files (qcos-api.log, device_*.log, device_monitor_*.log,
# device_manager_*.log, device_mgr_*.log) share the global LOG_FORMAT:
#   %(asctime)s | %(levelname)s | %(module)s:%(lineno)s | %(message)s
# Example:
#   2026-11-03 15:55:57,834 | INFO | httptools_impl:485 | 100.78.61.22 - "GET / HTTP/1.1" 200
#
# `module` captures the full "module:lineno" pair so the origin module
# and line stay visible in the WebUI log list; the source file itself
# is added by the tail plugin's Path_Key (field `file`).

[PARSER]
    Name        qcos
    Format      regex
    # `module` captures the full "module:lineno" pair so the WebUI can
    # display the exact origin (e.g. "httptools_impl:485") in one cell.
    #
    # Timestamp may or may not carry a milliseconds suffix:
    #   "2026-11-03 15:55:57,834"  -- qcos-api.log (with %L)
    #   "2026-11-03 17:10:25"      -- device_monitor_*.log / device_*.log
    # fluent-bit's `Time_Format` is a single strptime string and cannot
    # accept both forms in one directive, so we capture only the
    # seconds-precision portion as `ts` for `Time_Key` and discard the
    # optional `,SSS` suffix into a separate non-time field. Sub-second
    # ordering across streams is preserved by fluent-bit's ingestion
    # time, which is good enough for log browsing.
    #
    # `msg` uses `[\s\S]*` (matches newlines too) instead of `.*`
    # because one log record may span multiple physical lines after
    # multiline grouping (see the qcos_multiline parser below).
    Regex       ^(?<ts>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})(?<ts_ms>,\d{3})? \| (?<level>\w+) \| (?<module>[\w.]+:\d+) \| (?<msg>[\s\S]*)
    Time_Key    ts
    Time_Format %Y-%m-%d %H:%M:%S

# Multiline grouping: one log record may span several physical lines.
# Python logging writes message bodies containing newlines (e.g.
# device_manager dumps multi-line device info), and the tail input
# reads line by line, so continuation lines would otherwise be
# ingested as separate unparsed records.
#
# A new record always starts with "YYYY-MM-DD HH:MM:SS(,SSS) | LEVEL";
# every line NOT starting with that timestamp pattern is a
# continuation of the previous record (negative lookahead).
[MULTILINE_PARSER]
    Name          qcos_multiline
    Type          regex
    Flush_Timeout 1000
    # Start: timestamp header of a new log record
    Rule          "start_state" "/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}/" "cont"
    # Continue: anything that is not the header of a new record
    Rule          "cont" "/^(?!\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})/" "cont"

# Prefect server / worker / flow-run logs
[PARSER]
    Name        prefect
    Format      regex
    # `module` keeps the file:line pair (e.g. "__init__.py:1706") so the
    # WebUI log list can render the origin the same way as qcos logs.
    Regex       ^(?<ts>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}(?:,\d{3})?) (?<level>[A-Z]+) (?<module>[\w.]+:\d+) (?<msg>.*)$
    Time_Key    ts
    Time_Format %Y-%m-%d %H:%M:%S,%L
