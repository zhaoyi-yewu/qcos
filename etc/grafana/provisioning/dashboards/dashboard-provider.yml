apiVersion: 1

providers:
  - name: "default"
    orgId: 1
    folder: "QCOS"
    folderUid: "qcos-monitoring"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
