version: 1
disable_existing_loggers: false

formatters:
  standard:
    (): prefect.logging.formatters.PrefectFormatter
    format: "%(asctime)s | %(levelname)s | %(module)s:%(lineno)d | %(message)s"
    flow_run_fmt: "%(asctime)s | %(levelname)s | %(module)s:%(lineno)d | Flow run %(flow_run_name)r - %(message)s"
    task_run_fmt: "%(asctime)s | %(levelname)s | %(module)s:%(lineno)d | Task run %(task_run_name)r - %(message)s"
  debug:
    format: "%(asctime)s | %(levelname)s | %(module)s:%(lineno)d | %(message)s"
  file:
    format: "%(asctime)s | %(levelname)s | %(module)s:%(lineno)d | %(message)s"

handlers:
  console:
    level: NOTSET
    class: prefect.logging.handlers.PrefectConsoleHandler
    formatter: standard
    styles:
      log.web_url: bright_blue
      log.local_url: bright_blue
      log.info_level: cyan
      log.warning_level: yellow3
      log.error_level: red3
      log.critical_level: bright_red
      log.completed_state: green
      log.cancelled_state: yellow3
      log.failed_state: red3
      log.crashed_state: bright_red
      log.cached_state: bright_blue
      log.flow_run_name: magenta
      log.flow_name: bold magenta
  debug:
    level: NOTSET
    class: logging.StreamHandler
    formatter: debug
  api:
    level: NOTSET
    class: prefect.logging.handlers.APILogHandler
  worker_api:
    level: NOTSET
    class: prefect.logging.handlers.WorkerAPILogHandler
  file:
    level: NOTSET
    class: logging.handlers.RotatingFileHandler
    formatter: file
    filename: /var/log/qcos/prefect.log
    maxBytes: 10485760
    backupCount: 10
    encoding: utf-8

loggers:
  prefect:
    level: INFO
  prefect.extra:
    level: INFO
    handlers: [api]
    propagate: false
  prefect.flow_runs:
    level: NOTSET
    handlers: [api]
  prefect.task_runs:
    level: NOTSET
    handlers: [api]
  prefect.workers:
    level: NOTSET
    handlers: [worker_api]
  prefect.server:
    level: WARNING
  prefect.client:
    level: INFO
  prefect.infrastructure:
    level: INFO
  prefect._internal:
    level: ERROR
    handlers: [debug, file]
    propagate: false
  uvicorn:
    level: WARNING
    handlers: [console, file]
    propagate: false
  fastapi:
    level: WARNING
    handlers: [console, file]
    propagate: false

root:
  level: WARNING
  handlers: [console, file]
