[lq_qz01_repetition]
alias_name = "逻辑比特 QZ01-repetition_code"
driver = "DriverLqQZ01RepetitionCode"
description = "逻辑比特 QZ01-repetition_code"

# [Optional] enable or disable the device
# enable = true

# [Optional] debug
# debug = false
debug = false

# [Optional] device log file path
# device_log_file = /var/log/qcos/device_lq_qz01_repetition.log
device_log_file = "/var/log/qcos/device_lq_qz01_repetition.log"

# [Optional] device manager log file path
# mgr_log_file = /var/log/qcos/device_mgr_lq_qz01_repetition.log

# [Optional] log format string
# log_format = "%(asctime)s | %(levelname)s | %(module)s:%(lineno)s %(message)s"

# [Optional] log rotate, max_size (MB). default: 10MB
# log_rotate_max_size_mb = 10

# [Optional] log rotate, backup count. default: 10
# log_rotate_backup_count = 10

# [Optional] log rotate, compression. default: true
# log_rotate_compression = true

# [Optional] max queued jobs, -1 means unlimited
max_queued_jobs = -1

# [Optional] max job wait time, default value is 604800 seconds (7 days)
max_job_wait_time = 604800

# [Optional] job query interval, default value is 5 seconds
job_query_interval = 5

chip_name = "QZ01-repetition_code"
token = ""
url = "https://cloud.logicalqubit.com"

[lq_qz01_repetition.device_monitor]
# [Optional] enable device monitor
enable_device_monitor = true

# [Optional] device monitor log file path
monitor_log_file = "/var/log/qcos/device_monitor_lq_qz01_repetition.log"

# [Optional] monitor polling interval (secs)
polling_interval = 60

[lq_qz01_repetition.transpiler.qpu_configs]
