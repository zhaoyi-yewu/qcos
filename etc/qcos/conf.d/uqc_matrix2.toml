[uqc_matrix2]
alias_name = "幺正量子 UQC-Matrix2 离子阱驱动"
driver = "DriverUQCMatrix2"
description = "幺正量子 UQC-Matrix2 离子阱驱动"

# [Optional] max qubits of device
# device_max_qubits = 100

# [Optional] debug
# debug = false
debug = false

# [Optional] device log file path
# device_log_file = /var/log/qcos/device_uqc_matrix2.log
device_log_file = "/var/log/qcos/device_uqc_matrix2.log"

# [Optional] device monitor log file path
# monitor_log_file = /var/log/qcos/device_montior_uqc_matrix2.log
monitor_log_file = "/var/log/qcos/device_monitor_uqc_matrix2.log"

# [Optional] device manager log file path
# mgr_log_file = /var/log/qcos/device_mgr_uqc_matrix2.log

# [Optional] max queued jobs, -1 means unlimited
max_queued_jobs = -1

uqc_host = "cloud.unitaryqubit.com"
uqc_port = 8003
password_token = ""
# backend_device_name: "Matrix2" or "qiskit-sim"
backend_device_name = "Matrix2"
