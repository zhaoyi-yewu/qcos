# QCOS configures
[DEFAULT]
# Global debug switch; when enabled, lowers global log level to DEBUG
DEBUG = false

# [GLOBAL CONFIG] authentication mode: "no" (default), "jwt", "virtual_instance"
AUTH_MODE = "no"
# [GLOBAL CONFIG] max jobs (all status), -1: unlimited
MAX_JOBS = -1
# [GLOBAL CONFIG] max queued+running jobs, -1: unlimited
MAX_QUEUED_JOBS = -1
# [GLOBAL CONFIG] job scan interval in minutes (default: 60)
JOB_SCAN_INTERVAL = 60
# [GLOBAL CONFIG] job expiration days, jobs older than this will be auto-deleted, -1: never expire
JOB_EXPIRE_DAYS = -1
# [GLOBAL CONFIG] completed flow-run expiration days, flow-runs older than this will be auto-deleted, -1: never expire
FLOW_EXPIRE_DAYS = 1
# [GLOBAL CONFIG] periodic garbage collection interval in days: runs gc.collect (all 3 generations) + malloc_trim(0), -1: disabled
GC_INTERVAL = 1
# [GLOBAL CONFIG] default venv base dir
# VENV_DIR = "/var/lib/qcos/venv"

[TRANSPILER]
# Transpiler debug switch; only affects transpiler modules, enables PERF level logs when enabled
DEBUG = false

[API_SERVER]
# API workers
API_WORKERS = 8
# API server listen ip.
# listen on all IPv4+IPv6 address (Default): API_SERVER_LISTEN_IP = ""
# listen on all IPV4 address: API_SERVER_LISTEN_IP = "0.0.0.0"
# listen on all IPv6 address: API_SERVER_LISTEN_IP = "::"
API_SERVER_LISTEN_IP = ""
# API server listen port
API_SERVER_LISTEN_PORT = 18400

[SCHEDULER]
# enable auto scheduling (select device automatically when backend
# is not specified in submit_job)
ENABLE_AUTO_SCHEDULE = true
# enabled filter class names; empty list uses all DEFAULT_FILTERS
# available filters:
#   CodeTypeFilter, InputConstraintsFilter, DeviceStatusFilter,
#   QubitCountFilter, TechTypeFilter, GateFidelityFilter,
#   QueueLimitFilter, DeviceAvailabilityFilter, DeviceNameFilter,
#   DeviceGroupFilter
ENABLED_FILTERS = [
    "CodeTypeFilter",
    "InputConstraintsFilter",
    "DeviceStatusFilter",
    "TechTypeFilter",
    "QubitCountFilter",
    "QueueLimitFilter",
    "GateFidelityFilter",
    "DeviceAvailabilityFilter",
    "DeviceNameFilter",
    "DeviceGroupFilter",
]
# enabled weigher class names; empty list uses all DEFAULT_WEIGHERS
# available weighers: DeviceAvailabilityWeigher, DeviceLoadWeigher,
# AvgExecTimeWeigher
ENABLED_WEIGHERS = [
    "DeviceAvailabilityWeigher",
    "DeviceLoadWeigher",
    "AvgExecTimeWeigher",
]

[USERS]
# max jobs (per user, all status), -1: unlimited
MAX_JOBS = -1
# password expiry days, 0: never expired
PASSWORD_EXPIRY_DAYS = 90
# max login attempts before lockout
MAX_LOGIN_ATTEMPTS = 5
# max login logs per user
MAX_LOGIN_LOGS = 10000
# lockout duration in minutes after reaching max login attempts
LOCKOUT_DURATION_MINUTES = 30
# access control model
ACCESS_CONTROL_MODEL_FILE = "/etc/qcos/roles/casbin_model.conf"
# access control policy file
ACCESS_CONTROL_POLICY_FILE = "/etc/qcos/roles/policy.conf"
# default admin user password (hashed with PASSWORD_SALT)
DEFAULT_ADMIN_PASSWORD = "P*ssword1"
# jwt secret key for authentication
JWT_AUTH_SECRET_KEY = "47pW_6k8A4iU1Z8-r8G2j4_xN9M5V3L7Q9p2X1Y4Z0A"
# jwt auth algorithm
JWT_AUTH_ALGORITHM = "HS256"
# jwt access token expire minutes
ACCESS_TOKEN_EXPIRE_MINUTES = 30
# jwt refresh token expire days
REFRESH_TOKEN_EXPIRE_DAYS = 7

[VIRT]
# salt for password/encryption
PASSWORD_SALT = "123456"

[DATABASE]
# QCOS database connection URL (sqlite or postgresql)
# eg:
# postgresql: "postgresql+psycopg://qcos:${password}@127.0.0.1:5432/qcos"
# sqlite: "sqlite:////var/qcos/db/qcos.db?timeout=30&journal_mode=WAL"
QCOS_DATABASE_CONNECTION_URL = "postgresql+psycopg://qcos:${QCOS_DATABASE_PASSWORD}@127.0.0.1:5432/qcos"

[REDIS]
# redis server ip
REDIS_SERVER_IP = "127.0.0.1"
# redis server port
REDIS_SERVER_PORT = 6379

[PREFECT]
PREFECT_API_URL = "http://127.0.0.1:4200/api"
# QCOS database configs
# eg:
# pgsql: "postgresql+asyncpg://prefect:${password}@127.0.0.1:5432/qcos"
# sqlite: "sqlite+aiosqlite:////var/qcos/db/prefect.db?timeout=30&journal_mode=WAL"
PREFECT_SERVER_DATABASE_CONNECTION_URL = "postgresql+asyncpg://prefect:${PREFECT_DATABASE_PASSWORD}@127.0.0.1:5432/prefect"
PREFECT_WORKER_QUERY_SECONDS = 2
PREFECT_WORKER_PREFETCH_SECONDS = 2
PREFECT_WORKER_HEARTBEAT_SECONDS = 30
PREFECT_LOCAL_STORAGE_PATH = "/var/qcos/storage"
PREFECT_LOGGING_LEVEL = "INFO"

[METRICS_SERVER]
# metrics server listen ip.
# listen on all IPv4+IPv6 address (Default): METRICS_SERVER_LISTEN_IP = ""
# listen on all IPV4 address: METRICS_SERVER_LISTEN_IP = "0.0.0.0"
# listen on all IPv6 address: METRICS_SERVER_LISTEN_IP = "::"
METRICS_SERVER_LISTEN_IP = ""
# API server listen port
METRICS_SERVER_LISTEN_PORT = 19400

[LOG]
# api log file
API_LOG_FILE = "/var/log/qcos/qcos-api.log"
# log format
LOG_FORMAT = "%(asctime)s | %(levelname)s | %(module)s:%(lineno)s %(message)s"
# log rotate, max_size (MB). default: 10MB
LOG_ROTATE_MAX_SIZE_MB = 10
# log rotate, backup count. default: 10
LOG_ROTATE_BACKUP_COUNT = 10
# log rotate, compression. default: true
LOG_ROTATE_COMPRESSION = true

[SSL]
# Enable HTTPS for API server
USE_SSL = false

# SSL CERT_FILE
# eg. CERT_FILE = "/etc/qcos/ssl/ssl.crt"
# CERT_FILE =

# SSL KEY_FILE
# eg. KEY_FILE = "/etc/qcos/ssl/ssl.key"
# KEY_FILE =

# SSL CACERT_FILE (Optional)
# eg. CACERT_FILE = "/etc/qcos/ssl/cacert.pem"
# CACERT_FILE =

[DEVICES]
# DEVICE_LIST example:
# DEVICE_LIST = ["dummy", "hanyuan1", "wy_hanyuan1", "wy_hanyuan1_sim", "tiangong100", "tiangong550_v2", "tiangong1000_v2", "spinq_rpc", "spinq_gemini", "spinq_triangulum", "uqc_matrix2", "qiskit_aer_sim", "qiskit_qasm_sim", "qutip_sim", "ciqtek_ion_1", "quafu", "hanyuan1_pulse", "lq_qz01_surface", "lq_mq02", "cetc_baihua"]
DEVICE_LIST = ["dummy", "qutip_sim"]
