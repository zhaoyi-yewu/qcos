# for development purpose
# QCOS configures
[DEFAULT]
DEBUG = false
# [GLOBAL CONFIG] max jobs (all status)
MAX_JOBS = 10000
# [GLOBAL CONFIG] max queued+running jobs
MAX_QUEUED_JOBS = 1000
# [GLOBAL CONFIG] default venv base dir
# VENV_DIR = "/var/lib/qcos/venv"

[VIRT]
# enable virtualization
ENABLE_VIRT = false
# [GLOBAL CONFIG] max jobs for virtual instance
MAX_JOBS_PER_VIRTUAL_INSTANCE = 10
# salt for password/encryption
PASSWORD_SALT = "123456"

[API_SERVER]
# API workers
API_WORKERS = 8
# API server listen ip.
# listen on all IPv4+IPv6 address (Default): API_SERVER_LISTEN_IP = ""
# listen on all IPV4 address: API_SERVER_LISTEN_IP = "0.0.0.0"
# listen on all IPv6 address: API_SERVER_LISTEN_IP = "::"
API_SERVER_LISTEN_IP = ""
# API server listen port
API_SERVER_LISTEN_PORT = 18400

[METRICS_SERVER]
# metrics server listen ip.
# listen on all IPv4+IPv6 address (Default): METRICS_SERVER_LISTEN_IP = ""
# listen on all IPV4 address: METRICS_SERVER_LISTEN_IP = "0.0.0.0"
# listen on all IPv6 address: METRICS_SERVER_LISTEN_IP = "::"
METRICS_SERVER_LISTEN_IP = ""
# API server listen port
METRICS_SERVER_LISTEN_PORT = 19400

[PREFECT]
PREFECT_API_URL = "http://127.0.0.1:4200/api"
PREFECT_SERVER_DATABASE_CONNECTION_URL = "sqlite+aiosqlite:///var/qcos/db/prefect.db"
PREFECT_WORKER_QUERY_SECONDS = 2
PREFECT_WORKER_PREFETCH_SECONDS = 2
PREFECT_WORKER_HEARTBEAT_SECONDS = 30
PREFECT_LOCAL_STORAGE_PATH = "/var/qcos/storage"
PREFECT_LOGGING_LEVEL = "INFO"

[REDIS]
# redis server ip
REDIS_SERVER_IP = "127.0.0.1"
# redis server port
REDIS_SERVER_PORT = 6379

[DATABASE]
# eg.
# nodb: fake,
# pgsql db: "postgresql+pg8000://postgres:${password}@100.78.61.22:5432/qcos"
QCOS_DATABASE_CONNECTION_URL = "fake"

[USERS]
ENABLE_USER_MGMT = false
PASSWORD_EXPIRY_DAYS = 90
MAX_LOGIN_ATTEMPTS = 5
LOCKOUT_DURATION_MINUTES = 30
ACCESS_CONTROL_MODEL_FILE = "/etc/qcos/roles/casbin_model.conf"
ACCESS_CONTROL_POLICY_FILE = "/etc/qcos/roles/policy.conf"
ADMIN_PASSWORD = "++gAAAAABpt8fIFNquoHfkm0jqDAtQWKit9f1y7Ns479NBgzSGCUvwhlJcrUaL0CU0qkXX9OQpDFXNzCUU1dR37-HqqTFIevAWqQ=="

[LOG]
# api log file
API_LOG_FILE = "/var/log/qcos/qcos-api.log"
# log format
LOG_FORMAT = "%(asctime)s | %(levelname)s | %(module)s:%(lineno)s %(message)s"
# log rotate, max_size (MB). default: 10MB
LOG_ROTATE_MAX_SIZE_MB = 10
# log rotate, backup count. default: 10
LOG_ROTATE_BACKUP_COUNT = 10
# log rotate, compression. default: true
LOG_ROTATE_COMPRESSION = true

[SSL]
# Enable HTTPS for API server
USE_SSL = false

# SSL CERT_FILE
# eg. CERT_FILE = "/etc/qcos/ssl/ssl.crt"
# CERT_FILE =

# SSL KEY_FILE
# eg. KEY_FILE = "/etc/qcos/ssl/ssl.key"
# KEY_FILE =

# SSL CACERT_FILE (Optional)
# eg. CACERT_FILE = "/etc/qcos/ssl/cacert.pem"
# CACERT_FILE =

[DEVICES]
# DEVICE_LIST example:
# DEVICE_LIST = ["dummy", "hanyuan1", "wy-hanyuan1", "tiangong100", "tiangong100_v2", "tiangong550_v2", "tiangong1000_v2", "spinq_rpc", "spinq_gemini", "spinq_triangulum", "uqc_matrix2", "qiskit_aer_sim", "qiskit_qasm_sim", "qutip_sim", "ciqtek_ion_1"]
DEVICE_LIST = ["dummy", "qutip_sim"]
