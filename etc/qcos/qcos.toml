# QCOS configures
[DEFAULT]
# Global debug switch; when enabled, lowers global log level to DEBUG
DEBUG = false

# [GLOBAL CONFIG] authentication mode: "no" (default), "jwt", "virtual_instance"
AUTH_MODE = "no"
# [GLOBAL CONFIG] max jobs (all status), -1: unlimited
MAX_JOBS = -1
# [GLOBAL CONFIG] max queued+running jobs, -1: unlimited
MAX_QUEUED_JOBS = -1
# [GLOBAL CONFIG] job scan interval in minutes (default: 60)
JOB_SCAN_INTERVAL = 60
# [GLOBAL CONFIG] job expiration days, jobs older than this will be auto-deleted, -1: never expire
JOB_EXPIRE_DAYS = -1
# [GLOBAL CONFIG] completed flow-run expiration days, flow-runs older than this will be auto-deleted, -1: never expire
FLOW_EXPIRE_DAYS = 1
# [GLOBAL CONFIG] periodic garbage collection interval in days: runs gc.collect (all 3 generations) + malloc_trim(0), -1: disabled
GC_INTERVAL = 1
# [GLOBAL CONFIG] default venv base dir
# VENV_DIR = "/var/lib/qcos/venv"

[TRANSPILER]
# Transpiler debug switch; only affects transpiler modules, enables PERF level logs when enabled
DEBUG = false

[API_SERVER]
# API workers
API_WORKERS = 8
# API server listen ip.
# listen on all IPv4+IPv6 address (Default): API_SERVER_LISTEN_IP = ""
# listen on all IPV4 address: API_SERVER_LISTEN_IP = "0.0.0.0"
# listen on all IPv6 address: API_SERVER_LISTEN_IP = "::"
API_SERVER_LISTEN_IP = ""
# API server listen port
API_SERVER_LISTEN_PORT = 18400

[SCHEDULER]
# enable auto scheduling (select device automatically when backend
# is not specified in submit_job)
ENABLE_AUTO_SCHEDULE = true
# enabled filter class names; empty list uses all DEFAULT_FILTERS
# available filters:
# CodeTypeFilter, InputConstraintsFilter, DeviceStatusFilter,
# TechTypeFilter, QueueLimitFilter, GateFidelityFilter,
# DeviceAvailabilityFilter, DeviceNameFilter, DeviceGroupFilter,
# QubitCountFilter
ENABLED_FILTERS = [
    "CodeTypeFilter",
    "InputConstraintsFilter",
    "DeviceStatusFilter",
    "TechTypeFilter",
    "QueueLimitFilter",
    "GateFidelityFilter",
    "DeviceAvailabilityFilter",
    "DeviceNameFilter",
    "DeviceGroupFilter",
    "QubitCountFilter",  # must be last for auto wirecut
]
# enabled weigher class names; empty list uses all DEFAULT_WEIGHERS
# available weighers: DeviceAvailabilityWeigher, DeviceLoadWeigher,
# AvgExecTimeWeigher
ENABLED_WEIGHERS = [
    "DeviceAvailabilityWeigher",
    "DeviceLoadWeigher",
    "AvgExecTimeWeigher",
]

[USERS]
# max jobs (per user, all status), -1: unlimited
MAX_JOBS = -1
# password expiry days, 0: never expired
PASSWORD_EXPIRY_DAYS = 90
# max login attempts before lockout
MAX_LOGIN_ATTEMPTS = 5
# max login logs per user
MAX_LOGIN_LOGS = 10000
# lockout duration in minutes after reaching max login attempts
LOCKOUT_DURATION_MINUTES = 30
# access control model
ACCESS_CONTROL_MODEL_FILE = "/etc/qcos/roles/casbin_model.conf"
# access control policy file
ACCESS_CONTROL_POLICY_FILE = "/etc/qcos/roles/policy.conf"
# default admin user password (hashed with PASSWORD_SALT)
DEFAULT_ADMIN_PASSWORD = "P*ssword1"
# jwt secret key for authentication
JWT_AUTH_SECRET_KEY = "47pW_6k8A4iU1Z8-r8G2j4_xN9M5V3L7Q9p2X1Y4Z0A"
# jwt auth algorithm
JWT_AUTH_ALGORITHM = "HS256"
# jwt access token expire minutes
ACCESS_TOKEN_EXPIRE_MINUTES = 30
# jwt refresh token expire days
REFRESH_TOKEN_EXPIRE_DAYS = 7

[VIRT]
# salt for password/encryption
PASSWORD_SALT = "123456"

[DATABASE]
# QCOS database connection URL (sqlite or postgresql)
# eg:
# postgresql: "postgresql+psycopg://qcos:${password}@127.0.0.1:5432/qcos"
# sqlite: "sqlite:////var/qcos/db/qcos.db?timeout=30&journal_mode=WAL"
QCOS_DATABASE_CONNECTION_URL = "postgresql+psycopg://qcos:${QCOS_DATABASE_PASSWORD}@127.0.0.1:5432/qcos"

[REDIS]
REDIS_URL = "redis://:${REDIS_PASSWORD}@${REDIS_SERVER_IP:-127.0.0.1}:${REDIS_SERVER_PORT:-6379}/0"

[PREFECT]
PREFECT_API_URL = "http://127.0.0.1:4200/api"
# QCOS database configs
# eg:
# pgsql: "postgresql+asyncpg://prefect:${password}@127.0.0.1:5432/qcos"
# sqlite: "sqlite+aiosqlite:////var/qcos/db/prefect.db?timeout=30&journal_mode=WAL"
# NOTE: pool_size and max_overflow are appended as query parameters to
# increase the asyncpg connection pool for Prefect's PostgreSQL backend.
# Default asyncpg pool is ~5-10 connections; large QUBO payloads (8MB+)
# can hold connections for extended periods, exhausting the pool and
# causing TimeoutError on subsequent requests. Increasing pool_size to
# 20 and max_overflow to 40 provides headroom for concurrent large jobs.
PREFECT_SERVER_DATABASE_CONNECTION_URL = "postgresql+asyncpg://prefect:${PREFECT_DATABASE_PASSWORD}@127.0.0.1:5432/prefect?pool_size=200&max_overflow=400"
PREFECT_WORKER_QUERY_SECONDS = 2
PREFECT_WORKER_PREFETCH_SECONDS = 2
PREFECT_WORKER_HEARTBEAT_SECONDS = 30
PREFECT_LOCAL_STORAGE_PATH = "/var/qcos/storage"
PREFECT_LOGGING_LEVEL = "INFO"
# Timeout (seconds) for create_flow_run_from_deployment calls.
# Large parameter payloads (e.g. big QUBO matrices) can cause the
# Prefect API to hang if the PostgreSQL connection pool is exhausted.
# This timeout ensures QCOS fails fast instead of hanging indefinitely.
QCOS_FLOW_RUN_TIMEOUT = 600

[METRICS_SERVER]
# metrics server listen ip.
# listen on all IPv4+IPv6 address (Default): METRICS_SERVER_LISTEN_IP = ""
# listen on all IPV4 address: METRICS_SERVER_LISTEN_IP = "0.0.0.0"
# listen on all IPv6 address: METRICS_SERVER_LISTEN_IP = "::"
METRICS_SERVER_LISTEN_IP = ""
# API server listen port
METRICS_SERVER_LISTEN_PORT = 19400

[PROXY]
# Reverse-proxy upstream endpoints mounted under /v1/proxy/<service>.
# Empty string disables the corresponding proxy endpoint.
# Prometheus base URL (used by /v1/proxy/prometheus/*)
PROMETHEUS_BASE_URL = "http://127.0.0.1:9090"
# Alertmanager base URL (used by /v1/proxy/alertmanager/*)
ALERTMANAGER_BASE_URL = "http://127.0.0.1:9093"

[LOG]
# api log file
API_LOG_FILE = "/var/log/qcos/qcos-api.log"
# log format
LOG_FORMAT = "%(asctime)s | %(levelname)s | %(module)s:%(lineno)s %(message)s"
# log rotate, max_size (MB). default: 10MB
LOG_ROTATE_MAX_SIZE_MB = 10
# log rotate, backup count. default: 10
LOG_ROTATE_BACKUP_COUNT = 10
# log rotate, compression. default: true
LOG_ROTATE_COMPRESSION = true

[SSL]
# Enable HTTPS for API server
USE_SSL = false

# SSL CERT_FILE
# eg. CERT_FILE = "/etc/qcos/ssl/ssl.crt"
# CERT_FILE =

# SSL KEY_FILE
# eg. KEY_FILE = "/etc/qcos/ssl/ssl.key"
# KEY_FILE =

[TERMINAL]
# Master switch for the in-browser terminal. Default off; flip to true
# to expose /v1/terminal/ws and /v1/terminal/files on the API server.
ENABLED = true

# Idle session timeout in seconds; sessions idle longer than this are
# reaped by the background task. 0 disables the reaper.
IDLE_TIMEOUT_SECONDS = 1800

# Per-user and global concurrent session caps.
MAX_SESSIONS_PER_USER = 4
MAX_SESSIONS_TOTAL = 128

# Default shell path inside the sandbox (used when ENTRY_COMMAND is empty).
DEFAULT_SHELL = "/bin/bash"

# Entry command spawned inside the sandbox. Change to
# "qcos-cli interactive" for a QCOS-native REPL.
ENTRY_COMMAND = "/bin/bash"

# Use bwrap for per-user isolation. false runs a bare host shell
# (debug only - do NOT use in production).
#
# NOTE: requires the qcos-api container to run with CAP_SYS_ADMIN
# (and seccomp=unconfined) for bwrap to create user/mount namespaces.
# If you see "bwrap: Creating new namespace failed: Operation not
# permitted", either grant those capabilities or set this to false.
SANDBOX_ENABLED = false

# Host directory holding one subdir per user UUID (mode 0700).
SANDBOX_ROOT = "/var/qcos/users"

# Path bind-mounted read-only inside the sandbox (QCOS install root).
QCOS_ROOT = "/bin/"

# seccomp blacklist profile name or path to a custom BPF file.
SECCOMP_PROFILE = "default"

# Sandbox network policy:
#   "none"           - default, fully disconnected (adds --unshare-net)
#   "local-api-only" - allow only 127.0.0.1:QCOS_API_PORT via host firewall
#   "full"           - no restriction (debug only)
NET_POLICY = "local-api-only"

# QCOS API listen port override; used by NET_POLICY=local-api-only as
# the only allowed egress target. When commented out / omitted, the
# value falls back to [API_SERVER].API_SERVER_LISTEN_PORT so operators
# do not need to keep two port fields in sync.
# QCOS_API_PORT = 18400

# Per-file upload size cap in megabytes for /v1/terminal/files/upload.
MAX_UPLOAD_MB = 100

# Record asciinema .cast transcripts of each session. Default off;
# transcripts may contain sensitive output.
RECORD_TRANSCRIPT = false

# Root directory for transcripts. Per-user files land in
# {TRANSCRIPT_DIR}/users/{USER_UUID}/ with mode 0700.
TRANSCRIPT_DIR = "/var/log/qcos/terminal"

[DEVICES]
# DEVICE_LIST example:
# DEVICE_LIST = ["dummy", "hanyuan1", "wy_hanyuan1", "wy_hanyuan1_sim", "tiangong100", "tiangong550_v2", "tiangong1000_v2", "spinq_rpc", "spinq_gemini", "spinq_triangulum", "spinq_sqc_25", "uqc_matrix2", "qiskit_aer_sim", "qiskit_qasm_sim", "qutip_sim", "qutip_ashn_sim", "ciqtek_ion_1", "quafu_dongling", "quafu_shenglian", "quafu_baihua", "quafu_ling", "quafu_hongluo", "hanyuan1_pulse", "lq_qz01_surface", "lq_mq02", "lq_agate100", "lq_qz02", "lq_qz01_repetition", "lq_mq02_pulse", "cetc_baihua", "qudoor_abaqu100"]
DEVICE_LIST = ["dummy", "qutip_sim"]
