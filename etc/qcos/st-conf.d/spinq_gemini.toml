[spinq_gemini]
alias_name = "量旋科技-双子座核磁量子计算机"
driver = "DriverSpinQGemini"
description = "量旋科技-双子座核磁量子计算机"

# [Optional] debug
# debug = false
debug = false

# [Optional] device log file path
# device_log_file = /var/log/qcos/device_spinq_gemini.log
device_log_file = "/var/log/qcos/device_spinq_gemini.log"

# [Optional] device manager log file path
# mgr_log_file = /var/log/qcos/device_mgr_spinq_gemini.log

# [Optional] log format string
# log_format = "%(asctime)s | %(levelname)s | %(module)s:%(lineno)s %(message)s"

# [Optional] log rotate, max size (MB). default: 10MB
# log_rotate_max_size_mb = 10

# [Optional] log rotate, backup count. default: 10
# log_rotate_backup_count = 10

# [Optional] log rotate, compression. default: true
# log_rotate_compression = true

# [Optional] max queued jobs, -1 means unlimited
max_queued_jobs = -1

# [Optional] max job wait time, default value is 604800 seconds (7 days)
max_job_wait_time = 604800

# [Optional] job query interval, default value is 5 seconds
job_query_interval = 5

# [Required] SpinQ Cloud username
username = "spinq_st_test"

# [Required] path to RSA private key file for authentication
keyfile = "/etc/qcos/conf.d/spinq_pri.key"

# [Required] SpinQ Cloud API host
# System test: points to the mock aiohttp server started by
# spinq_gemini_api_server.py (port 18626).
# Routes are registered without an /api prefix, so the host
# must not include /api.
host = "http://127.0.0.1:18626"
machine_code = "Gemini-pro-1"

[spinq_gemini.device_monitor]
# [Optional] enable device monitor
enable_device_monitor = true

# [Optional] device monitor log file path
monitor_log_file = "/var/log/qcos/device_monitor_spinq_gemini.log"

# [Optional] monitor polling interval (secs)
polling_interval = 60

[spinq_gemini.transpiler.qpu_configs]
# SpinQ Gemini NMR platform qpu configs
# 2-qubit topology from designedCouplingMap
qubits = 2

# Coupler map: bidirectional edges
coupler_map.CX0_1 = ["Q0", "Q1"]
coupler_map.CX1_0 = ["Q1", "Q0"]
