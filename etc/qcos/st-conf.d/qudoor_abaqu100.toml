eng_code = "test"
user_id = "test"

[qudoor_abaqu100.device_monitor]
enable_device_monitor = false
monitor_log_file = "/var/log/qcos/device_monitor_abaqu100.log"
polling_interval = 60

[qudoor_abaqu100.transpiler.qpu_configs]
qubits = 20
