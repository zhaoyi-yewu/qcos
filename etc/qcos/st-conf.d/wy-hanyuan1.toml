[wy-hanyuan1]
alias_name = "WY-中科酷原-汉原1"
driver = "DriverWuyueHanyuan1"
description = "WY-中科酷原-汉原1(wy-hanyuan1)"

# [Optional] max qubits of device
# device_max_qubits = 100

# [Optional] debug
# debug = false
debug = false

# [Optional] device log file path
# device_log_file = /var/log/qcos/device_wy-hanyuan1.log
device_log_file = "/var/log/qcos/device_wy-hanyuan1.log"

# [Optional] device monitor log file path
# monitor_log_file = /var/log/qcos/device_montior_wy-hanyuan1.log
monitor_log_file = "/var/log/qcos/device_monitor_wy-hanyuan1.log"

# [Optional] device manager log file path
# mgr_log_file = /var/log/qcos/device_mgr_wy-hanyuan1.log

# [Optional] max queued jobs, -1 means unlimited
max_queued_jobs = -1

# [Optional] max job wait time, default value is 604800 seconds (7 days)
max_job_wait_time = 604800

# [Optional] job query interval, default value is 5 seconds
job_query_interval = 5

ip_address = "127.0.0.1"
port = 8181
client_id = "12345678"
eng_code = "12345678"
password_secret = ""
password_pub_key = ""
password_pri_key = ""
