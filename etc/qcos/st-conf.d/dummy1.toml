[dummy1.transpiler.decomposition_rule]
# Samples
u3.params = ["a", "b", "c"]
u3.gates = [
    ["rz", [0], ["c"]],
    ["rx", [0], ["pi/2"]],
    ["rz", [0], ["b+pi"]],
    ["rx", [0], ["pi/2"]],
    ["rz", [0], ["a+pi"]]
]
h.gates = [
    ["rx", [0], ["pi/2"]]
]
