[dummy1]
alias_name = "空载测试设备1"
driver = "DriverDummy"
description = "空载测试设备1(dummy1)"

enable = true

# [Optional] max qubits of device
# device_max_qubits = 10

# [Optional] debug
# debug = false
debug = false

# [Optional] device log file path
# device_log_file = /var/log/qcos/device_dummy.log
device_log_file = "/var/log/qcos/device_dummy1.log"

# [Optional] device manager log file path
# mgr_log_file = /var/log/qcos/device_mgr_dummy.log

# [Optional] log format string
# log_format = "%(asctime)s | %(levelname)s | %(module)s:%(lineno)s %(message)s"

# [Optional] log rotate, max_size (MB). default: 10MB
# log_rotate_max_size_mb = 10

# [Optional] log rotate, backup count. default: 10
# log_rotate_backup_count = 10

# [Optional] log rotate, compression. default: true
# log_rotate_compression = true

# [Optional] max queued jobs, -1 means unlimited
max_queued_jobs = -1

[dummy1.device_monitor]
# [Optional] enable device monitor
enable_device_monitor = false

# [Optional] device monitor log file path
monitor_log_file = "/var/log/qcos/device_monitor_dummy1.log"

# [Optional] monitor polling interval (secs)
polling_interval = 60

[dummy1.transpiler.qpu_configs]
# Samples
qubits = 36
storage_area = ["P144", "P145", "P146", "P147", "P148", "P149", "P150", "P151", "P152", "P153", "P154", "P155",
                "P164", "P165", "P166", "P167", "P168", "P169", "P170", "P171", "P172", "P173", "P174", "P175",
                "P184", "P185", "P186", "P187", "P188", "P189", "P190", "P191", "P192", "P193", "P194", "P195"]
operate_area = ["P100", "P101","P106", "P107","P112", "P113","P118", "P119"]
coupler_map.R_G0 = ["P100", "P101"]
coupler_map.R_G1 = ["P106", "P107"]
coupler_map.R_G2 = ["P112", "P113"]
coupler_map.R_G3 = ["P118", "P119"]

readout_error.P144 = 1.0
readout_error.P145 = 2.0
readout_error.P146 = 3.0
readout_error.P147 = 4.0
readout_error.P148 = 5.0
readout_error.P149 = 5.0
readout_error.P150 = 6.0
readout_error.P151 = 7.0
readout_error.P152 = 6.0
