[tiangong1000_v2]
alias_name = "玻色量子-天工1000"
driver = "DriverTiangong1000V2"
description = "玻色量子-天工(tiangong1000_v2)"

# [Optional] max qubits of device
# device_max_qubits = 100

# [Optional] debug
# debug = false
debug = false

# [Optional] device log file path
# device_log_file = /var/log/qcos/device_tiangong1000_v2.log
device_log_file = "/var/log/qcos/device_tiangong1000_v2.log"

# [Optional] device monitor log file path
# monitor_log_file = /var/log/qcos/device_montior_tiangong1000_v2.log
monitor_log_file = "/var/log/qcos/device_monitor_tiangong1000_v2.log"

# [Optional] device manager log file path
# mgr_log_file = /var/log/qcos/device_mgr_tiangong1000_v2.log

# [Optional] max queued jobs, -1 means unlimited
max_queued_jobs = -1

# Backend configs
# [Required] user id
user_id = "000000000000001"
# [Required] sdk code
password_sdk_code = ""

# [Required] machine name
machine_name = "CPQC-1000"

# 用户可灵活配置domain_url_auth。
# 生产域: https://open.qboson.com
# 测试域：https://open-pre.qboson.com
domain_url_auth = "https://open-pre.qboson.com"

# 用户可灵活配置domain_url_task。
# 生产域: https://new-open.qboson.com
# 测试域：https://new-open-pre.qboson.com
domain_url_task = "https://new-open-pre.qboson.com"
