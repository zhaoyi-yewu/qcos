# 性能测试基础参数，默认注释的参数可以忽略
[transpile]
# 超时时间（秒），单个线路转译总时间超过此值后，跳过后续更大规模的线路，默认 0 表示不启用
# tmax = 0
# 运行次数，每个线路运行编译器的次数, 最终结果取平均，默认 1，最小 1
run_count = 1
# 输出日志文件路径和性能测试结果文件，绝对路径或项目的相对路径
# output_log = ""
# csv_file = ""

# 测试集必须配置，绝对路径或项目的相对路径
# 100比特5万深度测试线路：./samples/qasm/2.0/random_circuit_n100_d50000.qasm
files = ["./samples/qasm/2.0/simple-qasm.qasm"]
dirs = []

# 性能日志开关，true 时允许 PERF 级别日志输出，默认为false
perf_enabled = false
# 性能日志信息开关，默认为false
# true 时，输出完整的各阶段时间
# false 时，只输出 parse/transpile/total 时间
# enable_detail = false

# 是否启用 C++ 一体化 transpile（单电路 sabre 路由路径），默认 true
# 注意：当开启时，无法使用csv文件格式输出
# enable_transpile_single = true

# 是否将 transpile 后的 basis_gate_list 写出为 qasm 文件，默认 false
# enable_output_qasm = false
# qasm 输出目录，绝对路径或项目的相对路径；留空时写到输入文件所在目录
# qasm_output_dir = ""
# qasm 版本，可选 "2.0" 或 "3.0"，默认 "2.0"
# qasm_version = "2.0"

[transpile.transpiler]
# 默认为true
# enable_transpiler = true
# base_gates 基础门集, 支持多组输入; 未配置时根据 tech_type 自动选择:
#   超导 (superconducting) -> rx, ry, cx
#   中性原子 (neutral_atom) -> rx, ry, cz
# base_gates = ["rx, ry, cx"]

[transpile.optimize]
# 默认opt_level为[1]
opt_level = [1]

[transpile.mapping]
# 默认为true
# enable_mapping = true
# 拓扑类型，可选 "superconducting" 或 "neutral_atom"，支持单个或多个输入
# 未配置时从 config_file 的 driver 字段自动推断
# 配置 tech_type 但未配置 config_file 时使用默认值:
#   superconducting -> etc/topology/spinq_rpc_156.toml
#   neutral_atom -> etc/topology/hanyuan1_100.toml
# 同时配置 tech_type 和 config_file 时, 会验证 driver 是否匹配
tech_type = ["superconducting"]
# config_file = ["./etc/topology/spinq_rpc_156.toml"]

# 拓扑类型选择中性原子（neutral_atom）时，支持配置选择mapping算法
# 支持的算法："default"、"ZAP"、"ZAC"（大小写不敏感）
# - default / ZAP：走 C++ 一体化 transpile 路径（enable_transpile_single）
# - ZAC：走 Python mapping 路径
# na_mapping_type = "default"

# 超导（superconducting）时，支持配置选择mapping算法
# json格式的字符串，表示不同算法组合输入，默认不输入，但元素必须与config_file一一对应
# sc_mapping_options = ["""
#     {
#             "routing_algorithm": "sc",
#             "select_mode": ["KS", 2],
#             "use_prune": 1,
#             "use_hash": 1,
#             "score_layer": 1,
#             "mode_sim": ["fix_cx_num", [10, 3]],
#             "score_decay_rate_size": 0.7,
#             "score_decay_rate_depth": 0.85
#     }
# """]
sc_mapping_options = ["""
    {
        "routing_algorithm": "sabre"
    }
"""]
